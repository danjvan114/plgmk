<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/mk/kn/uploads/kn.png">
    <meta charset="UTF-8">
    <title>发布新帖 - 论坛</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:url('https://cdn-community.bcmcdn.com/47/community/OgneOV5nxD4XUr5XY9sJm55OmhSJ9QtD8AYQWRyYSjhW.png?hash=FlJ5Wa_ObKYVdPojuGh0_rXSdKX7') no-repeat center center fixed;background-size:cover;min-height:100vh;padding-bottom:40px;overflow-x:hidden}
        body.page-enter{animation:slideInFromRight .35s cubic-bezier(.4,0,.2,1)}
        @keyframes slideInFromRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        header{width:100%;height:56px;background:rgba(76,175,80,.85);position:fixed;top:0;left:0;display:flex;align-items:center;padding:0 24px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);animation:headerSlideDown .4s cubic-bezier(.4,0,.2,1)}
        @keyframes headerSlideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:translateY(0)}}
        .wrap{max-width:1400px;margin:0 auto;width:100%;display:flex;align-items:center}
        .logo{display:flex;align-items:center;color:#fff;font-size:22px;font-weight:bold;margin-right:32px;letter-spacing:1px;animation:logoFadeIn .5s .1s both}
        @keyframes logoFadeIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
        .logo-icon{width:36px;height:36px;margin-right:10px;border-radius:8px;overflow:hidden;padding:2px}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .head-space{flex:1}
        .nav-links{display:flex;gap:24px}
        .nav-links a{color:rgba(255,255,255,.9);text-decoration:none;font-size:15px;transition:color .2s,transform .2s;position:relative}
        .nav-links a:hover{color:#fff;transform:translateY(-1px)}
        .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:#fff;transition:width .3s}
        .nav-links a:hover::after{width:100%}
        .btn{background:#fff;color:#4caf50;padding:8px 16px;border:none;border-radius:18px;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500;transition:all .2s}
        .btn:hover{background:rgba(255,255,255,.9);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
        .btn:active{transform:scale(.95)}
        .dropdown{position:relative;display:inline-block}
        .dropbtn{background:none;border:none;color:rgba(255,255,255,.9);font-size:15px;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;transition:color .2s}
        .dropbtn:hover{color:#fff}
        .dropbtn:focus{outline:none}
        .dropdown-content{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:160px;box-shadow:0 8px 16px rgba(0,0,0,.15);z-index:200;border-radius:8px;margin-top:8px;padding:8px 0;animation:dropdownFade .2s}
        @keyframes dropdownFade{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .dropdown-content.show{display:block}
        .dropdown-content a{color:#333;padding:10px 16px;text-decoration:none;display:block;font-size:14px;transition:all .2s}
        .dropdown-content a:hover{background:rgba(76,175,80,.1);color:#4caf50;padding-left:20px}
        .user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;cursor:pointer;transition:all .2s;animation:avatarPop .5s .3s both}
        @keyframes avatarPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
        .user-avatar:hover{background:rgba(255,255,255,.3);transform:scale(1.1)}
        .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);cursor:pointer;transition:all .2s;margin-left:8px;animation:iconFade .5s .25s both;position:relative}
        @keyframes iconFade{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
        .icon-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
        .notify-badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;font-size:11px;border-radius:50%;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
        #loader{position:fixed;top:0;left:0;width:100%;z-index:9999}
        #loader .mdui-progress{margin:0;border-radius:0}
        .main-box{max-width:800px;margin:0 auto;padding-top:72px;padding-left:16px;padding-right:16px}
        .back-link{display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,.95);text-decoration:none;margin-bottom:14px;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
        .back-link:hover{text-decoration:underline}
        .form-card{background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:32px;animation:cardSlideUp .5s cubic-bezier(.4,0,.2,1) forwards;opacity:0}
        @keyframes cardSlideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .form-title{font-size:22px;color:#333;margin-bottom:24px;display:flex;align-items:center;gap:10px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;color:#555;font-size:14px;font-weight:500}
        .form-group select,.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;transition:border-color .2s}
        .form-group select:focus,.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#2196f3}
        .form-group textarea{min-height:220px;resize:vertical;line-height:1.7}
        .submit-btn{width:100%;padding:14px;background:#2196f3;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;transition:all .2s}
        .submit-btn:hover{background:#1976d2;transform:translateY(-2px);box-shadow:0 4px 12px rgba(33,150,243,.3)}
        .submit-btn:active{transform:scale(.98)}
        .md-hint{background:#f5f9ff;border:1px solid #bbdefb;border-radius:8px;padding:12px 16px;margin-top:14px;font-size:12px;color:#666;line-height:1.9}
        .md-hint code{background:rgba(33,150,243,.08);color:#1565c0;padding:1px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace}
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="mdui-progress">
            <div class="mdui-progress-indeterminate"></div>
        </div>
    </div>
    <header id="hz5kl"></header>
    <div class="main-box">
        <a href="/forum" class="back-link"><i class="fa-solid fa-arrow-left"></i>返回论坛</a>
        <div class="form-card">
            <h1 class="form-title"><i class="fa-solid fa-pen-nib" style="color:#2196f3"></i>发布新帖
                {% set _t = user_team(session.user) %}{% if _t %}<span class="tea-badge" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#1976d2;background:#e3f2fd;border:1px solid #bbdefb;border-radius:12px;padding:2px 8px;margin-left:12px;vertical-align:middle"><i class="fa-solid fa-building"></i> {{ _t.name }}</span>{% endif %}
            </h1>
            <form id="new-post-form">
                <div class="form-group">
                    <label>选择分区 *</label>
                    <select id="forum_id" name="forum_id" required>
                        <option value="">请选择分区</option>
                        {% for f in forums %}
                        <option value="{{ f.id }}">{{ f.name|e }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>帖子标题 *（80 字以内）</label>
                    <input type="text" id="title" name="title" required maxlength="80" placeholder="输入帖子标题">
                </div>
                <div class="form-group">
                    <label>帖子内容 *（支持 Markdown）</label>
                    <textarea id="content" name="content" required placeholder="# 标题&#10;**加粗**&#10;```代码块```"></textarea>
                </div>
                <button type="submit" class="submit-btn mdui-ripple"><i class="fa-solid fa-paper-plane"></i> 发布</button>
            </form>
            <div class="md-hint">
                <strong><i class="fa-solid fa-circle-info" style="color:#2196f3"></i> Markdown 语法说明：</strong><br>
                <code># 标题</code> 一级标题 &nbsp; <code>## 二级标题</code> &nbsp; <code>**加粗**</code> 加粗 &nbsp;
                <code>*斜体*</code> 斜体<br>
                <code>- 列表项</code> 无序列表 &nbsp; <code>> 引用</code> 引用块 &nbsp;
                <code>```代码```</code> 代码块 &nbsp; <code>[文字](链接)</code> 超链接 &nbsp; <code>![图片](链接)</code> 图片
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function(){
            document.getElementById('loader').style.display='none';
            document.body.classList.add('page-enter');
            setTimeout(function(){document.body.classList.remove('page-enter');},400);
        });

        document.getElementById('new-post-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {
                forum_id: parseInt(formData.get('forum_id')) || 0,
                title: formData.get('title'),
                content: formData.get('content')
            };
            if (!data.title.trim()) { alert('请输入帖子标题'); return; }
            if (!data.content.trim()) { alert('请输入帖子内容'); return; }
            fetch('/forum/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(r){ return r.json(); })
            .then(function(data){
                if (data.success) {
                    window.location.href = '/forum/post/' + data.post_id;
                } else {
                    alert(data.message || '发布失败');
                }
            })
            .catch(function(){ alert('网络错误，请重试'); });
        });

        function loadUnread() {
            fetch('/messages/unread')
                .then(function(r){ return r.json(); })
                .then(function(data){
                    var badge = document.getElementById('unread-badge');
                    if (badge && data.count > 0) {
                        badge.textContent = data.count > 99 ? '99+' : data.count;
                        badge.style.display = 'block';
                    }
                });
        }
        loadUnread();

        document.addEventListener('DOMContentLoaded', function() {
            var dropdowns = document.querySelectorAll('.dropdown');
            dropdowns.forEach(function(dropdown) {
                var trigger = dropdown.querySelector('.dropbtn') || dropdown.querySelector('.user-avatar');
                var content = dropdown.querySelector('.dropdown-content');
                if (trigger && content) {
                    trigger.addEventListener('click', function(e) {
                        e.stopPropagation();
                        content.classList.toggle('show');
                    });
                    content.addEventListener('click', function(e) {
                        e.stopPropagation();
                    });
                }
            });
            document.addEventListener('click', function() {
                document.querySelectorAll('.dropdown-content').forEach(function(content) {
                    content.classList.remove('show');
                });
            });
        });
    </script>
<script src="/localcdn/gzs/mkh.js"></script></body>
</html>
