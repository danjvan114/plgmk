<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KE Hub</title>
<link rel="stylesheet" href="../vendor/mdui.min.css">
<link rel="stylesheet" href="../vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="../../env.css">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../community-layout.css">
<link rel="stylesheet" href="../community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 全局统一顶栏导航(挂载点) -->
<div id="hv2"></div>

<div class="loader" id="loader">
        <div class="mdui-progress">
            <div class="mdui-progress-indeterminate"></div>
        </div>
    </div>
    
    <div class="main-box mdui-typo">
        <a href="/workpool" class="back-link" title="返回作品池"><i class="fa-solid fa-arrow-left"></i>返回作品池</a>
        <div class="form-card">
            <h1 class="form-title">发布作品
                <span id="teamBadge"></span>
            </h1>
            {% if file_url %}
            <div class="file-url-display">
                <strong>作品文件：</strong>{{ file_url }}
            </div>
            {% endif %}
            <form id="publish-form">
                <div class="form-group">
                    <label>作品标题 *</label>
                    <input type="text" id="title" name="title" required placeholder="输入作品标题">
                </div>
                <div class="form-group">
                    <label>作品简介</label>
                    <textarea id="description" name="description" placeholder="简单介绍一下你的作品"></textarea>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="tags" name="tags" placeholder="用逗号分隔，如：游戏,冒险,像素">
                    <div class="hint">多个标签用逗号分隔</div>
                </div>
                <div class="form-group">
                    <label>缩略图 URL（可选）</label>
                    <input type="url" id="thumbnail" name="thumbnail" placeholder="https://example.com/thumbnail.png">
                </div>
                <div class="form-group">
                    <label>作品类型</label>
                    <select id="file_type" name="file_type">
                        <option value="player" selected>播放器（默认）</option>
                        <option value="img">图片</option>
                        <option value="redirect">重定向</option>
                    </select>
                    <div class="hint">图片类型将直接展示，重定向类型将跳转到外部链接，二者均不经过播放器</div>
                </div>
                <button type="submit" class="submit-btn">发布作品</button>
            </form>
        </div>
    </div>

<script src="../vendor/mdui.min.js"></script>
<script src="../../nav.js"></script>
<script src="../community-tilt.js"></script>
<script src="../community-mdui.js"></script>
<script src="../community-i18n.js"></script>

</body>
</html>
