<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KE Hub</title>
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/mdui.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/env.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/styles.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-layout.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 鍏ㄥ眬缁熶竴椤舵爮瀵艰埅(鎸傝浇鐐? -->
<div id="hv2"></div>

<div class="loader" id="loader">
        <div class="mdui-progress">
            <div class="mdui-progress-indeterminate"></div>
        </div>
    </div>
    
    <div class="main-box mdui-typo">
        <a href="/workpool" class="back-link" title="杩斿洖浣滃搧姹?><i class="fa-solid fa-arrow-left"></i>杩斿洖浣滃搧姹?/a>
        <div class="form-card">
            <h1 class="form-title">鍙戝竷浣滃搧
                <span id="teamBadge"></span>
            </h1>
            {% if file_url %}
            <div class="file-url-display">
                <strong>浣滃搧鏂囦欢锛?/strong>{{ file_url }}
            </div>
            {% endif %}
            <form id="publish-form">
                <div class="form-group">
                    <label>浣滃搧鏍囬 *</label>
                    <input type="text" id="title" name="title" required placeholder="杈撳叆浣滃搧鏍囬">
                </div>
                <div class="form-group">
                    <label>浣滃搧绠€浠?/label>
                    <textarea id="description" name="description" placeholder="绠€鍗曚粙缁嶄竴涓嬩綘鐨勪綔鍝?></textarea>
                </div>
                <div class="form-group">
                    <label>鏍囩</label>
                    <input type="text" id="tags" name="tags" placeholder="鐢ㄩ€楀彿鍒嗛殧锛屽锛氭父鎴?鍐掗櫓,鍍忕礌">
                    <div class="hint">澶氫釜鏍囩鐢ㄩ€楀彿鍒嗛殧</div>
                </div>
                <div class="form-group">
                    <label>缂╃暐鍥?URL锛堝彲閫夛級</label>
                    <input type="url" id="thumbnail" name="thumbnail" placeholder="https://example.com/thumbnail.png">
                </div>
                <div class="form-group">
                    <label>浣滃搧绫诲瀷</label>
                    <select id="file_type" name="file_type">
                        <option value="player" selected>鎾斁鍣紙榛樿锛?/option>
                        <option value="img">鍥剧墖</option>
                        <option value="redirect">閲嶅畾鍚?/option>
                    </select>
                    <div class="hint">鍥剧墖绫诲瀷灏嗙洿鎺ュ睍绀猴紝閲嶅畾鍚戠被鍨嬪皢璺宠浆鍒板閮ㄩ摼鎺ワ紝浜岃€呭潎涓嶇粡杩囨挱鏀惧櫒</div>
                </div>
                <button type="submit" class="submit-btn">鍙戝竷浣滃搧</button>
            </form>
        </div>
    </div>

<script src="/localcdn/gzs/n2/vendor/mdui.min.js"></script>
<script src="/localcdn/gzs/n2/nav.js"></script>
<script src="/localcdn/gzs/n2/community-tilt.js"></script>
<script src="/localcdn/gzs/n2/community-mdui.js"></script>
<script src="/localcdn/gzs/n2/community-i18n.js"></script>

</body>
</html>
