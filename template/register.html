<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户注册</title>
<link rel="stylesheet" href="vendor/mdui.min.css">
<link rel="stylesheet" href="vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="../env.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="community-layout.css">
<link rel="stylesheet" href="community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 全局统一顶栏导航(挂载点) -->
<div id="hv2"></div>

<div class="main-box mdui-typo">
<div class="card">
<h1>用户注册</h1>
<form method="post">
<div class="form-group">
<label>用户名</label>
<input type="text" name="username" required placeholder="请输入用户名">
</div>
<div class="form-group">
<label>密码</label>
<input type="password" name="password" required placeholder="请输入密码">
</div>
<div class="form-group">
<label>确认密码</label>
<input type="password" name="confirm_password" required placeholder="请再次输入密码">
</div>

<button type="submit" class="btn mdui-ripple">注册</button>
</form>
<div style="text-align:center;margin-top:12px">
已有账号？<a href="/login" style="color:var(--accent-1);text-decoration:none">立即登录</a>
</div>
</div>
</div>
<div class="modal" id="modal">
<div class="modal-content">
<div class="icon" id="modalIcon">✕</div>
<p id="modalMessage"></p>
<button onclick="closeModal()" class="mdui-ripple">确定</button>
</div>
</div>

<script src="vendor/mdui.min.js"></script>
<script src="../nav.js"></script>
<script src="community-tilt.js"></script>
<script src="community-mdui.js"></script>
<script src="community-i18n.js"></script>

</body>
</html>
