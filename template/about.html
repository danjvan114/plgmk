<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - hack NET X工作室</title>
    <link rel="icon" href="/static/gzs/logo.png">
    <!-- 引入SheetJS库用于解析Excel文件 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; color: #333;">
    
    <!-- 导航栏 -->
    <nav style="display: flex; justify-content: space-between; align-items: center; background-color: #333; color: white; padding: 10px 20px; position: fixed; top: 0; width: 100%; z-index: 1000; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
        <div style="font-size: 1.5rem; text-decoration: none; color: white; display: flex; align-items: center;">
            <img src="/static/gzs/logo.png" alt="工作室图标" style="width: 40px; height: 40px; margin-right: 10px; border-radius: 50%;">
            <a href="/" style="color: white; text-decoration: none;">hack NET X</a>
        </div>
        <ul style="list-style: none; display: flex;">
            <li style="margin: 0 10px;"><a href="/" style="color: white; text-decoration: none; padding: 5px 10px; transition: background-color 0.3s ease; border-radius: 5px;">首页</a></li>
            <li style="margin: 0 10px;"><a href="/about" style="color: white; text-decoration: none; padding: 5px 10px; transition: background-color 0.3s ease; border-radius: 5px;">关于</a></li>
            <li style="margin: 0 10px;"><a href="/contact" style="color: white; text-decoration: none; padding: 5px 10px; transition: background-color 0.3s ease; border-radius: 5px;">联系我们</a></li>
        </ul>
    </nav>

    <!-- 团队内容 -->
    <div style="padding: 100px 20px; text-align: center;">
        <h2 style="margin: 0 0 20px;">服务内容</h2>
        <p style="margin: 0 0 20px;">我们是一个极小的团队，所有成员均不过是学生罢了。我们提供少量服务，仅包括程序设计、图标设计等。我们的团队有人擅长前端和后端开发，能够构建网站和简陋应用程序。</p>
    </div>

    <!-- 从Excel文件渲染的名单表格 -->
    <div style="padding: 0 20px; text-align: center;">
        <h2 style="margin: 0 0 20px;">团队名单</h2>
        <div id="excel-table-container" style="width: 80%; margin: 0 auto; overflow-x: auto;">
            <p>正在加载表格数据...</p>
        </div>
    </div>

    <script>
        // 从Excel文件加载并渲染表格（第一列直接解析为图片）
        async function loadExcelTable() {
            try {
                // 获取Excel文件的URL
                const excelUrl = '/static/gzs/cy/cy.xlsx';
                
                // 使用fetch获取Excel文件
                const response = await fetch(excelUrl);
                if (!response.ok) {
                    throw new Error(`无法加载Excel文件: ${response.status} ${response.statusText}`);
                }
                
                // 将响应转换为ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();
                
                // 使用SheetJS解析Excel文件
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // 获取第一个工作表
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // 将工作表转换为JSON数据
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                // 生成HTML表格
                const container = document.getElementById('excel-table-container');
                if (jsonData.length === 0) {
                    container.innerHTML = '<p style="color: #666; padding: 20px;">Excel文件中没有数据</p>';
                    return;
                }
                
                // 创建表格
                let tableHTML = '<table style="width: 100%; border-collapse: collapse; border: 1px solid #ddd; margin-top: 20px;">';
                
                // 添加表头

                
                // 添加表格内容
                tableHTML += '<tbody>';
                for (let i = 1; i < jsonData.length; i++) {
                    tableHTML += '<tr style="transition: background-color 0.3s;" onmouseenter="this.style.backgroundColor=\'#f5f5f5\'" onmouseleave="this.style.backgroundColor=\'\'">';
                    
                    const row = jsonData[i];
                    
                    // 遍历每一列
                    row.forEach((cell, cellIndex) => {
                        const cellValue = cell || '';
                        
                        // 第一列直接作为图片处理
                        if (cellIndex === 0) {
                            // 无论内容是什么，都尝试作为图片URL处理
                            tableHTML += `<td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: center;">
                                <img src="${cellValue}" alt="头像" style="width: 50px; height: 50px; border-radius: 50%; vertical-align: middle; object-fit: cover;">
                            </td>`;
                        } else {
                            // 其他列正常显示
                            tableHTML += `<td style="padding: 10px; border-bottom: 1px solid #ddd; text-align: center;">${cellValue}</td>`;
                        }
                    });
                    
                    tableHTML += '</tr>';
                }
                tableHTML += '</tbody></table>';
                
                // 将生成的HTML表格插入到容器中
                container.innerHTML = tableHTML;
                
            } catch (error) {
                console.error('加载Excel表格时出错:', error);
                document.getElementById('excel-table-container').innerHTML = 
                    `<p style="color: red; padding: 20px;">无法加载团队名单表格: ${error.message}</p>`;
            }
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadExcelTable);
    </script>
</body>
</html>
