<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <link rel="icon" type="image/x-icon" href="/localcdn/ico.png">
    <meta charset="UTF-8">
    <title>云·文档</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#fff;min-height:100vh;display:flex}
        .sidebar{width:280px;background:#f5f5f5;border-right:1px solid #e0e0e0;position:fixed;left:0;top:64px;bottom:0;overflow-y:auto;transition:transform 0.3s;z-index:95}
        .sidebar.hidden{transform:translateX(-100%)}
        .main-content{flex:1;display:flex;flex-direction:column;margin-left:280px;transition:margin-left 0.3s}
        .main-content.full-width{margin-left:0}
        header{width:100%;height:64px;background:#fff;border-bottom:1px solid #e0e0e0;position:fixed;top:0;left:0;display:flex;align-items:center;padding:0 16px;z-index:100}
        header .menu-btn{background:none;border:none;font-size:24px;color:#333;cursor:pointer;margin-right:16px;padding:8px}
        header .menu-btn:hover{color:#2196f3}
        header .title{font-size:18px;font-weight:bold;color:#333}
        header .path-nav{font-size:14px;color:#666;margin-left:auto;display:flex;align-items:center;gap:8px}
        header .path-nav a{color:#2196f3;text-decoration:none}
        header .path-nav a:hover{text-decoration:underline}
        .progress-container{position:fixed;top:64px;left:0;right:0;height:4px;background:#e0e0e0;z-index:99}
        .progress-container.hidden{display:none}
        .progress-container .mdui-progress{margin:0;height:100%}
        .progress-container .mdui-progress-indeterminate{height:100%}
        .pdf-container{flex:1;padding:80px 20px 20px;overflow:auto}
        .pdf-viewer{width:100%;height:calc(100vh - 100px);border:none}
        .iframe-viewer{width:100%;height:calc(100vh - 100px);border:none}
        .code-viewer{width:100%;min-height:calc(100vh - 100px);background:#1e1e1e;color:#d4d4d4;font-family:Consolas,'Courier New',monospace;padding:16px;white-space:pre-wrap;overflow-x:auto;border-radius:4px}
        .md-viewer{width:100%;min-height:calc(100vh - 100px);padding:20px;color:#333;line-height:1.8}
        .md-viewer h1{font-size:28px;border-bottom:2px solid #2196f3;padding-bottom:10px;margin-bottom:20px}
        .md-viewer h2{font-size:24px;color:#2196f3;margin:20px 0 10px}
        .md-viewer h3{font-size:20px;margin:16px 0 8px}
        .md-viewer p{margin:10px 0}
        .md-viewer ul, .md-viewer ol{margin:10px 0;padding-left:30px}
        .md-viewer li{margin:5px 0}
        .md-viewer code{background:#f5f5f5;padding:2px 6px;border-radius:4px;font-family:monospace}
        .md-viewer pre{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:4px;overflow-x:auto;margin:10px 0}
        .md-viewer pre code{background:none;padding:0}
        .md-viewer a{color:#2196f3}
        .empty-state{display:flex;flex-direction:column;justify-content:center;align-items:center;height:calc(100vh - 150px);color:#999}
        .empty-state i{font-size:64px;margin-bottom:16px}
        .empty-state p{font-size:16px}
        .doc-tree{padding:16px}
        .doc-tree ul{list-style:none;padding-left:0}
        .doc-tree li{margin-bottom:4px}
        .doc-tree .folder{font-weight:bold;color:#333;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px}
        .doc-tree .folder:hover{background:rgba(33,150,243,.1)}
        .doc-tree .folder.open{background:rgba(33,150,243,.08)}
        .doc-tree .file{color:#666;padding:4px 8px 4px 28px;border-radius:4px;cursor:pointer}
        .doc-tree .file:hover{background:rgba(33,150,243,.1)}
        .doc-tree .file.active{background:rgba(33,150,243,.15);color:#2196f3}
        .doc-tree .pdf-file{color:#e74c3c}
        .doc-tree .js-file{color:#f39c12}
        .doc-tree .ttmp4-file{color:#9c27b0}
        .doc-tree .md-file{color:#4caf50}
        .doc-tree .toggle-icon{font-size:12px;color:#999}
        .context-menu{display:none;position:absolute;background:#fff;border:1px solid #e0e0e0;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:4px 0;min-width:120px;z-index:1000}
        .context-menu.show{display:block}
        .context-menu li{list-style:none;padding:6px 16px;cursor:pointer;color:#333}
        .context-menu li:hover{background:#f5f5f5}
        .context-menu li.separator{border-top:1px solid #e0e0e0;margin:4px 0}
        .doc-tree .folder.open .toggle-icon{transform:rotate(90deg)}
        .doc-tree .subtree{display:none;padding-left:16px}
        .doc-tree .folder.open + .subtree{display:block}
        .sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:90}
        .sidebar-overlay.show{display:block}
        .breadcrumb{display:flex;align-items:center;gap:8px;font-size:14px;color:#666;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eee}
        .breadcrumb a{color:#2196f3;text-decoration:none}
        .breadcrumb a:hover{text-decoration:underline}
        .breadcrumb span{color:#999}
        @media (max-width:768px){
            .sidebar{transform:translateX(-100%)}
            .sidebar.hidden{transform:translateX(-100%)}
            .sidebar:not(.hidden){transform:translateX(0)}
            .main-content{margin-left:0}
            .sidebar-overlay.show{display:block}
            header .path-nav{display:none}
        }
    </style>
</head>
<body>
<div id="topbar-app"></div>

<div class="progress-container" id="progressBar">
    <div class="mdui-progress">
        <div class="mdui-progress-indeterminate"></div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="doc-tree">
        <h3 style="padding:8px;margin-bottom:12px;color:#333;font-size:14px">文档目录</h3>
        <ul>
            {{ tree_html|safe }}
        </ul>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<ul class="context-menu" id="contextMenu">
    <li onclick="downloadFile()">下载</li>
    <li class="separator"></li>
    <li onclick="openInNewTab()">在新标签页打开</li>
</ul>

<div class="main-content" id="mainContent">
    <div class="pdf-container" id="pdfContainer">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="empty-state">
            <i class="mdui-icon material-icons">description</i>
            <p>请从左侧选择一个文档查看</p>
        </div>
    </div>
</div>

<script>
let currentFileUrl = '';
let currentPath = [];

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const mainContent = document.getElementById('mainContent');
    
    const isHidden = sidebar.classList.contains('hidden');
    
    if (isHidden) {
        sidebar.classList.remove('hidden');
        mainContent.classList.remove('full-width');
        overlay.classList.remove('show');
    } else {
        sidebar.classList.add('hidden');
        mainContent.classList.add('full-width');
        overlay.classList.remove('show');
    }
}

function updateBreadcrumb(fileName) {
    const breadcrumb = document.getElementById('breadcrumb');
    if (fileName) {
        breadcrumb.innerHTML = `<span>当前文档:</span> <span style="color:#2196f3">${fileName}</span>`;
    } else {
        breadcrumb.innerHTML = '';
    }
}

document.addEventListener('contextmenu', function(e) {
    const target = e.target;
    if (target.classList.contains('pdf-file') || target.classList.contains('js-file') || 
        target.classList.contains('ttmp4-file') || target.classList.contains('md-file')) {
        e.preventDefault();
        currentFileUrl = target.getAttribute('data-url') || target.dataset.url;
        
        const menu = document.getElementById('contextMenu');
        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
        menu.classList.add('show');
    }
});

document.addEventListener('click', function(e) {
    const menu = document.getElementById('contextMenu');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    if (!menu.contains(e.target) && e.target !== sidebarOverlay) {
        menu.classList.remove('show');
    }
});

function downloadFile() {
    if (currentFileUrl) {
        const link = document.createElement('a');
        link.href = currentFileUrl;
        link.download = currentFileUrl.split('/').pop();
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    document.getElementById('contextMenu').classList.remove('show');
}

function openInNewTab() {
    if (currentFileUrl) {
        if (currentFileUrl.endsWith('.ttmp4')) {
            fetch(currentFileUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.url) {
                        const iframeUrl = data.url.startsWith('http') ? data.url : 'https://' + data.url;
                        window.open(iframeUrl, '_blank');
                    }
                });
        } else {
            window.open(currentFileUrl, '_blank');
        }
    }
    document.getElementById('contextMenu').classList.remove('show');
}

function loadPDF(url) {
    document.querySelectorAll('.doc-tree .file').forEach(f => f.classList.remove('active'));
    event.target.classList.add('active');
    
    const container = document.getElementById('pdfContainer');
    const progress = document.getElementById('progressBar');
    const fileName = url.split('/').pop();
    
    progress.classList.remove('hidden');
    container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><embed class="pdf-viewer" src="' + url + '" type="application/pdf" onload="hideProgress()" onerror="showError()">';
    updateBreadcrumb(fileName);
}

function loadJS(url) {
    document.querySelectorAll('.doc-tree .file').forEach(f => f.classList.remove('active'));
    event.target.classList.add('active');
    
    const container = document.getElementById('pdfContainer');
    const progress = document.getElementById('progressBar');
    const fileName = url.split('/').pop();
    
    progress.classList.remove('hidden');
    
    fetch(url)
        .then(response => response.text())
        .then(code => {
            container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><pre class="code-viewer">' + escapeHtml(code) + '</pre>';
            hideProgress();
            updateBreadcrumb(fileName);
        })
        .catch(error => {
            showError();
        });
}

function loadMD(url) {
    document.querySelectorAll('.doc-tree .file').forEach(f => f.classList.remove('active'));
    event.target.classList.add('active');
    
    const container = document.getElementById('pdfContainer');
    const progress = document.getElementById('progressBar');
    const fileName = url.split('/').pop();
    
    progress.classList.remove('hidden');
    
    fetch(url)
        .then(response => response.text())
        .then(md => {
            const html = markdownToHtml(md);
            container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><div class="md-viewer">' + html + '</div>';
            hideProgress();
            updateBreadcrumb(fileName);
        })
        .catch(error => {
            showError();
        });
}

function loadTTMP4(url) {
    document.querySelectorAll('.doc-tree .file').forEach(f => f.classList.remove('active'));
    event.target.classList.add('active');
    
    const container = document.getElementById('pdfContainer');
    const progress = document.getElementById('progressBar');
    const fileName = url.split('/').pop();
    
    progress.classList.remove('hidden');
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.url) {
                const iframeUrl = data.url.startsWith('http') ? data.url : 'https://' + data.url;
                container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><iframe class="iframe-viewer" src="' + iframeUrl + '" frameborder="0" allowfullscreen></iframe>';
            } else {
                container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><div class="empty-state"><i class="mdui-icon material-icons">error</i><p>文件格式错误：缺少 url 字段</p></div>';
            }
            hideProgress();
            updateBreadcrumb(fileName);
        })
        .catch(error => {
            container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><div class="empty-state"><i class="mdui-icon material-icons">error</i><p>无法解析文件内容</p></div>';
            hideProgress();
        });
}

function loadEmptyState() {
    const container = document.getElementById('pdfContainer');
    container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><div class="empty-state"><i class="mdui-icon material-icons">description</i><p>请从左侧选择一个文档查看</p></div>';
    updateBreadcrumb(null);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function hideProgress() {
    document.getElementById('progressBar').classList.add('hidden');
}

function showError() {
    document.getElementById('progressBar').classList.add('hidden');
    const container = document.getElementById('pdfContainer');
    container.innerHTML = '<div class="breadcrumb" id="breadcrumb"></div><div class="empty-state"><i class="mdui-icon material-icons">error</i><p>无法加载文件</p></div>';
}

function toggleFolder(el) {
    el.classList.toggle('open');
}

function markdownToHtml(md) {
    md = md.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    md = md.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    md = md.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    md = md.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
    md = md.replace(/\*(.*)\*/gim, '<em>$1</em>');
    md = md.replace(/`([^`]+)`/gim, '<code>$1</code>');
    md = md.replace(/```(\w+)?\n([\s\S]*?)```/gim, '<pre><code>$2</code></pre>');
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank">$1</a>');
    md = md.replace(/^- (.*$)/gim, '<li>$1</li>');
    md = md.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
    md = md.replace(/(<li>[\s\S]*?<\/li>)/gim, '<ul>$1</ul>');
    md = md.replace(/\n/gim, '<br>');
    return md;
}

function expandFolderByPath(pathArray) {
    let currentElement = document.querySelector('.doc-tree > ul');
    
    for (let i = 0; i < pathArray.length; i++) {
        const folderName = pathArray[i];
        const folders = currentElement.querySelectorAll('.folder');
        let found = false;
        
        for (const folder of folders) {
            const span = folder.querySelector('span:not(.toggle-icon)');
            if (span && span.textContent.trim() === folderName) {
                folder.classList.add('open');
                const nextUl = folder.nextElementSibling;
                if (nextUl && nextUl.classList.contains('subtree')) {
                    currentElement = nextUl;
                    found = true;
                    break;
                }
            }
        }
        
        if (!found) break;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const pParam = urlParams.get('p');
    if (pParam) {
        try {
            const pathObj = JSON.parse(pParam);
            const pathValues = typeof pathObj === 'object' && !Array.isArray(pathObj) 
                ? Object.values(pathObj) 
                : pathObj;
            
            if (Array.isArray(pathValues) && pathValues.length > 0) {
                setTimeout(() => expandFolderByPath(pathValues), 50);
            }
        } catch (e) {
            console.error('解析 p 参数失败:', e);
        }
    }
});
</script>
<script src="/static/js/topbar.js"></script>
</body>
</html>
