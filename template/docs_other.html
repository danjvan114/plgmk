<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KE Hub</title>
<link rel="stylesheet" href="vendor/mdui.min.css">
<link rel="stylesheet" href="vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="../env.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="community-layout.css">
<link rel="stylesheet" href="community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 全局统一顶栏导航(挂载点) -->
<div id="hv2"></div>

<div class="progress-container" id="progressBar">
    <div class="mdui-progress">
        <div class="mdui-progress-indeterminate"></div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="doc-tree">
        <h3 style="padding:8px;margin-bottom:12px;color:var(--text-1);font-size:14px">文档目录</h3>
        <ul>
            {{ tree_html|safe }}
        </ul>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<ul class="context-menu" id="contextMenu">
    <li onclick="downloadFile()">下载</li>
    <li class="separator"></li>
    <li onclick="openInNewTab()">在新标签页打开</li>
</ul>

<div class="main-content" id="mainContent">
    <div class="pdf-container" id="pdfContainer">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="empty-state">
            <i class="mdui-icon material-icons">description</i>
            <p>请从左侧选择一个文档查看</p>
        </div>
    </div>
</div>

<script src="vendor/mdui.min.js"></script>
<script src="../nav.js"></script>
<script src="community-tilt.js"></script>
<script src="community-mdui.js"></script>
<script src="community-i18n.js"></script>

</body>
</html>
