<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作台 - 猫的社区</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons@1.0.0/iconfont/material-icons.min.css">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            color: #333;
        }
        .wb-wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 90px; }
        .wb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .wb-title { display: flex; align-items: center; gap: 12px; }
        .wb-title .material-icons { font-size: 34px; color: #5BAF5E; }
        .wb-title h1 { font-size: 22px; margin: 0; font-weight: 700; }
        .wb-title p { margin: 2px 0 0; color: #888; font-size: 13px; }
        .wb-sec { font-size: 15px; font-weight: 700; color: #555; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
        .wb-sec::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
        .wb-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .wb-card {
            width: 236px; box-sizing: border-box;
            background: #fff; border-radius: 14px; padding: 16px;
            display: flex; gap: 13px; align-items: flex-start;
            cursor: pointer; text-decoration: none; color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            border: 1px solid #eef0f3;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .wb-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
        .wb-card:active { transform: scale(.98); }
        .wb-ico {
            width: 40px; height: 40px; border-radius: 11px; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: #eaf6ec; color: #5BAF5E;
        }
        .wb-ico .material-icons { font-size: 23px; }
        .wb-card h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
        .wb-card p { margin: 3px 0 0; font-size: 12px; color: #999; line-height: 1.45; }
        .wb-flag { margin-left: auto; font-size: 11px; color: #aaa; flex: none; }
        /* 模态框 */
        .wb-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,.45);
            display: none; align-items: center; justify-content: center;
            z-index: 3000;
        }
        .wb-mask.show { display: flex; }
        .wb-modal {
            width: 420px; max-width: calc(100vw - 40px);
            background: #fff; border-radius: 16px; padding: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
            max-height: 82vh; overflow-y: auto;
        }
        .wb-modal h2 { margin: 0 0 4px; font-size: 18px; }
        .wb-modal .wb-mdesc { margin: 0 0 16px; font-size: 13px; color: #888; }
        .wb-field { margin-bottom: 12px; }
        .wb-field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        .wb-field input {
            width: 100%; box-sizing: border-box;
            border: 1px solid #d8dce3; border-radius: 8px;
            padding: 10px 12px; font-size: 14px; outline: none;
            transition: border-color .15s;
        }
        .wb-field input:focus { border-color: #5BAF5E; }
        .wb-mbtns { display: flex; gap: 10px; margin-top: 18px; }
        .wb-mbtns button {
            flex: 1; border: none; border-radius: 8px; padding: 11px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .wb-cancel { background: #f1f3f5; color: #555; }
        .wb-open { background: #5BAF5E; color: #fff; }
        .wb-open:active { background: #4a9c4d; }
        .wb-open[disabled] { opacity: .6; cursor: default; }
        .wb-toast {
            position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
            background: rgba(0,0,0,.78); color: #fff; font-size: 13px;
            padding: 10px 18px; border-radius: 8px; z-index: 4000;
            display: none; max-width: 80vw;
        }
        .wb-toast.show { display: block; animation: wbFade .3s; }
        @keyframes wbFade { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @media (max-width: 640px) {
            .wb-wrap { padding: 16px 12px 80px; }
            .wb-card { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="hv2"></div>

            <div class="wb-title">
                <i class="material-icons">dashboard</i>

        <div id="wbSections"></div>

        function wbCardHtml(t) {
            var paramsAttr = t.params ? JSON.stringify(t.params).replace(/"/g, '&quot;') : '';
            return '<a class="wb-card" data-t="' + paramsAttr + '" data-url="' + t.url + '" data-method="' + (t.method || 'GET') + '" data-body="' + (t.body || '') + '" data-redirect="' + (t.redirect || '') + '">' +
                '<span class="wb-ico"><i class="material-icons">' + t.icon + '</i></span>' +
                '<div><h3>' + t.name + '</h3><p>' + (t.desc || '') + '</p></div>' +
                ((t.needLogin && !CURRENT_USER) ? '<span class="wb-flag">需登录</span>' : '') +
                ((t.adminOnly && IS_ADMIN) ? '<span class="wb-flag">管理</span>' : '') +
                '</a>';
        }

        function wbRender() {
            var wrap = document.getElementById('wbSections');
            var html = '';
            WB_SECTIONS.forEach(function (sec) {
                var tools = sec.tools.filter(function (t) { return !t.adminOnly || IS_ADMIN; });
                if (!tools.length) return;
                html += '<div class="wb-sec">' + sec.title + '</div><div class="wb-grid">' + tools.map(wbCardHtml).join('') + '</div>';
            });
            wrap.innerHTML = html;
        }

        var curTool = null;
        function wbOpen(t) {
            curTool = t;
            document.getElementById('wbMTitle').textContent = t.name;
            document.getElementById('wbMDesc').textContent = (t.desc || '') + (t.method === 'POST' ? ' (提交后' + (t.redirect ? '自动跳转' : '留在本页') + ')' : '');
            var fields = '';
            (t.params || []).forEach(function (p) {
                if (p.fixed !== undefined) return;
                fields += '<div class="wb-field"><label>' + p.label + (p.required ? ' *' : '') + (p.when ? ' (' + p.when.value + ' 时必填)' : '') + '</label>' +
                    '<input type="text" data-key="' + p.key + '" data-in="' + p.in + '"' + (p.transform ? ' data-transform="' + p.transform + '"' : '') + ' placeholder="' + (p.placeholder || '') + '"' + (p.required ? ' required' : '') + '></div>';
            });
            document.getElementById('wbMFields').innerHTML = fields;
            document.getElementById('wbMGo').textContent = t.method === 'POST' ? '提交' : '打开';
            document.getElementById('wbMask').classList.add('show');
            var first = document.querySelector('#wbMFields input');
            if (first) first.focus();
        }
        function wbClose() {
            document.getElementById('wbMask').classList.remove('show');
            curTool = null;
        }
        function wbToast(msg) {
            var el = document.getElementById('wbToast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }
        function wbFill(t) {
            var url = t.url, qs = [], data = {}, vals = {}, ok = true;
            (t.params || []).forEach(function (p) {
                var inp = document.querySelector('#wbMFields input[data-key="' + p.key + '"]');
                var val = inp ? inp.value.trim() : (p.fixed !== undefined ? String(p.fixed) : '');
                var whenMet = !p.when || vals[p.when.key] === p.when.value;
                if (inp && inp.required && whenMet && !val) { inp.style.borderColor = '#e53935'; ok = false; return; }
                vals[p.key] = val;
            });
            if (!ok) return null;
            (t.params || []).forEach(function (p) {
                var val = vals[p.key];
                if (p.in === 'path') url = url.replace('{' + p.key + '}', encodeURIComponent(val));
                else if (p.in === 'query') {
                    if (val === '' && p.fixed === undefined) return;
                    if (p.transform === 'b64arr') {
                        var urls = val.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
                        qs.push(p.key + '=' + encodeURIComponent(btoa('["' + urls.join('","') + '"]')));
                    } else qs.push(p.key + '=' + encodeURIComponent(val));
                }
                else data[p.key] = val;
            });
            if (qs.length) url += (url.indexOf('?') >= 0 ? '&' : '?') + qs.join('&');
            return { url: url, data: data };
        }
        function wbGo() {
            var tool = curTool;
            if (!tool) return;
            var redir = tool.redirect;
            var filled = wbFill(tool);
            if (!filled) return;
            var btn = document.getElementById('wbMGo');
            if (tool.method === 'POST') {
                btn.disabled = true;
                btn.textContent = '提交中...';
                var opts = { method: 'POST' };
                if (tool.body === 'json') {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify(filled.data);
                } else {
                    var fd = new FormData();
                    Object.keys(filled.data).forEach(function (k) { fd.append(k, filled.data[k]); });
                    opts.body = fd;
                }
                fetch(filled.url, opts).then(function (res) {
                    return res.text().then(function (txt) {
                        var info = { code: res.status };
                        try { var j = JSON.parse(txt); info = j; } catch (e) { info.raw = txt; }
                        return info;
                    });
                }).then(function (info) {
                    btn.disabled = false;
                    btn.textContent = '提交';
                    var ok = !(info.success === false || info.error || (info.code >= 400 && !info.success));
                    wbToast(ok ? ((info.message || info.msg) || '操作成功') : ((info.error || info.message || info.msg) || ('请求失败 (' + info.code + ')')));
                    if (ok) {
                        wbClose();
                        if (redir) {
                            var u = redir;
                            (tool.params || []).forEach(function (p) {
                                var inp = document.querySelector('#wbMFields input[data-key="' + p.key + '"]');
                                if (p.in === 'path' && inp) u = u.replace('{' + p.key + '}', encodeURIComponent(inp.value.trim()));
                            });
                            setTimeout(function () { location.href = u; }, 900);
                        }
                    }
                }).catch(function (err) {
                    btn.disabled = false;
                    btn.textContent = '提交';
                    wbToast('请求失败: ' + err.message);
                });
            } else {
                location.href = filled.url;
            }
        }

        function wbPostDirect(t) {
            var opts = { method: 'POST' };
            if (t.body === 'json') { opts.headers = { 'Content-Type': 'application/json' }; opts.body = '{}'; }
            else opts.body = new FormData();
            fetch(t.url, opts).then(function (res) {
                return res.text().then(function (txt) {
                    var info = { code: res.status };
                    try { info = JSON.parse(txt); } catch (e) { info.raw = txt; }
                    return info;
                });
            }).then(function (info) {
                var ok = !(info.success === false || info.error || (info.code >= 400 && !info.success));
                wbToast(ok ? ((info.message || info.msg) || '操作成功') : ((info.error || info.message || info.msg) || ('请求失败 (' + info.code + ')')));
                if (ok && t.redirect) setTimeout(function () { location.href = t.redirect; }, 900);
            }).catch(function (err) {
                wbToast('请求失败: ' + err.message);
            });
        }

        document.addEventListener('click', function (e) {
            var card = e.target.closest('.wb-card');
            if (!card) return;
            var paramsAttr = card.getAttribute('data-t');
            var t = {
                name: card.querySelector('h3').textContent,
                desc: card.querySelector('p').textContent,
                url: card.getAttribute('data-url'),
                method: card.getAttribute('data-method') || 'GET',
                body: card.getAttribute('data-body') || '',
                redirect: card.getAttribute('data-redirect') || ''
            };
            if (t.needLogin && !CURRENT_USER) { location.href = '/login'; return; }
            if (t.method === 'POST') {
                if (paramsAttr) {
                    t.params = JSON.parse(paramsAttr.replace(/&quot;/g, '"'));
                    wbOpen(t);
                } else {
                    wbPostDirect(t);
                }
                return;
            }
            if (paramsAttr) {
                t.params = JSON.parse(paramsAttr.replace(/&quot;/g, '"'));
                wbOpen(t);
            } else {
                location.href = t.url;
            }
        });
        document.getElementById('wbMask').addEventListener('click', function (e) {
            if (e.target === this) wbClose();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') wbClose();
        });

        wbRender();
    </script>
