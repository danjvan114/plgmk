<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编程猫社区</title>
    <!-- MDUI2 样式与JS -->
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    
    <!-- Material Design Icons 图标库 -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff9e8;
        }
        /* Banner轮播区域 */
        .banner-wrap {
            margin: 0 auto;
            width: 60%;
            height: 340px;
            background-size: cover;
            background-position: center;
            position:relative;
            transition: background-image 0.4s ease-in-out;
        }
        .banner-arrow {
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            width:40px;
            height:40px;
            border-radius:50%;
            background:rgba(255,255,255,0.6);
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            z-index: 2;
        }
        .arrow-left { left:24px; }
        .arrow-right { right:24px; }

        /* 轮播小圆点 */
        .dots-wrap{
            position:absolute;
            bottom:12px;
            left:50%;
            transform: translateX(-50%);
            display:flex;
            gap:8px;
            z-index:2;
        }
        .dot{
            width:10px;
            height:10px;
            border-radius:50%;
            background:rgba(255,255,255,0.4);
            cursor:pointer;
        }
        .dot.active{
            background:#ffffff;
        }

        /* 右侧侧边栏 */
        .side-card {
            position:absolute;
            top:80px;
            right:24px;
            width:220px;
            background:#fff;
            border-radius:2px;
            overflow:hidden;
            z-index:5;
        }
        .side-item {
            padding:10px 14px;
        }
        .side-item:nth-child(1){background:#FFD8B1;}
        
        .side-item:nth-child(2){background:#FFF2AF;}
        .side-item:nth-child(3){background:#d3d8ff;}
        .side-item:nth-child(4){background:#b4e8b4;}
        .side-item:nth-child(5){background:#c6e2ff;}
        /* 创作教程模块 */
        .container {
            max-width:1280px;
            margin:20px auto;
            padding:0 20px;
        }
        .section-title-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }
        .section-title {
            font-size:18px;
            font-weight:bold;
            display:flex;
            align-items:center;
            gap:8px;
            border-bottom: none;
            text-decoration: none;
        }
        .more-link {
            color:#ff9900;
            text-decoration:none;
        }
        .course-list {
            display:flex;
            gap:24px;
        }
        .course-card {
            width:32%;
            background:#fff;
            border-radius:6px;
            overflow:hidden;
        }
        .course-img {
            width:100%;
            height:220px;
            object-fit:cover;
        }
        .course-info {
            padding:12px;
        }
        .course-name {
            font-size:16px;
            margin-bottom:4px;
        }
        .course-desc {
            font-size:13px;
            color:#777;
        }
        .slide-right-btn {
            align-self:center;
            width:40px;
            height:40px;
            border-radius:50%;
            background:rgba(0,0,0,0.1);
            border:none;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .section h2 { margin-bottom: 20px; color: #1a1a1a; }
        .a2 {
            height: 100%;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .project-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
        }

        
        .project-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .project-card-content {
            padding: 20px;
        }
        .project-card h3 {
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        .project-card p {
            color: #666;
            font-size: 0.95em;
        }

    </style>
</head>
<body>
    <!--导航栏-->
    <div class="header-nav" id="hv2">
        
    </div>
    <div style="height: 30px;"></div>
    <!-- Banner -->
    <div class="banner-wrap" id="banner">
        <div class="banner-arrow arrow-left" id="btnPrev">

        </div>
        <div class="banner-arrow arrow-right" id="btnNext">

        </div>
        <div class="dots-wrap" id="dotsWrap"></div>
        <!--右侧侧边栏卡片-->
        
    </div>

    <div class="side-card">
            <div onclick="window.location.href='/app/kn/d' " class="side-item mdui-ripple">KN Pro<br><small>三端合一的新一代编辑器</small></div>
            <div class="side-item mdui-ripple">Crafting Table<br><small>方便快捷的编程工具</small></div>
            <div class="side-item mdui-ripple">更多敬请期待<br><small</small></div>
            
    </div>

    <!--创作教程区域-->
    <div class="container">
        <div class="section-title-row">
            <div class="section-title">
                <i class="mdi mdi-book-open-page-variant"></i>
                全部项目
            </div>
            
        </div>
        <div class="projects-grid">
            <a href="/mk/kn" class="project-card mdui-ripple">
                <img src="localcdn/gzs/{93D330BB-21E1-46CF-8EDB-262229E1024D}.png" alt="">
                <div class="project-card-content">
                    <h3>菠菜面社区</h3>
                    <p>不会凉凉发社区~~</p>
                </div>
            </a>
            <!-- 项目2 -->
            <a href="/po/mc" class="project-card mdui-ripple">
                <img src="localcdn/gzs/mc1.png" alt="">
                <div class="project-card-content">
                    <h3>铁路mc服务器</h3>
                    <p>一个基于minecraft的铁路服务器，为玩家提供铁路玩法~</p>
                </div>
            </a>
            <!-- 项目3 -->
            <a href="/app/ccvue" class="project-card mdui-ripple">
                <img src="/localcdn/gzs/%7BBF5BFB2D-FE5A-49C2-8C2D-8D0E1781D4EC%7D.png" alt="">
                <div class="project-card-content">
                    <h3>CCvue框架</h3>
                    <p>一个基于vue的框架，用于快速开发web游戏应用</p>
                </div>
            </a>
            <a onclick="window.open('/localcdn/gzs/q2.png')" class="project-card mdui-ripple">
                <img src="localcdn/gzs/q2.png" alt="">

                    <p>一站式编程工具，方便快捷的编程（扫码体验）</p>
                </div>
            </a>
            <a onclick="window.open('https://pan1.pgrm.run')" class="project-card mdui-ripple">
                <img src="localcdn/gzs/{93D330BB-21E1-46CF-8EDB-262229E1024D}.png" alt="">
                <div class="project-card-content">
                    <h3>kitten cloud</h3>
                    <p>KE云盘，存储你的项目文件</p>
                </div>
            </a>
        </div>


        <div style="margin-top:40px;display:flex;justify-content:space-between;align-items:center;">
            <div class="section-title">
                <i class="mdi mdi-package-variant"></i>
                优秀作品
            </div>
            <a class="more-link" href="/workpool">查看更多</a>
        </div>
    </div>

<script>
// 数组1：轮播图片列表，在这里添加/修改轮播图地址
const imgList = [
    "https://cdn-community.bcmcdn.com/47/community/yetapxLXjOEEOMLOYi9bANqDwON3inPzxvMe7QglpD5s.jpg?hash=FrCu1-igZ29Rhw143uG0MJEZycdA",
    "/localcdn/gzs/%7B93D330BB-21E1-46CF-8EDB-262229E1024D%7D.png"
];

const bannerDom = document.getElementById('banner');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const dotsWrap = document.getElementById('dotsWrap');

let currentIndex = 0;
let timer = null;
const autoPlayDelay = 4000; // 自动轮播间隔毫秒

// 生成小圆点
function createDots(){
    dotsWrap.innerHTML = '';
    imgList.forEach((_, idx)=>{
        const dot = document.createElement('div');
        dot.className = 'dot' + (idx === currentIndex ? ' active' : '');
        dot.dataset.index = idx;
        dot.addEventListener('click',()=>{
            goTo(Number(dot.dataset.index));
        })
        dotsWrap.appendChild(dot);
    })
}

// 更新banner图片与圆点状态
function renderBanner(){
    bannerDom.style.backgroundImage = `url(${imgList[currentIndex]})`;
    // 更新圆点active
    const dots = dotsWrap.querySelectorAll('.dot');
    dots.forEach((d,i)=>{
        d.classList.toggle('active', i === currentIndex);
    })
}

// 跳转到指定下标
function goTo(index){
    if(index < 0) index = imgList.length -1;
    if(index >= imgList.length) index = 0;
    currentIndex = index;
    renderBanner();
}

// 上一张
function prev(){
    goTo(currentIndex - 1);
}
// 下一张
function next(){
    goTo(currentIndex + 1);
}

// 启动自动播放
function startAuto(){
    clearInterval(timer);
    timer = setInterval(next, autoPlayDelay);
}
// 停止自动播放
function stopAuto(){
    clearInterval(timer);
}

// 绑定按钮事件
btnPrev.addEventListener('click', prev);
btnNext.addEventListener('click', next);

// 鼠标悬停停止轮播，离开恢复
bannerDom.addEventListener('mouseenter', stopAuto);
bannerDom.addEventListener('mouseleave', startAuto);

// 初始化
createDots();
renderBanner();
startAuto();
</script>
<script src="/localcdn/gzs/knf.js?v=2"></script>
</body>
</html>
