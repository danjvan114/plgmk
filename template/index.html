<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编程猫社区</title>
<style>
/* ===== KE 官网皮肤(内嵌自包含,与插件市场新版 ked-market.css 一致) ===== */
/* ============================================================
   KN Expanse Landing — v8 皮肤
   单层描边(上下高光) · 主题专属背景/卡片/Logo · 液态玻璃
   ============================================================ */

/* ---------- 主题变量 ---------- */
:root, body.theme-aurora {
  --bg-base:#eef1f8;
  --orb-a:rgba(107,114,245,.10);
  --orb-b:rgba(155,124,247,.08);
  --orb-c:rgba(96,165,250,.06);
  --accent-1:#6b72f5; --accent-2:#9b7cf7; --accent-3:#60a5fa;
  --accent-glow:rgba(107,114,245,.30);
  --grad-btn:linear-gradient(135deg,#6b72f5,#8a6df0);
  --grad-title:linear-gradient(115deg,#5b63e8,#8a6df0 55%,#4f8ee0);
  --glass-nav:rgba(255,255,255,.18);
  --glass-card:rgba(255,255,255,.09);
  --solid-glass:#ffffff;
  --glass-strong:rgba(255,255,255,.18);
  --glass-tint:rgba(107,114,245,.10);
  --glass-tint-2:rgba(107,114,245,.20);
  --glass-hi-top:rgba(255,255,255,.55);
  --glass-hi-bot:rgba(0,0,0,.07);
  --shadow:0 8px 30px rgba(42,54,94,.08);
  --shadow-hover:0 26px 64px rgba(42,54,94,.20);
  --text-1:#1d2238; --text-2:#4a5270; --text-3:#7c83a2;
}
body.dark-mode {
  --bg-base:#0a0d1a;
  --orb-a:rgba(129,140,248,.09); --orb-b:rgba(167,139,250,.07); --orb-c:rgba(56,189,248,.05);
  --accent-1:#818cf8; --accent-2:#a78bfa; --accent-3:#22d3ee;
  --accent-glow:rgba(129,140,248,.42);
  --grad-btn:linear-gradient(135deg,#6d7cf6,#9370f2);
  --grad-title:linear-gradient(115deg,#93a2ff,#a78bfa 55%,#4ed3ee);
  --glass-nav:rgba(255,255,255,.16);
  --glass-card:rgba(255,255,255,.06);
  --solid-glass:#1a2038;
  --glass-strong:rgba(255,255,255,.12);
  --glass-tint:rgba(129,140,248,.14);
  --glass-tint-2:rgba(129,140,248,.26);
  --glass-hi-top:rgba(255,255,255,.16);
  --glass-hi-bot:rgba(0,0,0,.28);
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --shadow-hover:0 26px 64px rgba(0,0,0,.6);
  --text-1:#e8eaf4; --text-2:#a9aec5; --text-3:#8b92ad;
}
/* KE 全站统一导航 v7 变量(与插件市场一致) */
:root {
  --ke-accent:#6b72f5; --ke-accent-2:#9b7cf7;
  --ke-glass-nav:rgba(255,255,255,.18);
  --ke-glass-card:rgba(255,255,255,.09);
  --ke-glass-strong:rgba(255,255,255,.18);
  --ke-tint:rgba(107,114,245,.10);
  --ke-tint-2:rgba(107,114,245,.20);
  --ke-text-1:#1d2238; --ke-text-2:#4a5270; --ke-text-3:#7c83a2;
  --ke-hi-top:rgba(255,255,255,.55); --ke-hi-bot:rgba(0,0,0,.07);
  --ke-shadow:0 8px 30px rgba(42,54,94,.08);
  --ke-shadow-hover:0 26px 64px rgba(42,54,94,.20);
  --ke-bg:#eef1f8;
  --ke-orb-a:rgba(107,114,245,.14); --ke-orb-b:rgba(155,124,247,.10); --ke-orb-c:rgba(96,165,250,.08);
  --ke-pop-bg:rgba(255,255,255,.46);
}
body.ke-dark {
  --ke-accent:#818cf8; --ke-accent-2:#a78bfa;
  --ke-glass-nav:rgba(255,255,255,.16);
  --ke-glass-card:rgba(255,255,255,.06);
  --ke-glass-strong:rgba(255,255,255,.12);
  --ke-tint:rgba(129,140,248,.14);
  --ke-tint-2:rgba(129,140,248,.26);
  --ke-text-1:#e8eaf4; --ke-text-2:#a9aec5; --ke-text-3:#8b92ad;
  --ke-hi-top:rgba(255,255,255,.16); --ke-hi-bot:rgba(0,0,0,.28);
  --ke-shadow:0 8px 30px rgba(0,0,0,.45);
  --ke-shadow-hover:0 26px 64px rgba(0,0,0,.6);
  --ke-bg:#0a0d1a;
  --ke-orb-a:rgba(129,140,248,.12); --ke-orb-b:rgba(167,139,250,.09); --ke-orb-c:rgba(56,189,248,.07);
  --ke-pop-bg:rgba(22,26,45,.86);
}

/* ---------- 基础 ---------- */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body { overflow-x:hidden; touch-action:pan-y; font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg-base); color:var(--text-1); line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .6s ease,color .6s ease; min-height:100vh; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent-1); outline-offset:2px; border-radius:6px; }

/* ---------- 背景光效层 ---------- */
.ke-bg-layer { position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden; }
.ke-bg-orb { position:absolute; border-radius:50%; filter:blur(110px); opacity:.75; animation:keOrb 34s ease-in-out infinite; }
.ke-bg-orb-1 { width:60vw; height:60vw; max-width:840px; max-height:840px; background:radial-gradient(circle,var(--ke-orb-a),transparent 70%); top:-24%; left:-18%; }
.ke-bg-orb-2 { width:48vw; height:48vw; max-width:660px; max-height:660px; background:radial-gradient(circle,var(--ke-orb-b),transparent 70%); top:42%; right:-22%; animation-delay:-12s; }
.ke-bg-orb-3 { width:42vw; height:42vw; max-width:560px; max-height:560px; background:radial-gradient(circle,var(--ke-orb-c),transparent 70%); bottom:-20%; left:26%; animation-delay:-20s; }
@keyframes keOrb { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(50px,-55px) scale(1.1)} 50%{transform:translate(-40px,40px) scale(.92)} 75%{transform:translate(-48px,-30px) scale(1.05)} }
.ke-bg-darkimg { position:fixed; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .9s ease; pointer-events:none; }
body.ke-dark .ke-bg-darkimg { opacity:.9; }
body.ke-bg-on { background:var(--ke-bg) !important; }

/* ---------- 导航(单层描边) ---------- */
.ke-header { position:fixed; top:14px; left:50%; transform:translateX(-50%); width:min(94%,1420px); height:60px; border-radius:60px; background:var(--ke-glass-nav); -webkit-backdrop-filter:blur(26px) saturate(190%); backdrop-filter:blur(26px) saturate(190%); box-shadow:inset 0 1px 0 var(--ke-hi-top), inset 0 -1px 0 var(--ke-hi-bot), var(--ke-shadow); z-index:1000; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 16px; box-sizing:border-box; transition:background .5s,box-shadow .5s; }
.ke-nav-left { display:flex; align-items:center; gap:12px; min-width:0; }
.ke-logo { display:flex; align-items:center; gap:9px; font-weight:800; font-size:18px; color:var(--ke-text-1); white-space:nowrap; text-decoration:none; flex:none; letter-spacing:-.2px; }
.ke-logo img { height:31px; width:auto; border-radius:8px; display:block; }
.ke-nav-links { display:flex; gap:4px; }
.ke-nav-links a { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:30px; color:var(--ke-text-2); font-size:14.5px; font-weight:600; text-decoration:none; white-space:nowrap; transition:color .25s,background .3s,box-shadow .3s,transform .5s cubic-bezier(.34,1.56,.64,1); }
.ke-nav-links a svg { opacity:.78; flex:none; transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
.ke-nav-links a:hover { color:var(--ke-accent); background:var(--ke-tint); box-shadow:inset 0 2px 0 var(--ke-hi-top), inset 0 -2px 0 var(--ke-hi-bot); transform:translateY(-2px) scale(1.05); }
.ke-nav-links a:hover svg { transform:rotate(-8deg) scale(1.15); }
.ke-nav-links a.active { color:var(--ke-accent); background:var(--ke-tint-2); box-shadow:inset 0 2px 0 var(--ke-hi-top), inset 0 -2px 0 var(--ke-hi-bot); }
.ke-nav-right { display:flex; align-items:center; gap:10px; position:relative; }
.ke-icon-btn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:var(--ke-glass-nav); color:var(--ke-text-2); -webkit-backdrop-filter:blur(12px) saturate(170%); backdrop-filter:blur(12px) saturate(170%); box-shadow:inset 0 1px 0 var(--ke-hi-top), inset 0 -1px 0 var(--ke-hi-bot); display:flex; align-items:center; justify-content:center; transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s,color .3s; }
.ke-icon-btn:hover { background:var(--ke-tint); color:var(--ke-accent); box-shadow:inset 0 2px 0 var(--ke-hi-top), inset 0 -2px 0 var(--ke-hi-bot); transform:scale(1.1); }
.ke-icon-btn:active { transform:scale(.92); }
.ke-icon-btn .ke-caret { transition:transform .35s; }
.ke-icon-btn.open .ke-caret { transform:rotate(180deg); }
#keThemeBtn { position:relative; }
#keThemeBtn svg { position:absolute; transition:opacity .45s ease, transform .55s cubic-bezier(.34,1.56,.64,1); }
#keThemeBtn .ke-ic-sun { opacity:1; transform:rotate(0) scale(1); }
#keThemeBtn .ke-ic-moon { opacity:0; transform:rotate(-90deg) scale(.4); }
body.ke-dark #keThemeBtn .ke-ic-sun { opacity:0; transform:rotate(90deg) scale(.4); }
body.ke-dark #keThemeBtn .ke-ic-moon { opacity:1; transform:rotate(0) scale(1); }
.ke-avatar-btn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; padding:0; overflow:hidden; background:var(--ke-tint); color:var(--ke-accent); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 var(--ke-hi-top), inset 0 -1px 0 var(--ke-hi-bot); transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s; }
.ke-avatar-btn:hover { transform:scale(1.1); box-shadow:inset 0 2px 0 var(--ke-hi-top), inset 0 -2px 0 var(--ke-hi-bot); }
.ke-avatar-btn img { width:100%; height:100%; object-fit:cover; display:block; }
.ke-avatar-btn .ke-avatar-fallback { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
.ke-burger { display:none; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:var(--ke-glass-nav); flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.ke-burger i { display:block; width:17px; height:2px; border-radius:2px; background:var(--ke-text-2); transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s; }
.ke-header.ke-open .ke-burger i:nth-child(1) { transform:translateY(6px) rotate(45deg); }
.ke-header.ke-open .ke-burger i:nth-child(2) { opacity:0; }
.ke-header.ke-open .ke-burger i:nth-child(3) { transform:translateY(-6px) rotate(-45deg); }
.ke-pop { position:fixed; top:0; right:0; z-index:5000; padding:10px; border-radius:20px; background:var(--ke-pop-bg); -webkit-backdrop-filter:blur(34px) saturate(190%); backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--ke-hi-top), inset 0 -1px 0 var(--ke-hi-bot), var(--ke-shadow-hover); opacity:0; transform:translateY(10px) scale(.95); pointer-events:none; visibility:hidden; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1),visibility .3s,background-color .5s ease; transform-origin:top right; }
.ke-pop.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
.ke-pop-min { min-width:214px; }
.ke-pop-wide { width:224px; padding:12px; }
.ke-pop-lang { min-width:132px; padding:8px; border-radius:16px; transform:translateY(8px) scale(.92); }
.ke-pop-lang.show { transform:none; }
.ke-pop-item, .ke-tp-item { display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:none; background:transparent; color:var(--ke-text-2); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; text-align:left; text-decoration:none; border-radius:14px; box-sizing:border-box; transition:background .25s,color .25s; }
.ke-pop-item svg, .ke-tp-item svg { flex:none; opacity:.85; }
.ke-pop-item:hover, .ke-tp-item:hover { background:var(--ke-tint); color:var(--ke-accent); }
.ke-pop-item.cur, .ke-tp-item.cur { color:var(--ke-accent); background:var(--ke-tint); }
.ke-pop-item.cur::after, .ke-tp-item.cur::after { content:'✓'; margin-left:auto; font-weight:800; }
.ke-pop-item .ke-pop-txt { display:flex; flex-direction:column; align-items:flex-start; gap:2px; line-height:1.3; }
.ke-pop-item .ke-pop-sub { font-size:10.5px; font-weight:500; color:var(--ke-text-3); }
.ke-tp-ico { width:24px; height:24px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--tint); color:var(--c); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.08); }
.ke-pop-sep { height:1px; background:var(--ke-hi-bot); margin:6px 4px; }
.ke-look-perf { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border:none; background:transparent; color:var(--ke-text-2); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; border-radius:14px; transition:background .25s,color .25s; }
.ke-look-perf-main { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
.ke-look-perf-main small { font-size:10.5px; font-weight:500; color:var(--ke-text-3); }
.ke-look-perf:hover { background:var(--ke-tint); color:var(--ke-accent); }
.ke-look-perf.on { color:var(--ke-accent); }
.ke-lang-item { display:block; width:100%; border:none; cursor:pointer; background:transparent; color:var(--ke-text-2); font-size:13px; font-weight:700; font-family:inherit; text-align:left; padding:8px 12px; border-radius:10px; transition:background .25s,color .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.ke-lang-item:hover { background:var(--ke-tint); color:var(--ke-accent); transform:translateX(3px); }
.ke-lang-item.cur { color:var(--ke-accent); background:var(--ke-tint); }
.ke-lang-item.cur::after { content:"\2713"; float:right; font-weight:800; }
.ke-lang-item.popped { animation:keLangPop .32s cubic-bezier(.34,1.56,.64,1); }
@keyframes keLangPop { 0% { transform:scale(1); } 45% { transform:scale(1.08); } 70% { transform:scale(.96); } 100% { transform:scale(1); } }
.ke-qr-tabs { display:flex; gap:6px; margin-bottom:10px; }
.ke-qr-tab { flex:1; padding:7px 4px; border:none; border-radius:11px; background:var(--ke-tint); color:var(--ke-text-2); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; transition:background .25s,color .25s,transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .25s; }
.ke-qr-tab.active { background:var(--ke-tint-2); color:var(--ke-accent); transform:translateY(-1px) scale(1.05); box-shadow:inset 0 1px 0 var(--ke-hi-top); }
.ke-qr-tab:hover { transform:translateY(-1px) scale(1.05); }
.ke-qr-tab:active { transform:scale(.92); }
.ke-qr-imgs { position:relative; height:172px; margin-top:6px; transition:height .5s cubic-bezier(.34,1.56,.64,1); }
.ke-qr-pane { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; transform:scale(.88); pointer-events:none; transition:opacity .35s ease,transform .55s cubic-bezier(.34,1.56,.64,1); transform-origin:50% 15%; }
.ke-qr-pane.show { opacity:1; transform:scale(1); pointer-events:auto; }
.ke-qr-pane img { width:100%; height:172px; object-fit:contain; border-radius:12px; background:#fff; display:block; }
.ke-qr-name { font-size:12.5px; font-weight:700; color:var(--ke-text-2); white-space:nowrap; letter-spacing:.3px; }
.ke-dl-arrow { width:34px; height:40px; border-radius:30px; border:none; cursor:pointer; background:transparent; color:var(--ke-text-2); display:flex; align-items:center; justify-content:center; transition:transform .5s cubic-bezier(.34,1.56,.64,1),color .3s,background .3s; }
.ke-dl-arrow:hover { color:var(--ke-accent); background:var(--ke-tint); transform:translateY(-2px) scale(1.1); }
.ke-dl-arrow .ke-caret { transition:transform .35s; }
.ke-dl-arrow.open .ke-caret { transform:rotate(180deg); }
.ke-back { position:fixed; top:84px; left:50%; transform:translateX(-50%); width:min(94%,1420px); z-index:900; pointer-events:none; }
.ke-back-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 20px; border-radius:50px; border:none; cursor:pointer; background:var(--ke-glass-card); color:var(--ke-text-2); font-size:14px; font-weight:700; font-family:inherit; text-decoration:none; -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); box-shadow:inset 0 1px 0 var(--ke-hi-top), inset 0 -1px 0 var(--ke-hi-bot), var(--ke-shadow); pointer-events:auto; transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s,box-shadow .3s; }
.ke-back-btn:hover { color:var(--ke-accent); background:var(--ke-glass-strong); transform:translateY(-3px); box-shadow:var(--ke-shadow-hover); }
body.ke-dark .ke-icon-btn, body.ke-dark .ke-avatar-btn, body.ke-dark .ke-dl-arrow,
body.ke-dark .ke-nav-links a, body.ke-dark .ke-pop-item, body.ke-dark .ke-tp-item,
body.ke-dark .ke-look-perf, body.ke-dark .ke-lang-item, body.ke-dark .ke-qr-tab,
body.ke-dark .ke-qr-name, body.ke-dark .ke-back-btn { color:#c9cddd; }
body.ke-dark .ke-nav-links a.active, body.ke-dark .ke-icon-btn:hover, body.ke-dark .ke-pop-item:hover,
body.ke-dark .ke-tp-item:hover, body.ke-dark .ke-look-perf:hover, body.ke-dark .ke-lang-item:hover { color:#fff; }
body.lite-mode, body.lite-mode *, body.lite-mode *::before, body.lite-mode *::after {
  -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
  filter:none !important;
}
body.lite-mode { --ke-glass-nav:rgba(255,255,255,.60); --ke-glass-card:rgba(255,255,255,.55); --ke-glass-strong:rgba(255,255,255,.70); }
body.lite-mode.ke-dark { --ke-glass-nav:rgba(20,24,42,.72); --ke-glass-card:rgba(20,24,42,.66); --ke-glass-strong:rgba(20,24,42,.80); }
body.lite-mode .ke-pop { background-color:rgba(255,255,255,.66) !important; }
body.lite-mode.ke-dark .ke-pop { background-color:rgba(20,24,42,.78) !important; }
body.lite-mode .ke-bg-orb { display:none !important; }
body.lite-mode .ke-nav-links a, body.lite-mode .ke-icon-btn, body.lite-mode .ke-avatar-btn,
body.lite-mode .ke-pop-item, body.lite-mode .ke-tp-item, body.lite-mode .ke-look-perf,
body.lite-mode .ke-lang-item, body.lite-mode .ke-qr-tab, body.lite-mode .ke-dl-arrow { transform:none !important; }
@media (max-width:900px) {
  .ke-nav-links { display:none; }
  .ke-burger { display:flex; }
  .ke-header.ke-open { border-radius:26px; }
  .ke-header.ke-open .ke-nav-links { display:flex; flex-direction:column; align-items:stretch; position:absolute; top:66px; left:10px; right:10px; background:var(--ke-glass-strong); -webkit-backdrop-filter:blur(30px) saturate(190%); backdrop-filter:blur(30px) saturate(190%); border-radius:20px; padding:10px; box-shadow:var(--ke-shadow-hover), inset 0 1px 0 var(--ke-hi-top); }
  .ke-header.ke-open .ke-nav-links a { padding:11px 14px; }
  .ke-dl-arrow { display:none; }
}
@media (max-width:560px) {
  .ke-header { top:8px; height:54px; padding:0 8px 0 12px; width:min(96%,1420px); }
  .ke-icon-btn, .ke-avatar-btn, .ke-burger { width:36px; height:36px; }
  .ke-nav-right { gap:8px; }
  .ke-logo { font-size:16px; }
  .ke-logo img { height:27px; }
  .ke-back { top:70px; }
  .ke-pop { max-width:min(86vw,264px); }
}

/* ===================== 社区页内容区 ===================== */
.page { position:relative; z-index:1; padding:108px 0 60px; }
.container { max-width:1280px; margin:0 auto; padding:0 16px; }

/* Banner 轮播(全宽铺满,图片不裁切,左右残余由模糊背景填充) */
.banner-wrap {
  position:relative; width:100%; height:340px; overflow:hidden;
  background:var(--bg-base);
}
/* 模糊背景层:cover 铺满 + 高斯模糊,填充图片比例差异产生的空白 */
.banner-bg {
  position:absolute; inset:-40px;
  background-size:cover; background-position:center;
  filter:blur(32px) saturate(150%);
  transform:scale(1.08);
  transition:opacity .5s ease-in-out;
}
/* 完整图片层:不裁切,保持原始比例居中显示 */
.banner-img {
  position:absolute; top:0; left:0; right:0; bottom:0; margin:auto;
  max-width:100%; max-height:100%;
  width:auto; height:auto; object-fit:contain;
  z-index:2;
}
.banner-arrow {
  position:absolute; top:50%; transform:translateY(-50%); z-index:6;

      b.classList.toggle('theme-dark', dark);

  /* posPop 定位 / hover 300-250ms / 互斥 */
  function setupPops() {
    var mobile = isMobileUA();
    var groups = [
      ['keDlArrow', 'keDlPop'],
      ['keThemeBtn', 'keThemePop'],
      ['keLangBtn', 'keLangPop'],
      ['keQrBtn', 'keQrPop'],
      ['keAvatarBtn', 'keAvatarPop']
    ];
    var pops = [];
    groups.forEach(function (g) {
      var btn = document.getElementById(g[0]);
      var pop = document.getElementById(g[1]);
      if (btn && pop) pops.push({ btn: btn, pop: pop });
    });

    function anyOpen() {
      for (var i = 0; i < pops.length; i++) { if (pops[i].pop.classList.contains('show')) return true; }
      return false;
    }
    function closeOthers(exceptPop) {
      pops.forEach(function (o) {
        if (o.pop !== exceptPop) { o.pop.classList.remove('show'); o.btn.classList.remove('open'); o.btn.setAttribute('aria-expanded', 'false'); }
      });
    }
    function posPop(pop, btn) {
      var r = btn.getBoundingClientRect();
      var pw = pop.offsetWidth || 220;
      var left = r.right - pw;
      if (left < 10) left = 10;
      pop.style.left = left + 'px';
      pop.style.top = (r.bottom + 12) + 'px';
      pop.style.right = 'auto';
    }
    function openPop(o) {
      closeOthers(o.pop);
      posPop(o.pop, o.btn);
      o.pop.classList.add('show');
      o.btn.classList.add('open');
      o.btn.setAttribute('aria-expanded', 'true');
    }
    function closePop(o) {
      o.pop.classList.remove('show');
      o.btn.classList.remove('open');
      o.btn.setAttribute('aria-expanded', 'false');
    }

    pops.forEach(function (o) {
      var openT = null, closeT = null;
      if (!mobile) {
        o.btn.addEventListener('mouseenter', function () {
          clearTimeout(closeT);
          openT = setTimeout(function () { if (!anyOpen() || o.pop.classList.contains('show')) openPop(o); }, 300);
        });
        o.btn.addEventListener('mouseleave', function () {
          clearTimeout(openT);
          closeT = setTimeout(function () { closePop(o); }, 250);
        });
        o.pop.addEventListener('mouseenter', function () { clearTimeout(closeT); });
        o.pop.addEventListener('mouseleave', function () { closePop(o); });
      }
      o.btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (o.btn.id === 'keThemeBtn') {
          toggleTheme();
          closeOthers(o.pop);
          return;
        }
        var open = o.pop.classList.contains('show');
        closeOthers(o.pop);
        if (!open) { posPop(o.pop, o.btn); o.pop.classList.add('show'); o.btn.classList.add('open'); o.btn.setAttribute('aria-expanded', 'true'); }
      });
    });
    document.addEventListener('click', function () { pops.forEach(function (o) { closePop(o); }); });

    var tDay = document.getElementById('keTDay'), tNight = document.getElementById('keTNight'), lite = document.getElementById('keLite');
    if (tDay) tDay.addEventListener('click', function (e) { e.stopPropagation(); write(KEY_THEME, '0'); applyTheme(); });
    if (tNight) tNight.addEventListener('click', function (e) { e.stopPropagation(); write(KEY_THEME, '3'); applyTheme(); });
    if (lite) lite.addEventListener('click', function (e) {
      e.stopPropagation();
      write(KEY_LITE, curLite() ? '0' : '1');
      applyLite();
      showToast(curLite() ? '已开启节能模式' : '已关闭节能模式');
    });

    document.querySelectorAll('#keLangPop .ke-lang-item').forEach(function (it) {
      it.addEventListener('click', function () {
        write(KEY_LANG, it.getAttribute('data-lang'));
        location.reload();
      });
    });

    var qrPop = document.getElementById('keQrPop');
    if (qrPop) {
      qrPop.querySelectorAll('.ke-qr-tab').forEach(function (tab) {
        tab.addEventListener('click', function (e) {
          e.stopPropagation();
          var q = tab.getAttribute('data-q');
          qrPop.querySelectorAll('.ke-qr-tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
          qrPop.querySelectorAll('.ke-qr-pane').forEach(function (pn) { pn.classList.toggle('show', pn.getAttribute('data-q') === q); });
        });
      });
    }

    var burger = document.getElementById('keBurger');
    var header = document.getElementById('keHeader');
    if (burger && header) {
      burger.addEventListener('click', function (e) {
        e.stopPropagation();
        header.classList.toggle('ke-open');
      });
    }
  }

  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ke-glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:var(--ke-text-1);padding:11px 22px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:inset 0 1px 0 var(--ke-hi-top),var(--ke-shadow-hover);opacity:0;transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1);z-index:9000;pointer-events:none;';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
    setTimeout(function () {
      t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 350);
    }, 2000);
  }

  function setupAvatar() {
    var btn = document.getElementById('keAvatarBtn');

    if (!btn) return;
    function useFallback() {
      btn.innerHTML = '<span class="ke-avatar-fallback">' + IC.person + '</span>';
      btn.title = '个人中心';
    }
    if (typeof fetch !== 'function') return;
    fetch('/api/user/current?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .catch(function () { return { logged_in: false }; })
      .then(function (data) {
        if (data && data.logged_in) {
          var u = data.username || 'me';
          var av = data.avatar || (data.qq ? 'https://q1.qlogo.cn/g?b=qq&nk=' + data.qq + '&s=100' : '');
          if (av) {
            var img = document.createElement('img');
            img.alt = '头像';
            img.onerror = function () { useFallback(); };
            img.src = av;
            btn.innerHTML = '';
            btn.appendChild(img);
          } else { useFallback(); }
          if (title) title.textContent = (data.nickname || u);
          var home = document.getElementById('keMyHome');
          if (home) home.setAttribute('href', '/u/' + encodeURIComponent(u));
        } else {
          useFallback();
          btn.title = '登录';
          btn.addEventListener('click', function (e) { e.stopPropagation(); location.href = '/login'; });
        }
      });

    img.alt = '';
    document.body.appendChild(img);
    document.body.classList.add('ke-bg-on');
  }

  function boot() {
    if (!document.body) { setTimeout(boot, 50); return; }
    var sub = !!(document.body.getAttribute && document.body.getAttribute('data-ke') === 'sub');
    buildHeader(sub);
    applyTheme();
    applyLite();
    setupPops();
    setupAvatar();
    setupBg();
    applyLangToNav();
    window.addEventListener('storage', function (e) {
      if (e.key === KEY_THEME) applyTheme();
      if (e.key === KEY_LITE) applyLite();
      if (e.key === KEY_LANG) applyLangToNav();
    });
    window.addEventListener('resize', function () {
      var h = document.getElementById('keHeader');
      if (h) h.classList.remove('ke-open');
      var any = document.querySelectorAll('.ke-pop.show');
      for (var i = 0; i < any.length; i++) any[i].classList.remove('show');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); });
  else setTimeout(boot, 0);
})();
</script>

<script>
/* ===== 社区页 Banner 轮播 ===== */
(function () {
  'use strict';
  // 轮播图片列表(3张):在这里添加/修改轮播图地址
  var imgList = [
    "https://cdn-community.bcmcdn.com/47/community/hXS14TQQCnFeLYEoPlEJoSMAjc7ezYcQZlirIkmomOhh.jpg?hash=FobyWUhtxFU_Pdvk9WU1YuLk2l8X",
    "https://cdn-community.bcmcdn.com/47/community/eYxABXwFCvsN3vDx6AZxd4VcV1zDd2NeGCyKHm4a24dy.jpeg?hash=Fo7PA_9HgbGXAO38PwVqHKyXp1Mq",
    "https://cdn-community.bcmcdn.com/47/community/sLB2I3LOrT3CtWYOq2pPCOQTogNrfBJcCSqLJMAzvsS5.jpg?hash=FkpNaUcDfjE4_84nVS0DLTESF4Uj"
  ];

  var bannerDom = document.getElementById('banner');
  var bannerBg = document.getElementById('bannerBg');
  var bannerImg = document.getElementById('bannerImg');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var dotsWrap = document.getElementById('dotsWrap');

  var currentIndex = 0;
  var timer = null;
  var autoPlayDelay = 4000;

  function createDots() {
    dotsWrap.innerHTML = '';
    imgList.forEach(function (_, idx) {
      var dot = document.createElement('div');
      dot.className = 'dot' + (idx === currentIndex ? ' active' : '');
      dot.dataset.index = idx;
      dot.addEventListener('click', function () { goTo(Number(dot.dataset.index)); });
      dotsWrap.appendChild(dot);
    });
  }

  function renderBanner() {
    var url = imgList[currentIndex];
    /* 模糊背景层:cover 铺满,填充左右空白 */
    bannerBg.style.backgroundImage = 'url(' + url + ')';
    /* 完整图片层:不裁切,保持原始比例 */
    bannerImg.src = url;
    bannerImg.alt = 'banner ' + (currentIndex + 1);
    var dots = dotsWrap.querySelectorAll('.dot');
    dots.forEach(function (d, i) { d.classList.toggle('active', i === currentIndex); });
  }

  function goTo(index) {
    if (index < 0) index = imgList.length - 1;
    if (index >= imgList.length) index = 0;
    currentIndex = index;
    renderBanner();
  }
  function prev() { goTo(currentIndex - 1); }
  function next() { goTo(currentIndex + 1); }

  function startAuto() { clearInterval(timer); timer = setInterval(next, autoPlayDelay); }
  function stopAuto() { clearInterval(timer); }

  btnPrev.addEventListener('click', prev);
  btnNext.addEventListener('click', next);
  bannerDom.addEventListener('mouseenter', stopAuto);
  bannerDom.addEventListener('mouseleave', startAuto);

  createDots();
  renderBanner();
  startAuto();
})();
</script>

<script>
/* ===== 卡片悬浮倾斜(浮起过渡 + 鼠标跟随倾斜;移动端禁用) ===== */
(function () {
  'use strict';
  var mobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|MQQBrowser/i.test(navigator.userAgent);
  if (mobile) return;

  var cards = document.querySelectorAll('.project-card');
  cards.forEach(function (card) {
    card.addEventListener('mousemove', function (e) {
      var r = card.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--ry', (px * 10).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-py * 10).toFixed(2) + 'deg');
    });
    card.addEventListener('mouseleave', function () {
      card.style.setProperty('--ry', '0deg');
      card.style.setProperty('--rx', '0deg');
    });
  });

  /* 返回顶部 */
  var backTop = document.getElementById('backTop');
  if (backTop) {
    var onScroll = function () { backTop.classList.toggle('show', (window.pageYOffset || document.documentElement.scrollTop) > 400); };
    window.addEventListener('scroll', onScroll, { passive: true });
    backTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }
})();
</script>
