<style>
/* ===== 社区首页 page-specific 样式 ===== */
.page { position:relative; z-index:1; padding:108px 0 60px; }
.container { max-width:1280px; margin:0 auto; padding:0 16px; }

/* Banner 轮播 */
.banner-wrap { position:relative; width:100%; height:260px; border-radius:22px; overflow:hidden; margin-bottom:34px; }
.banner-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(30px) brightness(1.08); transform:scale(1.15); z-index:0; transition:background-image .6s ease; }
.banner-img { position:relative; z-index:1; width:100%; height:100%; object-fit:contain; display:block; opacity:1; transition:opacity .5s ease; }
.banner-img.fade-out { opacity:0; }
.banner-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,255,255,.72); color:var(--text-1); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); display:flex; align-items:center; justify-content:center; transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s; }
.banner-arrow:hover { background:rgba(255,255,255,.85); transform:translateY(-50%) scale(1.12); }
.arrow-left { left:16px; }
.arrow-right { right:16px; }
.dots-wrap { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:3; display:flex; gap:8px; }
.dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.45); cursor:pointer; transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s; }
.dot.active { background:#fff; transform:scale(1.35); }

/* 标题行 */
.section-title-row { display:flex; justify-content:space-between; align-items:center; margin:44px 0 18px; }
.section-title { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:800; color:var(--text-1); letter-spacing:-.3px; }
.sec-ico { color:var(--accent-1); display:flex; }
.more-link { display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:700; color:var(--accent-1); transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
.more-link:hover { transform:translateX(4px); }

/* 项目卡片网格 */
.projects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; margin-top:20px; }
.project-card { display:block; border-radius:20px; overflow:hidden; text-decoration:none; }
.project-card img { width:100%; height:180px; object-fit:cover; display:block; }
.project-card-content { padding:18px 20px 20px; }
.project-card h3 { margin-bottom:6px; font-size:16.5px; font-weight:800; color:var(--text-1); letter-spacing:-.2px; }
.project-card p { color:var(--text-3); font-size:13.5px; line-height:1.65; }
.featured-loading { grid-column:1/-1; text-align:center; color:var(--text-3); font-size:14px; padding:30px 0; }
.featured-meta { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-3); }
.featured-meta span { display:inline-flex; align-items:center; gap:5px; }
.featured-meta i { color:var(--accent-1); font-size:12px; }
.work-thumb { height:180px; display:flex; align-items:center; justify-content:center; background:var(--glass-tint); color:var(--text-3); font-size:34px; }

/* 导航"更多"菜单动画修正:基础态 visibility:hidden,show 时才 visible */
.nav-more-menu { visibility:hidden !important; }
.nav-more-menu.show { visibility:visible !important; }

@media (max-width:720px) {
  .page { padding:88px 0 40px; }
  .container { padding:0 12px; }
  .banner-wrap { height:190px; border-radius:16px; }
  .projects-grid { gap:14px; }
  .project-card img { height:150px; }
  .section-title-row { margin:30px 0 12px; }
  .section-title { font-size:18px; }
}
</style>

<script>
/* ===== 社区页 i18n 翻译(复用 nav.js 的 data-i18n 体系) ===== */
(function () {
  'use strict';
  var LANGS = ['zh','tw','en','ja','ko','es'];
  var curLang = 'zh';
  try { var lsLang = localStorage.getItem('knexpanse-lang'); if (LANGS.indexOf(lsLang) >= 0) curLang = lsLang; } catch (e) {}
  var I18N_COMMUNITY = {
    sec_all:      {zh:'全部项目',tw:'全部項目',en:'All Projects',ja:'全プロジェクト',ko:'전체 프로젝트',es:'Todos los Proyectos'},
    sec_featured: {zh:'优秀作品',tw:'優秀作品',en:'Featured Works',ja:'優秀作品',ko:'우수 작품',es:'Obras Destacadas'},
    view_more:    {zh:'查看更多',tw:'查看更多',en:'View More',ja:'もっと見る',ko:'더 보기',es:'Ver Más'},
    p_bcm:        {zh:'KE Hub',en:'KE Hub',ja:'KE Hub',ko:'KE Hub',es:'KE Hub',tw:'KE Hub'},
    p_bcm_desc:   {zh:'不会凉凉发社区~~',tw:'不會涼涼發社區~~',en:'Community that won\'t fade~~',ja:'消えないコミュニティ~~',ko:'사라지지 않는 커뮤니티~~',es:'Comunidad que no se apaga~~'},
    p_mc:         {zh:'铁路mc服务器',tw:'鐵路mc伺服器',en:'Railway MC Server',ja:'鉄道MCサーバー',ko:'철도 MC 서버',es:'Servidor MC Ferrocarril'},
    p_mc_desc:    {zh:'一个基于minecraft的铁路服务器，为玩家提供铁路玩法~',tw:'一個基於minecraft的鐵路伺服器，為玩家提供鐵路玩法~',en:'A Minecraft railway server offering rail gameplay~',ja:'Minecraft鉄道サーバー,鉄道プレイを提供~',ko:'마인크래프트 철도 서버, 철도 플레이 제공~',es:'Servidor de ferrocarril Minecraft con jugabilidad ferroviaria~'},
    p_ccvue:      {zh:'CCvue框架',tw:'CCvue框架',en:'CCvue Framework',ja:'CCvueフレームワーク',ko:'CCvue 프레임워크',es:'Framework CCvue'},
    p_ccvue_desc: {zh:'一个基于vue的框架，用于快速开发web游戏应用',tw:'一個基於vue的框架，用於快速開發web遊戲應用',en:'A Vue-based framework for rapid web game development',ja:'Vueベースのフレームワーク,Webゲームを高速開発',ko:'Vue 기반 프레임워크, 웹 게임 빠르게 개발',es:'Framework basado en Vue para desarrollo rápido de juegos web'},
    p_ct:         {zh:'Crafting Table',en:'Crafting Table',ja:'Crafting Table',ko:'Crafting Table',es:'Crafting Table',tw:'Crafting Table'},
    p_ct_desc:    {zh:'一站式编程工具，方便快捷的编程（扫码体验）',tw:'一站式編程工具，方便快捷的編程（掃碼體驗）',en:'All-in-one coding tool, quick and easy programming (scan to try)',ja:'ワンストッププログラミングツール,簡単编程（QRコードで体験）',ko:'올인원 코딩 도구, 간편한 프로그래밍 (QR코드로 체험)',es:'Herramienta de programación todo en uno, fácil y rápida (escanea para probar)'},
    p_cloud:      {zh:'kitten cloud',en:'kitten cloud',ja:'kitten cloud',ko:'kitten cloud',es:'kitten cloud',tw:'kitten cloud'},
    p_cloud_desc: {zh:'KE云盘，存储你的项目文件',tw:'KE雲盤，存儲你的項目檔案',en:'KE Cloud Drive, store your project files',ja:'KEクラウドドライブ,プロジェクトファイルを保存',ko:'KE 클라우드 드라이브, 프로젝트 파일 저장',es:'KE Nube, almacena tus archivos de proyecto'}
  };
  function applyCommunityLang() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      var t = I18N_COMMUNITY[k];
      if (t && t[curLang]) el.textContent = t[curLang];
    });
  }
  applyCommunityLang();
  /* 监听语言切换(其他页面切换语言时同步) */
  window.addEventListener('storage', function (e) {
    if (e.key === 'knexpanse-lang') {
      try { var lsLang = localStorage.getItem('knexpanse-lang'); if (LANGS.indexOf(lsLang) >= 0) curLang = lsLang; } catch (e) {}
      applyCommunityLang();
    }
  });
})();
</script>
<script>
/* ===== 优秀作品:拉取作品池最新作品(/workpool?sort=new)并渲染 ===== */
(function () {
  'use strict';
  var grid = document.getElementById('featuredGrid');
  if (!grid) return;
  var LANGS = ['zh','tw','en','ja','ko','es'];
  var curLang = 'zh';
  try { var l = localStorage.getItem('knexpanse-lang'); if (LANGS.indexOf(l) >= 0) curLang = l; } catch (e) {}
  var TXT = {
    loading:   {zh:'加载中…',tw:'載入中…',en:'Loading…',ja:'読み込み中…',ko:'로딩 중…',es:'Cargando…'},
    empty:     {zh:'暂无作品',tw:'暫無作品',en:'No works yet',ja:'作品なし',ko:'작품 없음',es:'Sin obras'},
    err:       {zh:'暂时无法加载作品',tw:'暫時無法載入作品',en:'Unable to load works',ja:'作品を読み込めません',ko:'작품을 불러올 수 없음',es:'No se pueden cargar las obras'}
  };
  function t(k) { return (TXT[k] && TXT[k][curLang]) || TXT[k].zh; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  function render(works) {
    if (!works.length) { grid.innerHTML = '<div class="featured-loading">' + t('empty') + '</div>'; return; }
    var html = '';
    for (var i = 0; i < works.length && i < 8; i++) {
      var w = works[i];
      html += '<a class="project-card card" href="/workpool/' + esc(w.id) + '">' +
        (w.thumb ? '<img src="' + esc(w.thumb) + '" alt="' + esc(w.title) + '" loading="lazy" onerror="this.remove()">'
                 : '<div class="work-thumb" style="height:180px"><i class="fa-regular fa-image"></i></div>') +
        '<div class="project-card-content">' +
          '<h3 class="mdui-typo-headline">' + esc(w.title) + '</h3>' +
          '<p>' + esc(w.desc) + '</p>' +
          '<div class="featured-meta">' +
            '<span><i class="fa-solid fa-user"></i> ' + esc(w.author) + '</span>' +
            '<span><i class="fa-solid fa-thumbs-up"></i> ' + esc(w.like) + '</span>' +
            '<span><i class="fa-regular fa-comment"></i> ' + esc(w.comment) + '</span>' +
          '</div>' +
        '</div></a>';
    }
    grid.innerHTML = html;
    if (window.dispatchEvent) {
      /* 通知 tilt 脚本重新收集卡片 */
      document.body.appendChild(document.createComment('knx-refresh'));
    }
  }

  function load() {
    grid.innerHTML = '<div class="featured-loading" data-i18n="loading">' + t('loading') + '</div>';
    fetch('/workpool?sort=new', { credentials: 'same-origin' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var cards = doc.querySelectorAll('.work-card');
        var works = [];
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          var m = (c.getAttribute('onclick') || '').match(/\/workpool\/([\w-]+)/);
          var img = c.querySelector('.work-thumb img');
          var metas = c.querySelectorAll('.meta-item');
          works.push({
            id: m ? m[1] : '',
            thumb: img ? img.getAttribute('src') : '',
            title: (c.querySelector('h3') || {}).textContent || '',
            desc: (c.querySelector('p') || {}).textContent || '',
            author: metas[0] ? metas[0].textContent.trim() : '',
            like: metas[1] ? metas[1].textContent.trim() : '',
            comment: metas[metas.length - 1] ? metas[metas.length - 1].textContent.trim() : ''
          });
        }
        render(works);
      })
      .catch(function () {
        grid.innerHTML = '<div class="featured-loading">' + t('err') + '</div>';
      });
  }
  load();
  window.addEventListener('storage', function (e) {
    if (e.key === 'knexpanse-lang') {
      try { var l = localStorage.getItem('knexpanse-lang'); if (LANGS.indexOf(l) >= 0) curLang = l; } catch (err) {}
    }
  });
})();
</script>
<script>
/* ===== Banner 轮播(带淡入淡出动画) ===== */
(function () {
  'use strict';
  var imgList = [
    "https://cdn-community.bcmcdn.com/47/community/hXS14TQQCnFeLYEoPlEJoSMAjc7ezYcQZlirIkmomOhh.jpg?hash=FobyWUhtxFU_Pdvk9WU1YuLk2l8X",
    "https://cdn-community.bcmcdn.com/47/community/eYxABXwFCvsN3vDx6AZxd4VcV1zDd2NeGCyKHm4a24dy.jpeg?hash=Fo7PA_9HgbGXAO38PwVqHKyXp1Mq",
    "https://cdn-community.bcmcdn.com/47/community/sLB2I3LOrT3CtWYOq2pPCOQTogNrfBJcCSqLJMAzvsS5.jpg?hash=FkpNaUcDfjE4_84nVS0DLTESF4Uj"
  ];
  var bannerDom = document.getElementById('banner');
  var bannerBg = document.getElementById('bannerBg');
  var bannerImg = document.getElementById('bannerImg');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var dotsWrap = document.getElementById('dotsWrap');
  var currentIndex = 0;
  var timer = null;
  var autoPlayDelay = 4000;
  var transitioning = false;

  function createDots() {
    dotsWrap.innerHTML = '';
    imgList.forEach(function (_, idx) {
      var dot = document.createElement('div');
      dot.className = 'dot' + (idx === currentIndex ? ' active' : '');
      dot.dataset.index = idx;
      dot.addEventListener('click', function () { goTo(Number(dot.dataset.index)); });
      dotsWrap.appendChild(dot);
    });
  }

  function updateDots() {
    var dots = dotsWrap.querySelectorAll('.dot');
    dots.forEach(function (d, i) { d.classList.toggle('active', i === currentIndex); });
  }

  function fadeTo(index) {
    if (transitioning || index === currentIndex) return;
    transitioning = true;
    /* 1. 淡出当前图片 */
    bannerImg.classList.add('fade-out');
    setTimeout(function () {
      /* 2. 切换图片源 */
      currentIndex = index;
      var url = imgList[currentIndex];
      bannerBg.style.backgroundImage = 'url(' + url + ')';
      bannerImg.src = url;
      bannerImg.alt = 'banner ' + (currentIndex + 1);
      updateDots();
      /* 3. 浏览器加载完新图后淡入 */
      function fadeIn() {
        bannerImg.classList.remove('fade-out');
        transitioning = false;
      }
      if (bannerImg.complete) { fadeIn(); } else { bannerImg.onload = fadeIn; }
    }, 400);
  }

  function goTo(index) {
    if (index < 0) index = imgList.length - 1;
    if (index >= imgList.length) index = 0;
    fadeTo(index);
  }
  function prev() { goTo(currentIndex - 1); }
  function next() { goTo(currentIndex + 1); }
  function startAuto() { clearInterval(timer); timer = setInterval(next, autoPlayDelay); }
  function stopAuto() { clearInterval(timer); }

  btnPrev.addEventListener('click', prev);
  btnNext.addEventListener('click', next);
  bannerDom.addEventListener('mouseenter', stopAuto);
  bannerDom.addEventListener('mouseleave', startAuto);

  createDots();
  /* 初始渲染(不带动画) */
  var url0 = imgList[0];
  bannerBg.style.backgroundImage = 'url(' + url0 + ')';
  bannerImg.src = url0;
  startAuto();
})();
</script>
