<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KE Hub</title>
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/mdui.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/env.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/styles.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-layout.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 鍏ㄥ眬缁熶竴椤舵爮瀵艰埅(鎸傝浇鐐? -->
<div id="hv2"></div>

<div class="loader" id="loader">
        <div class="mdui-progress">
            <div class="mdui-progress-indeterminate"></div>
        </div>
    </div>
    
    <div class="main-box mdui-typo">
        <a href="/forum" class="back-link" title="杩斿洖璁哄潧"><i class="fa-solid fa-arrow-left"></i>杩斿洖璁哄潧</a>
        <div class="form-card">
            <h1 class="form-title"><i class="fa-solid fa-pen-nib" style="color:var(--accent-1)"></i>鍙戝竷鏂板笘
                <span id="teamBadge"></span>
            </h1>
            <form id="new-post-form">
                <div class="form-group">
                    <label>閫夋嫨鍒嗗尯 *</label>
                    <select id="forum_id" name="forum_id" required>
                        <option value="">璇烽€夋嫨鍒嗗尯</option>
                        {% for f in forums %}
                        <option value="{{ f.id }}">{{ f.name|e }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>甯栧瓙鏍囬 *锛?0 瀛椾互鍐咃級</label>
                    <input type="text" id="title" name="title" required maxlength="80" placeholder="杈撳叆甯栧瓙鏍囬">
                </div>
                <div class="form-group">
                    <label>甯栧瓙鍐呭 *锛堟敮鎸?Markdown锛?/label>
                    <textarea id="content" name="content" required placeholder="# 鏍囬&#10;**鍔犵矖**&#10;```浠ｇ爜鍧梎``"></textarea>
                </div>
                <button type="submit" class="submit-btn mdui-ripple"><i class="fa-solid fa-paper-plane"></i> 鍙戝竷</button>
            </form>
            <div class="md-hint">
                <strong><i class="fa-solid fa-circle-info" style="color:var(--accent-1)"></i> Markdown 璇硶璇存槑锛?/strong><br>
                <code># 鏍囬</code> 涓€绾ф爣棰?&nbsp; <code>## 浜岀骇鏍囬</code> &nbsp; <code>**鍔犵矖**</code> 鍔犵矖 &nbsp;
                <code>*鏂滀綋*</code> 鏂滀綋<br>
                <code>- 鍒楄〃椤?/code> 鏃犲簭鍒楄〃 &nbsp; <code>> 寮曠敤</code> 寮曠敤鍧?&nbsp;
                <code>```浠ｇ爜```</code> 浠ｇ爜鍧?&nbsp; <code>[鏂囧瓧](閾炬帴)</code> 瓒呴摼鎺?&nbsp; <code>![鍥剧墖](閾炬帴)</code> 鍥剧墖
            </div>
        </div>
    </div>

<script src="/localcdn/gzs/n2/vendor/mdui.min.js"></script>
<script src="/localcdn/gzs/n2/nav.js"></script>
<script src="/localcdn/gzs/n2/community-tilt.js"></script>
<script src="/localcdn/gzs/n2/community-mdui.js"></script>
<script src="/localcdn/gzs/n2/community-i18n.js"></script>

</body>
</html>
