<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鐢ㄦ埛绠＄悊</title>
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/mdui.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/env.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/styles.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-layout.css">
<link rel="stylesheet" href="/localcdn/gzs/n2/community-enhance.css">
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
</head>
<body class="theme-aurora" data-page="community">

<!-- 鍏ㄥ眬缁熶竴椤舵爮瀵艰埅(鎸傝浇鐐? -->
<div id="hv2"></div>

<div class="main-box mdui-typo">
<div class="card">
<div class="admin-header">
<h1>鐢ㄦ埛绠＄悊</h1>
</div>
<table class="user-table">
<thead>
<tr>
<th>鐢ㄦ埛鍚?/th>
<th>瑙掕壊</th>
<th>鎿嶄綔</th>
</tr>
</thead>
<tbody>
{% for username, info in users.items() %}
<tr>
<td>{{ username }}</td>
<td>
<span class="role-{{ info.role }}">
{{ {'admin':'绠＄悊鍛?, 'developer':'寮€鍙戣€?, 'user':'鏅€氱敤鎴?}[info.role] }}
</span>
</td>
<td>
<button class="btn mdui-ripple" onclick="showEditModal('{{ username }}', '{{ info.role }}')">缂栬緫</button>
<button class="btn btn-success mdui-ripple" onclick="getToken('{{ username }}')">鑾峰彇Token</button>
<a href="javascript:;" class="btn btn-danger mdui-ripple" onclick="if(confirm('纭畾鍒犻櫎鐢ㄦ埛锛?))fetch('/op/user/delete/{{ username }}',{method:'POST'}).then(()=>location.reload())">鍒犻櫎</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
<div class="add-section">
<h2 class="mdui-typo-headline">娣诲姞鐢ㄦ埛</h2>
<form action="/op/user/add" method="post">
<div class="form-group">
<label>鐢ㄦ埛鍚?/label>
<input type="text" name="username" required placeholder="璇疯緭鍏ョ敤鎴峰悕">
</div>
<div class="form-group">
<label>瀵嗙爜</label>
<input type="password" name="password" required placeholder="璇疯緭鍏ュ瘑鐮?>
</div>
<div class="form-group">
<label>瑙掕壊</label>
<select name="role">
<option value="user">鏅€氱敤鎴?/option>
<option value="developer">寮€鍙戣€?/option>
<option value="admin">绠＄悊鍛?/option>
</select>
</div>
<button type="submit" class="btn btn-success mdui-ripple">娣诲姞鐢ㄦ埛</button>
</form>
</div>
</div>
</div>
<div class="modal" id="editModal">
<div class="modal-content">
<h3 class="mdui-typo-headline">缂栬緫鐢ㄦ埛</h3>
<form action="" method="post" id="editForm">
<div class="form-group">
<label>鏂板瘑鐮侊紙鐣欑┖鍒欎笉淇敼锛?/label>
<input type="password" name="password" placeholder="璇疯緭鍏ユ柊瀵嗙爜">
</div>
<div class="form-group">
<label>瑙掕壊</label>
<select name="role">
<option value="user">鏅€氱敤鎴?/option>
<option value="developer">寮€鍙戣€?/option>
<option value="admin">绠＄悊鍛?/option>
</select>
</div>
<button type="submit" class="btn mdui-ripple">淇濆瓨淇敼</button>
<button type="button" class="btn btn-danger mdui-ripple" onclick="closeModal()">鍙栨秷</button>
</form>
</div>
</div>

<script src="/localcdn/gzs/n2/vendor/mdui.min.js"></script>
<script src="/localcdn/gzs/n2/nav.js"></script>
<script src="/localcdn/gzs/n2/community-tilt.js"></script>
<script src="/localcdn/gzs/n2/community-mdui.js"></script>
<script src="/localcdn/gzs/n2/community-i18n.js"></script>

</body>
</html>
