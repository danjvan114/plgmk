<title>登录中 - KE Hub</title>
<link rel="icon" type="image/png" href="/uploads/kn.png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }
  .spin {
    width: 72px;
    height: 72px;
    animation: s 1.4s linear infinite;
  }
  @keyframes s { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .err { text-align: center; padding: 40px; }
  .err h2 { margin: 0 0 8px; font-size: 18px; }
  .err p { margin: 0 0 20px; color: rgba(255,255,255,.7); font-size: 14px; }
  .err a { color: #7ab8ff; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
  <img id="spinner" class="spin" src="/loading.png" alt="" />
  <div id="errbox" hidden></div>

<script src="/js/page/login-at.js"></script>
