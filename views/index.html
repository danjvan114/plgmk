<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="renderer" content="webkit"/>
<title>KE Hub</title>
<link rel="icon" type="image/png" href="/uploads/kn.png">
<link rel="stylesheet" href="/vendor/ke/mdui.min.css">
<link rel="stylesheet" href="/vendor/ke/vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="/vendor/ke/env.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="theme-aurora" data-page="home">
<div id="app-shell"></div>
<main class="page-container" id="view">
  <div class="fade-enter">
    <!-- Hero Banner -->
    <div style="position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#1c1b2e,#3f2f6e 55%,#5b3fa8);color:#fff;padding:36px 32px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;box-shadow:0 16px 40px rgba(0,0,0,.18)">
      <img src="/uploads/kn.png" alt="" style="height:96px;width:96px;border-radius:20px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.4)">
      <div style="flex:1;min-width:260px">
        <div style="font-size:34px;font-weight:800;letter-spacing:.5px;color:#fff">KE Hub</div>
        <div style="opacity:1;color:#e9ecff;margin-top:6px;font-size:14px;font-weight:500">KE 社区 · 插件市场 / 论坛 / 作品池 / 团队 一站式入口</div>
      </div>
      <div style="display:flex;gap:10px">
        <a href="/market"><button type="button" class="btn primary" style="background:#ffffff;color:#1c1b2e;border:none;font-weight:700">进入插件市场</button></a>
        <a href="/upload"><button type="button" class="btn" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:600">上传插件</button></a>
      </div>
    </div>

    <!-- 四个入口卡片（骨架写死，统计数字 JS 填充） -->
    <div id="homeCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0">
      <a href="/market">
        <div class="plugin-card mdui-ripple" style="height:100%">
          <div style="display:flex;gap:14px;align-items:center">
            <div style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#6750a4;color:#fff;flex:none"><span class="material-icons">extension</span></div>
            <div style="min-width:0">
              <div style="font-weight:700;font-size:17px;color:var(--mdui-color-on-surface)">插件市场</div>
              <div class="stat-num" style="font-size:12px;color:var(--mdui-color-on-surface-variant)">0 个插件</div>
            </div>
          </div>
          <p class="pc-desc" style="margin-top:10px">浏览、下载与分享 KE 插件</p>
          <div class="pc-meta stat-hot">累计下载 0</div>
        </div>
      </a>
      <a href="/forum">
        <div class="plugin-card mdui-ripple" style="height:100%">
          <div style="display:flex;gap:14px;align-items:center">
            <div style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#0b6bcb;color:#fff;flex:none"><span class="material-icons">forum</span></div>
            <div style="min-width:0">
              <div style="font-weight:700;font-size:17px;color:var(--mdui-color-on-surface)">论坛</div>
              <div class="stat-num" style="font-size:12px;color:var(--mdui-color-on-surface-variant)">0 篇帖子</div>
            </div>
          </div>
          <p class="pc-desc" style="margin-top:10px">交流开发经验、求助答疑、站务公告</p>
        </div>
      </a>
      <a href="/workpool">
        <div class="plugin-card mdui-ripple" style="height:100%">
          <div style="display:flex;gap:14px;align-items:center">
            <div style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#c62828;color:#fff;flex:none"><span class="material-icons">rocket_launch</span></div>
            <div style="min-width:0">
              <div style="font-weight:700;font-size:17px;color:var(--mdui-color-on-surface)">作品池</div>
              <div class="stat-num" style="font-size:12px;color:var(--mdui-color-on-surface-variant)">0 个作品</div>
            </div>
          </div>
          <p class="pc-desc" style="margin-top:10px">发布你的 bcmkn / 图片 / 外链作品</p>
        </div>
      </a>
      <a href="/team">
        <div class="plugin-card mdui-ripple" style="height:100%">
          <div style="display:flex;gap:14px;align-items:center">
            <div style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#00897b;color:#fff;flex:none"><span class="material-icons">groups</span></div>
            <div style="min-width:0">
              <div style="font-weight:700;font-size:17px;color:var(--mdui-color-on-surface)">团队</div>
              <div class="stat-num" style="font-size:12px;color:var(--mdui-color-on-surface-variant)">0 个团队</div>
            </div>
          </div>
          <p class="pc-desc" style="margin-top:10px">组队协作，一起做点有意思的事</p>
        </div>
      </a>
    </div>

    <!-- 热门插件（section 标题静态，列表动态填充） -->
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="section-title"><span class="material-icons" style="color:var(--mdui-color-primary)">trending_up</span> 热门插件</div>
      <a href="/market" style="color:var(--mdui-color-primary);font-size:13px">查看全部 ›</a>
    </div>
    <div id="hotPlugins" class="grid-cards"><div class="empty-tip"><span class="ke-spinner"></span></div></div>

    <div style="text-align:center;margin:40px 0 10px;color:var(--mdui-color-outline);font-size:13px">
      使用遇到问题？查看 <a href="/docs" style="color:var(--mdui-color-primary)">开发者文档</a>
    </div>
  </div>
</main>
<script src="/js/core.js"></script>
<script src="/js/ripple.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/bots-manager.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/page/home.js"></script>
<script>window.__mdui && window.__mdui.mutation && window.__mdui.mutation();</script>
</body>
</html>
