<!doctype html>
<html lang="zh-cn">
<head>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <title>电梯选层</title>
    <style>
        body { background: #fff; margin: 0; }
        .floor-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            padding: 24px;
            max-width: 100%;
            margin: 0 auto;
        }
        .floor-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            background: #fff;
            font-size: 20px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .floor-btn:hover {
            background: #1976d2;
            color: #fff;
            border-color: #1976d2;
        }
        .floor-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="mdui-toolbar mdui-color-white">
        <span class="mdui-typo-title">电梯选层</span>
    </div>

    <div class="floor-grid" id="floorGrid"></div>

    <script>
        window.onload = function() {
            fetch('/api/elevator/floors')
                .then(res => res.json())
                .then(data => {
                    var grid = document.getElementById('floorGrid');
                    var count = data.floors.length;
                    var cols = Math.floor(document.body.clientWidth / 80);
                    if (cols < 2) cols = 2;
                    if (cols > 6) cols = 6;
                    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
                    
                    data.floors.forEach(function(floor) {
                        var btn = document.createElement('button');
                        btn.className = 'floor-btn mdui-ripple';
                        btn.textContent = floor.name;
                        btn.onclick = function() { selectFloor(floor.a); };
                        grid.appendChild(btn);
                    });
                });
        };

        function selectFloor(a) {
            fetch('/api/elevator/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ a: a })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    mdui.snackbar({ message: '已到达 ' + a + ' 层', position: 'top' });
                } else {
                    mdui.snackbar({ message: '执行失败: ' + data.message, position: 'top' });
                }
            })
            .catch(function() {
                mdui.snackbar({ message: '网络错误', position: 'top' });
            });
        }
    </script>
</body>
</html>
