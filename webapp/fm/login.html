<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css" rel="stylesheet">
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .encrypted-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            max-height: 80px;
            overflow-y: auto;
        }
        .hint {
            color: #999;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .mdui-textfield {
            margin-bottom: 20px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="mdui-icon material-icons">folder</i> 文件管理器</h2>
        
        <div class="hint">加密密码（请自行解密后输入）：</div>
        <div class="encrypted-box" id="encryptedBox">加载中...</div>
        <button class="mdui-btn mdui-btn-block mdui-color-grey-300 mdui-ripple" onclick="copyEncrypted()">
            <i class="mdui-icon material-icons">content_copy</i> 复制加密密码
        </button>
        
        <div class="mdui-textfield mdui-textfield-floating-label" style="margin-top: 20px;">
            <label class="mdui-textfield-label">密码</label>
            <input class="mdui-textfield-input" type="password" id="password" placeholder="请输入解密后的密码">
        </div>
        <button class="mdui-btn mdui-btn-block mdui-color-blue-500 mdui-ripple submit-btn" onclick="login()">
            <i class="mdui-icon material-icons">lock_open</i> 登录
        </button>
        <button class="mdui-btn mdui-btn-block mdui-color-grey-300 mdui-ripple" style="margin-top: 10px;" onclick="refreshPassword()">
            <i class="mdui-icon material-icons">refresh</i> 刷新密码
        </button>
    </div>

    <script>
        let currentEncrypted = '';

        async function loadEncryptedPassword() {
            const res = await fetch('/api/fm/encrypted-password');
            const data = await res.json();
            if (data.success) {
                currentEncrypted = data.encrypted_password;
                document.getElementById('encryptedBox').textContent = data.encrypted_password;
            }
        }

        function copyEncrypted() {
            navigator.clipboard.writeText(currentEncrypted);
            mdui.alert('已复制到剪贴板');
        }

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) {
                mdui.alert('请输入密码');
                return;
            }
            const res = await fetch('/api/fm/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                mdui.alert('登录成功', '成功', () => {
                    window.location.href = '/fm';
                });
            } else {
                mdui.alert(data.message);
            }
        }

        async function refreshPassword() {
            const res = await fetch('/api/fm/refresh-password', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                mdui.alert('密码已刷新');
                loadEncryptedPassword();
            }
        }

        loadEncryptedPassword();
    </script>
</body>
</html>
