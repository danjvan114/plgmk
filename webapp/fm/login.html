<!doctype html>
<html lang="zh-cn">
<head>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/localcdn/ico.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件管理器登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 500px; margin: 40px auto; padding: 0 16px; }
        .encrypted-box {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 12px;
            margin: 12px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            max-height: 60px;
            overflow-y: auto;
        }
        .hint { color: #999; font-size: 13px; margin-bottom: 8px; }
    </style>
</head>
<body>
    

    <div class="container">
        <div class="mdui-card">
            <div class="mdui-card-content" style="padding: 24px;">
                <h2 style="text-align: center; margin-bottom: 20px; color: #333;">身份验证</h2>

                <div class="hint">加密密码（请自行解密后输入）：</div>
                <div class="encrypted-box" id="encryptedBox">加载中...</div>
                <button class="mdui-btn mdui-btn-block mdui-color-grey-300 mdui-ripple" onclick="copyEncrypted()" style="margin-bottom: 16px;">
                    <i class="mdui-icon material-icons">content_copy</i> 复制加密密码
                </button>

                <div class="mdui-textfield mdui-textfield-floating-label">
                    <label class="mdui-textfield-label">密码</label>
                    <input class="mdui-textfield-input" type="password" id="password" placeholder="请输入解密后的密码" onkeyup="if(event.key==='Enter')login()">
                </div>

                <button class="mdui-btn mdui-ripple mdui-color-blue-500 mdui-text-color-white mdui-btn-block" onclick="login()" style="margin-top: 16px;">
                    <i class="mdui-icon material-icons">lock_open</i> 登录
                </button>
                <button class="mdui-btn mdui-ripple mdui-color-grey-300 mdui-btn-block" style="margin-top: 10px;" onclick="refreshPassword()">
                    <i class="mdui-icon material-icons">refresh</i> 刷新密码
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentEncrypted = '';

        async function loadEncryptedPassword() {
            const res = await fetch('/api/fm/encrypted-password');
            const data = await res.json();
            if (data.success) {
                currentEncrypted = data.encrypted_password;
                document.getElementById('encryptedBox').textContent = data.encrypted_password;
            }
        }

        function copyEncrypted() {
            navigator.clipboard.writeText(currentEncrypted);
            mdui.snackbar({ message: '已复制到剪贴板', position: 'top' });
        }

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) {
                mdui.snackbar({ message: '请输入密码', position: 'top' });
                return;
            }
            const res = await fetch('/api/fm/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/fm';
            } else {
                mdui.snackbar({ message: data.message, position: 'top' });
            }
        }

        async function refreshPassword() {
            const res = await fetch('/api/fm/refresh-password', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                mdui.snackbar({ message: '密码已刷新', position: 'top' });
                loadEncryptedPassword();
            }
        }

        loadEncryptedPassword();
    </script>
</body>
</html>
