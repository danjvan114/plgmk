<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <link rel="icon" type="image/x-icon" href="/localcdn/ico.png">
    <meta charset="UTF-8">
<title>绑定用户名</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:url('') no-repeat center center fixed;background-size:cover;min-height:100vh}
header{width:100%;height:64px;background:rgba(255,255,255,.95);position:fixed;top:0;left:0;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(0,0,0,.1);animation:slideDown 0.5s ease-out;z-index:100}
.wrap{max-width:1400px;margin:0 auto;width:100%;display:flex;align-items:center}
.logo{display:flex;align-items:center;color:#2196f3;font-size:24px;font-weight:bold;margin-right:20px}
.nav-links{display:flex;gap:16px}
.nav-links a{color:#333;text-decoration:none}
.nav-links a:hover{color:#2196f3}
.main-box{max-width:400px;margin:0 auto;padding-top:100px;padding-left:16px;padding-right:16px}
.card{background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:32px}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:#333;margin-bottom:8px;font-weight:500}
.form-group input{width:100%;padding:12px;border:1px solid rgba(0,0,0,.1);border-radius:8px;font-size:14px;outline:none;background:rgba(0,0,0,.02)}
.form-group input:focus{border-color:#2196f3}
.btn{background:#2196f3;color:#fff;padding:14px 24px;border:none;border-radius:8px;cursor:pointer;text-decoration:none;font-size:16px;width:100%;font-weight:500;transition:all 0.3s}
.btn:hover{background:#1976d2;transform:translateY(-2px);box-shadow:0 8px 25px rgba(33,150,243,.3)}
h1{color:#333;margin-bottom:8px;text-align:center;font-size:24px}
.subtitle{color:#666;text-align:center;font-size:14px;margin-bottom:24px}
.tip{text-align:center;color:#999;font-size:13px;margin-top:16px}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:slideDown 0.5s ease-out}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal.active{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:320px;text-align:center}
.modal-content .icon{font-size:48px;color:#f44336;margin-bottom:16px}
.modal-content p{color:#333;margin-bottom:20px}
.modal-content button{background:#2196f3;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="logo">用户中心</div>
<div class="nav-links">
<a href="/mk/kn">插件市场</a>
</div>
</div>
</header>
<div class="main-box">
<div class="card">
<h1>设置用户名</h1>
<p class="subtitle">外部账号已验证，请设置插件市场用户名</p>

<form method="post" action="/auth/bind">
<input type="hidden" name="uuid" value="{{ uuid }}">
<div class="form-group">
<label>用户名</label>
<input type="text" name="username" required placeholder="请输入用户名（字母数字下划线）">
</div>
<button type="submit" class="btn mdui-ripple">完成绑定</button>
</form>

<div class="tip">用户名设置后不可修改，请谨慎选择</div>
</div>
</div>
<div class="modal" id="errorModal">
<div class="modal-content">
<div class="icon">✕</div>
<p id="errorMessage"></p>
<button onclick="closeModal()">确定</button>
</div>
</div>
<script>
function showError(message) {
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('errorModal').classList.add('active');
}
function closeModal() {
    document.getElementById('errorModal').classList.remove('active');
}
{% if error %}
showError('{{ error }}');
{% endif %}
</script>
</body>
</html>
