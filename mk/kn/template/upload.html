<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <link rel="icon" type="image/x-icon" href="/localcdn/ico.png">
    <meta charset="UTF-8">
<title>上传插件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:url('') no-repeat center center fixed;background-size:cover;min-height:100vh}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.main-box{max-width:800px;margin:0 auto;padding-top:100px;padding-left:16px;padding-right:16px}
.card{background:rgba(255,255,255,.95);border-radius:12px;padding:32px;margin-bottom:24px}
.form-group{margin-bottom:20px}
.form-group label{display:block;color:#333;margin-bottom:8px;font-weight:500;font-size:15px}
.form-group textarea{height:120px;resize:vertical}
.form-group input[type="file"]{padding:12px;background:rgba(0,0,0,.02);border-radius:8px;width:100%}
.btn{background:#2196f3;color:#fff;padding:14px 32px;border:none;border-radius:8px;cursor:pointer;text-decoration:none;font-size:16px;font-weight:500;transition:all 0.3s}
.btn:hover{background:#1976d2;transform:translateY(-2px);box-shadow:0 8px 25px rgba(33,150,243,.3)}
.btn-cancel{background:rgba(0,0,0,.05);color:#333;margin-left:12px}
.btn-cancel:hover{background:rgba(0,0,0,.1)}
h1{color:#333;margin-bottom:8px;font-size:28px}
.subtitle{color:#666;margin-bottom:24px;font-size:14px}
.file-info{color:#999;font-size:13px;margin-top:6px}
.divider{height:1px;background:rgba(0,0,0,.05);margin:24px 0}
#loader{position:fixed;top:0;left:0;width:100%;z-index:9999}
#loader .mdui-progress{margin:0;border-radius:0}
.form-actions{display:flex;justify-content:flex-end;margin-top:32px;padding-top:24px;border-top:1px solid rgba(0,0,0,.05)}
.mdui-textfield-input{margin-bottom:4px}
.radio-group{display:flex;gap:20px;margin-bottom:16px}
.radio-group label{display:flex;align-items:center;gap:8px;cursor:pointer}
</style>
</head>
<body>
<div class="loader" id="loader">
<div class="mdui-progress">
<div class="mdui-progress-indeterminate"></div>
</div>
</div>

<div class="mdui-toolbar mdui-color-teal" style="position:fixed;top:0;left:0;right:0;z-index:99;">
        <a class="mdui-ripple mdui-btn-icon" onclick="window.history.back()">
            <i class="mdui-icon material-icons">arrow_back</i>
        </a>
        <span class="mdui-typo-title">上传插件</span>
        <div class="mdui-toolbar-spacer"></div>
        
      
</div>

<div class="main-box">
<div class="card">
<h1>上传新插件</h1>
<p class="subtitle">填写插件信息并发布到 KN 插件市场</p>

<form method="post" enctype="multipart/form-data" id="uploadForm">
<div class="form-group">
<div class="mdui-textfield mdui-textfield-floating-label ">
  <label class="mdui-textfield-label">插件名称 *</label>
  <input class="mdui-textfield-input " type="text" name="name" required>
</div>
</div>

<div class="form-group">
<div class="mdui-textfield mdui-textfield-floating-label">
  <label class="mdui-textfield-label">版本号 *</label>
  <input class="mdui-textfield-input" type="text" name="version" required>
</div>
</div>

<div class="form-group">
<div class="mdui-textfield mdui-textfield-floating-label">
  <label class="mdui-textfield-label">插件描述 *</label>
  <textarea class="mdui-textfield-input" name="description" required></textarea>
</div>
<div class="file-info">支持多行描述，简要说明插件功能</div>
</div>

<div class="form-group">
<div class="mdui-textfield mdui-textfield-floating-label">
  <label class="mdui-textfield-label">标签</label>
  <input class="mdui-textfield-input" type="text" name="tags">
</div>
<div class="file-info">多个标签用逗号分隔，例如: 工具, 美化, 效率</div>
</div>

<div class="divider"></div>

<h2 style="color:#333;margin-bottom:16px;font-size:18px">上传方式</h2>

<div class="radio-group">
  <label>
    <input type="radio" name="upload_type" value="file" checked onchange="toggleUploadType()"> 上传文件
  </label>
  <label>
    <input type="radio" name="upload_type" value="link" onchange="toggleUploadType()"> 外部链接
  </label>
</div>

<div id="fileUploadSection">
<div class="form-group">
  <label>插件文件</label>
  <input type="file" name="file" accept=".zip,.rar,.js,.exe" id="fileInput">
  <div class="file-info">支持格式: zip, rar, js, exe</div>
</div>
</div>

<div id="linkUploadSection" style="display:none">
<div class="form-group">
<div class="mdui-textfield mdui-textfield-floating-label">
  <label class="mdui-textfield-label">外部下载链接</label>
  <input class="mdui-textfield-input" type="text" name="download_url">
</div>
<div class="file-info">支持: 蓝奏云、GitHub、Gitee等直链或网盘分享链接</div>
</div>
</div>

<div class="form-actions">
  <button type="button" class="btn btn-cancel" onclick="window.history.back()">取消</button>
  <button type="submit" class="btn mdui-ripple">发布插件</button>
</div>
</form>
</div>
</div>

<script>
window.addEventListener('load',function(){document.getElementById('loader').style.display='none'});

function toggleUploadType() {
    const uploadType = document.querySelector('input[name="upload_type"]:checked').value;
    document.getElementById('fileUploadSection').style.display = uploadType === 'file' ? 'block' : 'none';
    document.getElementById('linkUploadSection').style.display = uploadType === 'link' ? 'block' : 'none';
}

document.getElementById('uploadForm').addEventListener('submit', function(e) {
    const uploadType = document.querySelector('input[name="upload_type"]:checked').value;
    
    if (uploadType === 'file') {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            e.preventDefault();
            mdui.alert('请选择要上传的文件', '提示');
            return false;
        }
    } else {
        const downloadUrl = document.querySelector('input[name="download_url"]');
        if (!downloadUrl.value.trim()) {
            e.preventDefault();
            mdui.alert('请填写外部下载链接', '提示');
            return false;
        }
    }
    
    mdui.showSnackbar({
        message: '正在上传插件...',
        timeout: 2000
    });
});
</script>
</body>
</html>
