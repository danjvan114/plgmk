/* ============================================================

/* ---------- 主题变量 ---------- */
:root, body.theme-aurora {
  --bg-base:#eef1f8;
  --orb-a:rgba(107,114,245,.10);
  --orb-b:rgba(155,124,247,.08);
  --orb-c:rgba(96,165,250,.06);
  --accent-1:#6b72f5; --accent-2:#9b7cf7; --accent-3:#60a5fa;
  --accent-glow:rgba(107,114,245,.30);
  --grad-btn:linear-gradient(135deg,#6b72f5,#8a6df0);
  --grad-title:linear-gradient(115deg,#5b63e8,#8a6df0 55%,#4f8ee0);
  --grad-eng-a:rgba(139,148,247,.95);
  --grad-eng-b:rgba(181,164,249,.95);
  --glass-nav:rgba(255,255,255,.18);
  --glass-card:rgba(255,255,255,.09);
  --solid-glass:#ffffff;
  --glass-strong:rgba(255,255,255,.18);
  --glass-tint:rgba(107,114,245,.10);
  --glass-tint-2:rgba(107,114,245,.20);
  --glass-hi-top:rgba(255,255,255,.55);
  --glass-hi-bot:rgba(0,0,0,.07);
  --shadow:0 8px 30px rgba(42,54,94,.08);
  --shadow-hover:0 26px 64px rgba(42,54,94,.20);
  --text-1:#1d2238; --text-2:#4a5270; --text-3:#7c83a2;
  --particle-color:#6b72f5;
}
body.theme-ocean {
  --bg-base:#0c2230;
  --orb-a:rgba(13,148,136,.16); --orb-b:rgba(20,184,166,.12); --orb-c:rgba(59,130,246,.10);
  --accent-1:#2dd4bf; --accent-2:#22d3ee; --accent-3:#38bdf8;
  --accent-glow:rgba(45,212,191,.35);
  --grad-btn:linear-gradient(135deg,#0d9488,#0aa5a0);
  --grad-title:linear-gradient(115deg,#2dd4bf,#22d3ee 55%,#38bdf8);
  --grad-eng-a:rgba(94,234,212,.95);
  --grad-eng-b:rgba(103,232,249,.95);
  --glass-nav:rgba(255,255,255,.28);
  --glass-card:rgba(255,255,255,.20);
  --solid-glass:#f2faf8;
  --glass-strong:rgba(255,255,255,.28);
  --glass-tint:rgba(13,148,136,.14);
  --glass-tint-2:rgba(13,148,136,.26);
  --glass-hi-top:rgba(255,255,255,.4);
  --glass-hi-bot:rgba(0,0,0,.1);
  --shadow:0 6px 18px rgba(0,22,28,.22);
  --shadow-hover:0 16px 40px rgba(0,22,28,.38);
  --text-1:#0e242c; --text-2:#2c4a54; --text-3:#4d6b73;
  --particle-color:#34d399;
}
body.theme-amber {
  --bg-base:#2a1605;
  --orb-a:rgba(217,119,6,.16); --orb-b:rgba(245,158,11,.12); --orb-c:rgba(239,68,68,.10);
  --accent-1:#fbbf24; --accent-2:#fb923c; --accent-3:#f87171;
  --accent-glow:rgba(251,191,36,.35);
  --grad-btn:linear-gradient(135deg,#d97706,#e8960a);
  --grad-title:linear-gradient(115deg,#fbbf24,#fb923c 55%,#f87171);
  --grad-eng-a:rgba(253,186,116,.95);
  --grad-eng-b:rgba(253,224,71,.95);
  --glass-nav:rgba(255,255,255,.28);
  --glass-card:rgba(255,255,255,.20);
  --solid-glass:#fff6ea;
  --glass-strong:rgba(255,255,255,.28);
  --glass-tint:rgba(217,119,6,.14);
  --glass-tint-2:rgba(217,119,6,.26);
  --glass-hi-top:rgba(255,255,255,.4);
  --glass-hi-bot:rgba(0,0,0,.1);
  --shadow:0 6px 18px rgba(32,12,0,.22);
  --shadow-hover:0 16px 40px rgba(32,12,0,.38);
  --text-1:#241505; --text-2:#4a3118; --text-3:#6b4c2a;
  --particle-color:#b45309;
}
body.dark-mode {
  --bg-base:#0a0d1a;
  --orb-a:rgba(129,140,248,.09); --orb-b:rgba(167,139,250,.07); --orb-c:rgba(56,189,248,.05);
  --accent-1:#818cf8; --accent-2:#a78bfa; --accent-3:#22d3ee;
  --accent-glow:rgba(129,140,248,.42);
  --grad-btn:linear-gradient(135deg,#6d7cf6,#9370f2);
  --grad-title:linear-gradient(115deg,#93a2ff,#a78bfa 55%,#4ed3ee);
  --grad-eng-a:rgba(165,180,252,.95);
  --grad-eng-b:rgba(199,184,253,.95);
  --glass-nav:rgba(255,255,255,.16);
  --glass-card:rgba(255,255,255,.06);
  --solid-glass:#1a2038;
  --glass-strong:rgba(255,255,255,.12);
  --glass-tint:rgba(129,140,248,.14);
  --glass-tint-2:rgba(129,140,248,.26);
  --glass-hi-top:rgba(255,255,255,.16);
  --glass-hi-bot:rgba(0,0,0,.28);
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --shadow-hover:0 26px 64px rgba(0,0,0,.6);
  --text-1:#e8eaf4; --text-2:#a9aec5; --text-3:#8b92ad;
  --particle-color:#eef2ff;
}

/* ---------- 基础 ---------- */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body { overflow-x:hidden; touch-action:pan-y; }
body.intro-on main { opacity:0; transition:opacity 1s ease; }
body:not(.intro-on) main { opacity:1; transition:opacity 1s ease; }
body { font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg-base); color:var(--text-1); overflow-x:hidden; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .6s ease,color .6s ease; min-height:100vh; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent-1); outline-offset:2px; border-radius:6px; }

/* ---------- 主题背景图 ---------- */
.bg-photo { position:fixed; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .9s ease; pointer-events:none; }
body.theme-ocean .bg-photo-ocean { opacity:.95; }
body.theme-amber .bg-photo-amber { opacity:.95; }
body.dark-mode .bg-photo-dark { opacity:.9; }
body.theme-ocean .parallax, body.theme-amber .parallax { opacity:.45; }

/* ---------- 背景光斑/粒子 ---------- */
.bg-layer { position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden; }
.parallax { position:absolute; inset:0; will-change:transform; }
.bg-orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:.7; animation:orbFloat 34s ease-in-out infinite; will-change:transform; }
.orb-1 { width:60vw; height:60vw; max-width:860px; max-height:860px; background:radial-gradient(circle,var(--orb-a),transparent 70%); top:-24%; left:-18%; }
.orb-2 { width:48vw; height:48vw; max-width:680px; max-height:680px; background:radial-gradient(circle,var(--orb-b),transparent 70%); top:42%; right:-22%; animation-delay:-12s; }
.orb-3 { width:42vw; height:42vw; max-width:580px; max-height:580px; background:radial-gradient(circle,var(--orb-c),transparent 70%); bottom:-20%; left:26%; animation-delay:-20s; }
/* 极光紫霞(基础页):右下角渐变色彩(进度条同款紫) */
body.theme-aurora .bg-layer::after { content:''; position:absolute; right:-6%; bottom:-10%; width:58vw; height:58vw; max-width:720px; max-height:720px; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(107,114,245,.26), rgba(155,124,247,.14) 46%, transparent 70%); filter:blur(22px); pointer-events:none; }
@keyframes orbFloat { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(50px,-55px) scale(1.1)} 50%{transform:translate(-40px,40px) scale(.92)} 75%{transform:translate(-48px,-30px) scale(1.05)} }
#particles { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; will-change:transform; }
#particles svg { position:absolute; top:-40px; color:var(--particle-color); opacity:.55; transition:opacity .3s,filter .3s; cursor:pointer; }
#particles svg.glow { opacity:1; filter:drop-shadow(0 0 10px var(--particle-color)); }
#particles svg.burst { animation:partBurst .5s cubic-bezier(.22,.61,.36,1) forwards !important; }
body.dark-mode #particles svg { opacity:.95; filter:drop-shadow(0 0 7px rgba(238,242,255,.85)); }
body.dark-mode #particles svg.glow { filter:drop-shadow(0 0 16px #eef2ff); }
@keyframes partBurst { to { transform:scale(3); opacity:0 !important; } }
@keyframes drift1 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(360deg);opacity:0} }
@keyframes drift2 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(-300deg);opacity:0} }
@keyframes drift3 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(420deg);opacity:0} }
@keyframes twinkle { 0%,100%{opacity:0;transform:scale(.2) rotate(0deg)} 50%{opacity:1;transform:scale(1.2) rotate(180deg)} }

.cursor-glow { position:fixed; pointer-events:none; z-index:9999; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(107,114,245,.05) 0%,transparent 65%); transform:translate(-50%,-50%); opacity:0; transition:opacity .4s; }
@media (hover:hover) { body:hover .cursor-glow { opacity:1; } }
@media (hover:none) { .cursor-glow { display:none !important; } }
/* 轻量模式(手动节能 / 无 WebGL):关掉重特效(orb 大模糊/粒子/鼠标光晕/视差),CPU 渲染不卡,下载不受影响 */
body.no-webgl .bg-orb, body.lite-mode .bg-orb,
body.no-webgl #particles, body.lite-mode #particles,
body.no-webgl .cursor-glow, body.lite-mode .cursor-glow { display:none !important; }
body.no-webgl .parallax, body.lite-mode .parallax { transform:none !important; }
body.no-webgl .bg-photo, body.lite-mode .bg-photo { filter:none !important; }
/* 性能模式按钮:节能态高亮 */
#perfBtn.lite { color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 0 14px var(--accent-glow); }
/* 性能提示浮层 */
.perf-tip { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(16px); z-index:2600; display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:18px; background:var(--glass-strong); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; pointer-events:none; transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1); }
.perf-tip.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
.perf-tip .pt-ico { width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--glass-tint); color:var(--accent-1); }
.perf-tip .pt-txt { font-size:13px; line-height:1.5; color:var(--text-1); max-width:300px; }
.perf-tip .pt-txt b { display:block; font-size:14px; }
.perf-tip .pt-btns { display:flex; gap:8px; flex:none; }
.perf-tip .pt-btn { border:none; cursor:pointer; padding:8px 14px; border-radius:30px; font-size:12.5px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s; }
.perf-tip .pt-btn:hover { transform:scale(1.08); background:var(--glass-tint-2); }
.perf-tip .pt-btn.ghost { color:var(--text-2); background:transparent; }
/* 悬浮窗:更实的玻璃(底字不透)+ 更高模糊 */
/* 节能按钮悬停状态小窗 */
.perf-wrap { position:relative; display:flex; }
.perf-pop { position:fixed; top:0; right:0; z-index:1300; background:var(--glass-strong); backdrop-filter:blur(36px) saturate(200%); -webkit-backdrop-filter:blur(36px) saturate(200%); border-radius:14px; padding:9px 14px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(6px) scale(.94); pointer-events:none; transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1); z-index:50; white-space:nowrap; }
.perf-pop.show { opacity:1; transform:none; pointer-events:auto; }
.perf-pop span { font-size:12.5px; font-weight:700; color:var(--accent-1); }
.perf-pop span.off { color:var(--text-2); }
.perf-pop-desc { display:block; margin-top:5px; max-width:210px; font-size:11px; line-height:1.55; color:var(--text-3); white-space:normal; font-weight:500; }
/* 移动端下载悬浮窗 */
.m-wrap { position:relative; display:flex; }
.lang-wrap { position:relative; display:flex; }
.lang-pop { position:fixed; top:0; right:0; min-width:132px; z-index:5000; padding:8px; border-radius:16px; background:rgba(255,255,255,.46); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(8px) scale(.92); pointer-events:none; visibility:hidden; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1),visibility .3s; }
body.dark-mode .lang-pop { background:rgba(22,26,45,.86); }
.lang-pop.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
.lang-item { display:block; width:100%; border:none; cursor:pointer; background:transparent; color:var(--text-2); font-size:13px; font-weight:700; font-family:inherit; text-align:left; padding:8px 12px; border-radius:10px; transition:background .25s,color .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.lang-item:hover { background:var(--glass-tint); color:var(--accent-1); transform:translateX(3px); }
.lang-item.cur { color:var(--accent-1); background:var(--glass-tint); }
.lang-item.cur::after { content:"\2713"; float:right; font-weight:800; }
.lang-item.popped { animation:langPop .32s cubic-bezier(.34,1.56,.64,1); }
@keyframes langPop { 0% { transform:scale(1); } 45% { transform:scale(1.08); } 70% { transform:scale(.96); } 100% { transform:scale(1); } }
.look-pop, .qr-pop { position:fixed; top:0; right:0; z-index:5000; padding:10px; border-radius:20px; background:rgba(255,255,255,.46); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; transform:translateY(10px) scale(.95); pointer-events:none; visibility:hidden; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1),visibility .3s; transform-origin:top right; }
.look-pop { min-width:214px; }
.look-pop.show, .qr-pop.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
body.dark-mode .look-pop, body.dark-mode .qr-pop { background:rgba(22,26,45,.86); }
.look-sep { height:1px; background:var(--glass-hi-bot); margin:6px 4px; }
.look-perf { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border:none; background:transparent; color:var(--text-2); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; border-radius:14px; transition:background .25s,color .25s; }
.look-perf-main { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
.look-perf-main small { font-size:10.5px; font-weight:500; color:var(--text-3); }
.look-perf:hover { background:var(--glass-tint); color:var(--accent-1); }
.look-perf.on { color:var(--accent-1); }
.qr-pop { width:224px; padding:12px; }
.qr-tabs { display:flex; gap:6px; margin-bottom:10px; }
.qr-tab { flex:1; padding:7px 4px; border:none; border-radius:11px; background:var(--glass-tint); color:var(--text-2); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; transition:background .25s,color .25s,transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .25s; }
.qr-tab.active { background:var(--glass-tint-2); color:var(--accent-1); transform:translateY(-1px) scale(1.05); box-shadow:inset 0 1px 0 var(--glass-hi-top); }
.qr-tab:hover { transform:translateY(-1px) scale(1.05); }
.qr-tab:active { transform:scale(.92); }
.qr-imgs { position:relative; height:172px; margin-top:6px; transition:height .5s cubic-bezier(.34,1.56,.64,1); }
.qr-pane { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; transform:scale(.88); pointer-events:none; transition:opacity .35s ease,transform .55s cubic-bezier(.34,1.56,.64,1); transform-origin:50% 15%; }
.qr-pane.show { opacity:1; transform:scale(1); pointer-events:auto; }
.qr-pane img { width:100%; height:172px; object-fit:contain; border-radius:12px; background:#fff; display:block; }
/* 移动端(按设备 UA 判定,与窗口宽度无关):二维码二级菜单只保留 QQ 群码 */
body.mobile .qr-tab[data-q="m"], body.mobile .qr-pane[data-q="m"] { display:none; }
.qr-name { font-size:12.5px; font-weight:700; color:var(--text-2); white-space:nowrap; letter-spacing:.3px; }
.m-pop { position:fixed; top:0; right:0; width:188px; z-index:1300; padding:12px; border-radius:18px; background:rgba(255,255,255,.46); backdrop-filter:blur(36px) saturate(200%); -webkit-backdrop-filter:blur(36px) saturate(200%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(8px) scale(.92); pointer-events:none; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1); z-index:50; text-align:center; }
body.dark-mode .m-pop { background:rgba(22,26,45,.86); }
.m-pop.show { opacity:1; transform:none; pointer-events:auto; }
.m-pop-title { display:block; font-size:12.5px; font-weight:800; color:var(--text-1); margin-bottom:8px; }
.m-pop img { display:block; width:132px; max-width:100%; margin:0 auto; border-radius:10px; }
.m-pop small { display:block; margin-top:7px; font-size:11.5px; font-weight:600; color:var(--accent-1); }
/* 移动端全屏下载页 */
.m-dl { position:fixed; inset:0; z-index:4000; display:flex; align-items:center; justify-content:center; padding:28px 22px; background:radial-gradient(circle at 50% 18%, var(--accent-glow), transparent 62%), var(--bg-base); opacity:0; transform:translateY(26px) scale(.97); pointer-events:none; transition:opacity .45s ease, transform .6s cubic-bezier(.34,1.56,.64,1); overflow-y:auto; }
.m-dl.show { opacity:1; pointer-events:auto; transform:none; }
/* 折叠屏/节能:起始页打开时主内容与页脚先不渲染,点"查看详细介绍"再加载 */
body.m-boot main, body.m-boot footer { display:none; }
body:not(.m-boot) main { animation:fadeIn .5s ease; }
.m-dl-inner { width:min(420px,100%); text-align:center; padding-top:28px; animation:menuIn .6s cubic-bezier(.34,1.56,.64,1) both; }
/* 首屏 logo:等比原图,按主题切换配色 */
.m-dl-logo { display:none; height:72px; width:auto; margin-bottom:16px; }
body.theme-aurora .m-dl-logo.th-def, body.dark-mode .m-dl-logo.th-def,
body.theme-ocean .m-dl-logo.th-ocean, body.theme-amber .m-dl-logo.th-amber { display:inline-block; }
/* 首屏右上角工具按钮(语言/外观/二维码):z-index 压过内容层,否则被 m-dl-inner 盖住点不到 */
.m-dl-tools { position:absolute; top:18px; right:18px; display:flex; gap:10px; z-index:10; }
.m-dl-tool { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-1); background:var(--solid-glass); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
.m-dl-tool:active { transform:scale(.9); }
/* 首屏文字:默认(紫色主题)用主题色;绿色/橙色主题背景偏暗,文字改白 */
.m-dl-hero { font-size:31px; font-weight:900; line-height:1.25; letter-spacing:.5px; color:var(--text-1); margin-bottom:36px; }
.m-dl-grad { background:var(--grad-title); -webkit-background-clip:text; background-clip:text; color:transparent; }
/* for creators:手写体、加粗、间距收紧 */

.badge-btn { display:inline-flex; align-items:center; gap:8px; margin-bottom:24px; padding:10px 20px; border-radius:50px; border:none; cursor:default; font-size:13.5px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 8px 20px var(--accent-glow); }

/* ---------- 卡片(单层描边) ---------- */
.card { background:var(--glass-card); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%); border-radius:24px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); position:relative; overflow:hidden; z-index:0; transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)); transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .5s,background .5s; will-change:transform; }
.card::after { content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1; background:linear-gradient(135deg,var(--glass-tint),transparent 60%); opacity:0; transition:opacity .5s ease; }
.card:hover { box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); --ty:-5px; }
.card:hover::after { opacity:1; }
.ripple { position:absolute; border-radius:50%; background:currentColor; opacity:.16; transform:scale(0); animation:ripple .7s ease-out forwards; pointer-events:none; z-index:3; }
@keyframes ripple { to { transform:scale(4); opacity:0; } }

/* ---------- Hero ---------- */
main { display:flex; align-items:center; gap:56px; padding:150px 5% 90px; min-height:100vh; max-width:1420px; margin:0 auto; flex-wrap:wrap; }
.text-area { flex:1 1 420px; min-width:300px; max-width:640px; }
h1 { font-size:clamp(38px,6vw,60px); line-height:1.16; font-weight:800; letter-spacing:-1px; margin-bottom:8px; }
.grad { background:var(--grad-title); -webkit-background-clip:text; background-clip:text; color:transparent; }
.handwritten { display:inline-block; margin-left:.45em; font-family:'Comic Sans MS','Segoe Print','Kaiti SC',cursive; font-style:italic; font-weight:800; font-size:.56em; line-height:1; vertical-align:.1em; background:linear-gradient(180deg,var(--grad-eng-a),var(--grad-eng-b)); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.desc { font-size:17.5px; line-height:1.75; color:var(--text-2); margin:22px 0 32px; max-width:520px; }
.btns { display:flex; gap:14px; flex-wrap:wrap; }

/* 终端产品图(按主题切换) */
.term { flex:1 1 440px; min-width:330px; max-width:680px; padding:16px; }
.term-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.dot { width:12px; height:12px; border-radius:50%; cursor:pointer; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.dot:hover { transform:scale(1.3); }
.dot-r { background:#ff5f57; } .dot-y { background:#ffbd2e; } .dot-g { background:#28c840; }
.term-title { margin-left:8px; font-size:12px; color:var(--text-3); letter-spacing:.4px; }
.terminal-image { width:100%; border-radius:12px; display:none; }
.term-fallback { display:none; width:100%; height:auto; border-radius:12px; }
.term-fallback.show { display:block; }
.term.shake { animation:termShake .5s ease; }
.term.glow { box-shadow:0 0 60px rgba(255,189,46,.5), inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover) !important; }
.term.scaled { transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px) scale(1.03); }
@keyframes termShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px) rotate(-1.5deg)} 40%{transform:translateX(9px) rotate(1.5deg)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

/* ---------- 通用区块 ---------- */
section, .stats-wrap { padding:86px 5%; max-width:1420px; margin:0 auto; position:relative; }
.section-title { text-align:center; font-size:clamp(30px,4.6vw,44px); font-weight:800; letter-spacing:-.5px; margin-bottom:14px; }
.handwritten-title { display:inline-block; margin-left:.45em; font-family:'Comic Sans MS','Segoe Print','Kaiti SC',cursive; font-style:italic; font-weight:800; font-size:.5em; vertical-align:.12em; background:linear-gradient(180deg,var(--grad-eng-a),var(--grad-eng-b)); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.title-logo { display:inline-flex; align-items:center; justify-content:center; vertical-align:-.14em; margin-right:.22em; width:1.3em; height:1.3em; border-radius:.3em; overflow:visible; }
.title-logo img { width:100%; height:100%; object-fit:contain; display:none; }

.watermark { position:absolute; right:-18px; bottom:-20px; width:120px; height:120px; color:var(--accent-1); opacity:.05; pointer-events:none; z-index:0; }

/* ---------- 为什么选择(紧凑排版) ---------- */
.feat-show { position:relative; max-width:880px; margin:0 auto; }
.feat-stage { position:relative; height:440px; padding-top:84px; }
.feat-panel { position:absolute; left:0; right:0; top:0; bottom:0; padding:36px 48px 32px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:var(--op,0); transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--off,0px)) scale(var(--sc,1)) rotate(var(--rot,0deg)); cursor:pointer; transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .5s; border-radius:26px; will-change:transform; }
.feat-panel.active { opacity:var(--op,1); }
.feat-panel.cur { box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); }
.feature-num { position:absolute; top:16px; right:28px; font-size:60px; font-weight:800; line-height:1; color:var(--accent-1); opacity:.13; letter-spacing:-2px; }
.feature-icon { width:52px; height:52px; border-radius:50%; margin-bottom:12px; background:var(--glass-tint); color:var(--accent-1); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), 0 8px 20px var(--accent-glow); display:flex; align-items:center; justify-content:center; transition:transform .55s cubic-bezier(.34,1.56,.64,1),box-shadow .4s; }
.feat-panel.active:hover .feature-icon { transform:scale(1.12) rotate(-6deg); }
.feat-panel h3 { font-size:24px; margin-bottom:6px; position:relative; z-index:1; }
.feat-panel > p { color:var(--text-3); font-size:14.5px; line-height:1.75; max-width:520px; margin:0 auto 12px; position:relative; z-index:1; }
.feat-list { list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:6px 22px; text-align:left; max-width:560px; width:100%; margin:0 auto 12px; position:relative; z-index:1; }
.feat-list li { position:relative; padding:5px 0 5px 24px; color:var(--text-2); font-size:13.5px; line-height:1.6; }
.feat-list li::before { content:'✓'; position:absolute; left:4px; color:var(--accent-1); font-weight:800; }
.feat-chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:30px; color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); }
.feat-link { display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:700; color:var(--accent-1); position:relative; z-index:1; }
.feat-tabs { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:26px; }
.ft-tab { display:flex; align-items:center; gap:8px; border:none; cursor:pointer; padding:10px 18px; border-radius:30px; font-size:13.5px; font-weight:700; color:var(--text-2); background:var(--glass-card); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); transition:all .45s cubic-bezier(.34,1.56,.64,1); }
.ft-tab i { font-style:normal; font-size:12px; font-weight:800; opacity:.6; }
.ft-tab:hover { transform:translateY(-2px) scale(1.05); color:var(--accent-1); }
.ft-tab.active { color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); }
/* 琥珀主题:tab 按钮 hover/点击保持深色字;mid UI 图标加深 */
body.theme-amber .ft-tab:hover, body.theme-amber .ft-tab.active { color:#241505; }
body.theme-amber .ft-tab i { opacity:.85; }
body.theme-amber .feature-icon { color:#241505; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), 0 6px 16px rgba(36,21,5,.22); }

/* ---------- 核心能力 coverflow ---------- */
.carousel { position:relative; margin:0 auto; max-width:1040px; }
.carousel-stage { position:relative; height:440px; perspective:1500px; }
.slide { position:absolute; left:50%; top:50%; width:min(330px,80vw); transform:translate(-50%,-50%) rotateY(0) scale(.8); opacity:0; pointer-events:none; z-index:1; transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .55s; }
.slide.active { opacity:1; z-index:3; pointer-events:auto; transform:translate(-50%,-50%) rotateY(0) scale(1); }
.slide.right-1 { opacity:.35; z-index:2; transform:translate(calc(-50% + 265px),-50%) rotateY(-26deg) scale(.82); }
.slide.left-1 { opacity:.35; z-index:2; transform:translate(calc(-50% - 265px),-50%) rotateY(26deg) scale(.82); }
.slide-inner { padding:44px 34px; text-align:center; border-radius:28px; }
.slide-inner .feature-icon { margin:0 auto 14px; }
.slide-inner h3 { font-size:22px; margin-bottom:10px; }

.carousel-nav { position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; background:var(--glass-card); color:var(--text-1); backdrop-filter:blur(12px) saturate(170%); -webkit-backdrop-filter:blur(12px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), var(--shadow); display:flex; align-items:center; justify-content:center; transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s; }
.carousel-nav:hover { transform:translateY(-50%) scale(1.12); background:var(--glass-tint); color:var(--accent-1); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); }
.carousel-nav:active { transform:translateY(-50%) scale(1) !important; }
#featShow .carousel-nav { z-index:50; }
.carousel-nav.prev { left:-56px; }
.carousel-nav.next { right:-56px; }
.carousel-dots { display:flex; justify-content:center; gap:8px; margin-top:22px; }
.carousel-dots button { width:9px; height:9px; border-radius:6px; border:none; cursor:pointer; padding:0; background:var(--text-3); opacity:.35; transition:all .45s cubic-bezier(.34,1.56,.64,1); }
.carousel-dots button:hover { opacity:.7; transform:scale(1.25); }
.carousel-dots button.active { width:28px; background:var(--accent-1); opacity:1; box-shadow:0 0 10px var(--accent-glow); }

/* ---------- 优秀扩展(卡片流) ---------- */
.ext-carousel { position:relative; max-width:1120px; margin:0 auto; }
.ext-stage { position:relative; height:300px; perspective:1500px; }
.ext-card { position:absolute; left:50%; top:50%; width:min(330px,80vw); transform:translate(-50%,-50%) rotateY(0) scale(.8); opacity:0; pointer-events:none; z-index:1; transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .55s; }
.ext-card.active { opacity:1; z-index:3; pointer-events:auto; transform:translate(-50%,-50%) rotateY(0) scale(1); }
.ext-card.right-1 { opacity:.35; z-index:2; transform:translate(calc(-50% + 300px),-50%) rotateY(-24deg) scale(.82); }
.ext-card.left-1 { opacity:.35; z-index:2; transform:translate(calc(-50% - 300px),-50%) rotateY(24deg) scale(.82); }
.ext-inner { padding:34px 30px; text-align:center; border-radius:26px; }
.ext-more { text-align:center; margin-top:22px; }
.ext-inner .feature-icon { margin:0 auto 12px; }
.ext-inner h3 { font-size:20px; margin-bottom:4px; }
.ext-author { font-size:12.5px; color:var(--text-3); margin-bottom:10px; }
.ext-inner p { color:var(--text-2); font-size:14px; line-height:1.75; margin-bottom:14px; }
.ext-foot { display:flex; align-items:center; justify-content:center; gap:12px; }
.ext-rate { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:800; color:var(--accent-1); }
.ext-install { display:inline-flex; align-items:center; gap:5px; padding:8px 20px; border-radius:30px; border:none; cursor:pointer; font-size:13px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .3s; }
.ext-install:hover { background:var(--glass-tint-2); transform:translateY(-2px); }

/* ---------- 统计(大标题 + 三列) ---------- */
.stats-card { position:relative; padding:34px 40px 52px; }
/* 项目数据:去掉 .card 的 overflow:hidden(否则左右按钮被裁剪)与父级 backdrop-filter(压住子卡片毛玻璃);
   同时移除卡片背景——只保留三张堆叠卡片,不要底部再叠一张"底卡";禁 tilt 消除划过时的背景轮廓 */
#statsCard { overflow:visible !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; background:transparent !important; box-shadow:none !important; border-radius:0 !important; transform:none !important; }
body.lite-mode #statsCard { background:transparent !important; }
.st-nav-btn { display:flex; position:absolute; top:50%; transform:translateY(-50%); z-index:30; }
#stPrev { left:-48px; z-index:60; }
#stNext { right:-48px; z-index:60; }
.st-dots { position:static; margin:16px auto 0; transform:none; }
.st-head { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:24px; }
.st-clock { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); padding:7px 14px; border-radius:22px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); letter-spacing:.6px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.st-clock svg { flex:none; opacity:.85; }
.st-clock em { font-style:normal; }
.st-live { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-2); opacity:.92; }
.st-live::after { content:''; width:1px; height:14px; background:var(--glass-hi-bot); margin-left:4px; opacity:.6; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18); flex:none; }
.st-grid { position:relative; min-height:380px; }
.st-col { position:absolute; left:0; right:0; top:0; height:auto; opacity:.5; overflow:hidden; transform:perspective(1200px) translateY(var(--st-y,0px)) scale(var(--st-sc,1)) rotate(var(--st-rot,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transform-origin:50% 50%; pointer-events:auto; transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .45s; background:rgba(255,255,255,.32); backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%); border-radius:22px; padding:16px; border:none !important; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); }
.st-col.cur { opacity:1; pointer-events:auto; background:rgba(255,255,255,.30); backdrop-filter:blur(22px) saturate(170%) !important; -webkit-backdrop-filter:blur(22px) saturate(170%) !important; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); }
.stat-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.st-icon { width:42px; height:42px; border-radius:50%; background:var(--glass-tint); color:var(--accent-1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); display:flex; align-items:center; justify-content:center; }
.st-trend { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:4px 11px; border-radius:30px; color:#34d399; background:rgba(52,211,153,.14); }
.st-mid { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.st-mid .st-num { font-size:42px; font-weight:800; line-height:1.1; background:var(--grad-title); -webkit-background-clip:text; background-clip:text; color:transparent; }
.st-mid .st-label { font-size:14px; font-weight:700; color:var(--text-2); margin-top:2px; }
.st-ring { position:relative; width:92px; height:92px; flex:none; }
.st-ring svg { transform:rotate(-90deg); display:block; margin:0 auto; }
.st-ring .ring-bg { fill:none; stroke:var(--glass-hi-bot); stroke-width:9; }
.st-ring .ring-fg { fill:none; stroke:url(#ringGrad); stroke-width:9; stroke-linecap:round; stroke-dasharray:261; stroke-dashoffset:261; transition:stroke-dashoffset 1.4s cubic-bezier(.22,.61,.36,1); }
.st-ring .ring-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:var(--accent-1); }
/* 环形渐变跟随主题(CSS 变量驱动,不再用 JS 内联) */
#ringGrad stop:first-child { stop-color: var(--accent-1); }
#ringGrad stop:last-child { stop-color: var(--accent-2); }
.st-subs { display:flex; flex-direction:column; gap:9px; }
.st-sub-row { display:grid; grid-template-columns:52px 1fr 42px; align-items:center; gap:8px; }
.st-sub-row span { font-size:12px; color:var(--text-2); font-weight:600; }
.st-sub-row i { height:5px; border-radius:4px; background:rgba(120,126,160,.16); overflow:hidden; display:block; }
.st-sub-row i b { display:block; height:100%; width:0; border-radius:4px; background:var(--grad-btn); transition:width 1.2s cubic-bezier(.22,.61,.36,1); }
.st-col.in-view .st-sub-row i b { width:var(--w,100%); }
.st-sub-row em { font-style:normal; font-size:12px; font-weight:800; color:var(--accent-1); text-align:right; }

/* ---------- 三步 ---------- */
.stack-wrap { position:relative; max-width:960px; margin:0 auto; }
.stack { position:relative; min-height:320px; perspective:1300px; }
.stack-card { position:absolute; left:0; right:0; top:0; padding:30px 36px; display:flex; align-items:center; gap:28px; cursor:pointer; flex-wrap:wrap; border-radius:26px; background:var(--glass-strong); backdrop-filter:blur(18px) saturate(170%); -webkit-backdrop-filter:blur(18px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), var(--shadow); transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--off,0px)) scale(var(--sc,1)) rotate(var(--rot,0deg)); transition:transform .7s cubic-bezier(.34,1.56,.64,1),box-shadow .5s,background .5s,opacity .5s; }
.stack-card::after { content:''; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(135deg,var(--glass-tint),transparent 60%); opacity:0; transition:opacity .5s; z-index:-1; }
.stack-card:hover::after { opacity:1; }
.step-badge { flex:none; width:70px; height:70px; border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:var(--accent-1); background:var(--glass-tint); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); }
.stack-body { flex:1; min-width:230px; }
.stack-body h3 { font-size:23px; margin-bottom:6px; }
.stack-body p { color:var(--text-3); line-height:1.7; margin-bottom:14px; }
.m-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.m-chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:30px; color:var(--text-2); background:var(--glass-card); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); }
.m-progress { height:8px; border-radius:6px; margin-top:4px; background:rgba(120,126,160,.16); overflow:hidden; max-width:340px; }
.m-progress i { display:block; height:100%; border-radius:6px; background:var(--grad-btn); width:0; transition:width 1.2s cubic-bezier(.22,.61,.36,1); }
.stack-card.top .m-progress i { width:var(--w,100%); }
.stack-wrap .carousel-nav.prev { left:-60px; }
.stack-wrap .carousel-nav.next { right:-60px; }

/* ---------- 下载(玻璃图标) ---------- */
.download-grid { max-width:840px; margin:0 auto; }

        en.target.classList.add('in');
      } else {
        clearTimeout(en.target._rt);
        en.target._rt = setTimeout(function () { en.target.classList.remove('in'); }, 420);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -3% 0px' });
  $$('.reveal').forEach(function (el) { revealObs.observe(el); });

  /* ---------- 插件市场 API 接入(列表 /app/api/knmk?page=1;失败自动降级为内置示例) ---------- */
  var MARKET_BASE = '';
  var MARKET_URL = MARKET_BASE + '/mk/kn';
  var PLUGINS = [];
  var EXT_ICONS = [
    '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15c-1.6-2.1-2.2-4.6-1.7-7.1 2.6-.4 5.2.2 7.3 1.7-.4 2.6-1.1 4.8-2.6 6.2"/><path d="M9.3 12.8c-3.1 1.6-4.6 3.6-5.1 7.1 3.5-.5 5.6-2 7.2-5.1"/><circle cx="14.7" cy="9.3" r="1.2" fill="currentColor" stroke="none"/></svg>',
    '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>',
    '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>'
  ];
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* 插件名/标签多语言映射(API 返回中文,语言切换时实时翻译) */
  var PLUGIN_L10N = {
    '帧率统计器': { zh: '帧率统计器', tw: '幀率統計器', en: 'FPS Monitor', ja: 'FPSモニター', ko: 'FPS 모니터', es: 'Monitor de FPS' },
    'MDUI': { zh: 'MDUI', tw: 'MDUI', en: 'MDUI', ja: 'MDUI', ko: 'MDUI', es: 'MDUI' },
    '源码云空间': { zh: '源码云空间', tw: '源碼雲空間', en: 'Source Cloud', ja: 'ソースクラウド', ko: '소스 클라우드', es: 'Nube de Código' }
  };
  var TAG_L10N = {
    '官方': { zh: '官方', tw: '官方', en: 'Official', ja: '公式', ko: '공식', es: 'Oficial' },
    '数据存储': { zh: '数据存储', tw: '數據存儲', en: 'Data Storage', ja: 'データ保存', ko: '데이터 저장', es: 'Almacenamiento' }
  };
  function l10nName(name) {
    var m = PLUGIN_L10N[name];
    return (m && m[curLang]) ? m[curLang] : name;
  }
  function l10nTag(tag) {
    var m = TAG_L10N[tag];
    return (m && m[curLang]) ? m[curLang] : tag;
  }
  /* 统一 GET 请求:fetch 优先(有 AbortController 则 4s 超时;没有则直接请求),fetch 不可用回退 XMLHttpRequest */
  function apiGet(url) {
    return new Promise(function (resolve, reject) {
      try {
        if (window.fetch) {
          var opts = {}, ctrl = null, timer = null;
          if (window.AbortController) { ctrl = new AbortController(); opts.signal = ctrl.signal; }
          timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, 4000);
          window.fetch(url, opts).then(function (r) {
            clearTimeout(timer);
            if (!r.ok) { reject(new Error('HTTP ' + r.status)); return; }
            resolve(r);
          }, function (e) { clearTimeout(timer); reject(e); });
        } else if (window.XMLHttpRequest) {
          var xhr = new window.XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = 4000;
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve({ json: function () { return JSON.parse(xhr.responseText); }, text: function () { return xhr.responseText; } });
            } else { reject(new Error('HTTP ' + xhr.status)); }
          };
          xhr.onerror = function () { reject(new Error('network')); };
          xhr.ontimeout = function () { reject(new Error('timeout')); };
          xhr.send();
        } else { reject(new Error('no-request')); }
      } catch (e) { reject(e); }
    });
  }
  /* ---------- 占位提示 ---------- */
  function toast(msg) {
    document.querySelectorAll('[data-toast]').forEach(function (old) {
      old.style.opacity = '0';
      old.style.transform = 'translateX(-50%) translateY(8px)';
      setTimeout(function () { old.remove(); }, 240);
    });
    var t = document.createElement('div');
    t.setAttribute('data-toast', '1');
    t.className = 'toast';
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text-1);padding:11px 22px;border-radius:30px;font-size:14px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi-top);z-index:9999;opacity:0;transition:opacity .3s,transform .3s;';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(-8px)'; });
    setTimeout(function () {
      t.style.opacity = '0'; t.style.transform = 'translateX(-50%)';
      setTimeout(function () { t.remove(); }, 350);
    }, 2200);
  }
  /* ---------- 插件市场:加载 + 排序 + 搜索 + 分页 ---------- */
  var PER_PAGE = 12;
  var allPlugins = [];
  var filteredPlugins = [];
  var curPage = 1;
  var curQuery = '';
  var curSort = 'latest';
  var curFilter = 'all';

  function loadMarket() {
    /* 接口 search 参数不过滤,循环拉取全部页,本地过滤 */
    var page = 1;
    var totalPages = 1;
    function fetchPage() {
      return apiGet(MARKET_BASE + '/app/api/knmk?page=' + page)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.plugins && data.plugins.length) allPlugins = allPlugins.concat(data.plugins);
          if (data && data.total_pages > totalPages) totalPages = data.total_pages;
          if (page < totalPages) { page++; return fetchPage(); }
        });
    }
    fetchPage()
      .then(function () { buildFilterMenu(); renderMarket(); })
      .catch(function () { buildFilterMenu(); renderMarket(); /* 接口不可用时显示空态 */ });
  }

  /* 排序:仅使用 API 提供的字段(id=最新,rating=评分) */
  function sortPlugins(list) {
    var arr = list.slice();
    switch (curSort) {
      case 'top': /* 评分最高 */
        arr.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
        break;
      case 'all': /* 全部:保持接口顺序 */
        break;
      default: /* 最新:按 id 倒序 */
        arr.sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
    }
    return arr;
  }

  /* 筛选菜单:从已加载插件的标签动态生成 */
  function buildFilterMenu() {
    var menu = $('#mkFilterMenu');
    if (!menu) return;
    var tagSet = [];
    allPlugins.forEach(function (p) {
      (p.tags || []).forEach(function (t) {
        if (tagSet.indexOf(t) < 0) tagSet.push(t);
      });
    });
    var html = '<button class="mk-menu-item cur" data-filter="all" type="button"><span>' + (I18N.mk_all ? I18N.mk_all[curLang] : '全部') + '</span></button>';
    tagSet.forEach(function (t) {
      html += '<button class="mk-menu-item" data-filter="' + escHtml(t) + '" type="button"><span>' + escHtml(l10nTag(t)) + '</span></button>';
    });
    menu.innerHTML = html;
    /* 绑定筛选项 */
    $$('.mk-menu-item[data-filter]', menu).forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.getAttribute('data-filter');
        curFilter = f;
        $$('.mk-menu-item[data-filter]', menu).forEach(function (x) { x.classList.toggle('cur', x === b); });
        var lbl = $('#mkFilterLabel');
        if (lbl) lbl.textContent = b.textContent;
        closeMkMenus();
        renderMarket();
      });
    });
  }

  function applyMarketFilter() {
    var q = (curQuery || '').trim().toLowerCase();
    filteredPlugins = allPlugins.filter(function (p) {
      if (q) {
        var name = (p.name || '').toLowerCase();
        var author = (p.author || '').toLowerCase();
        var tags = (p.tags || []).join(' ').toLowerCase();
        if (name.indexOf(q) < 0 && author.indexOf(q) < 0 && tags.indexOf(q) < 0) return false;
      }
      if (curFilter !== 'all') {
        if ((p.tags || []).indexOf(curFilter) < 0) return false;
      }
      return true;
    });
    filteredPlugins = sortPlugins(filteredPlugins);
    curPage = 1;
  }

  function renderMarket() {
    var grid = $('#mkGrid');
    var empty = $('#mkEmpty');
    var pager = $('#mkPager');
    if (!grid) return;
    applyMarketFilter();
    var total = filteredPlugins.length;
    var totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (curPage > totalPages) curPage = totalPages;
    var start = (curPage - 1) * PER_PAGE;
    var pageItems = filteredPlugins.slice(start, start + PER_PAGE);

    if (!total) {
      grid.innerHTML = '';
      if (empty) empty.style.display = 'flex';
      if (pager) pager.style.display = 'none';
      return;
    }
    if (empty) empty.style.display = 'none';

    var cards = pageItems.map(function (p, i) {
      var icon = EXT_ICONS[i % EXT_ICONS.length];
      var tags = (p.tags || []).slice(0, 3).map(function (t) { return '<span class="mk-tag">' + escHtml(l10nTag(t)) + '</span>'; }).join('');
      var rating = (p.rating != null ? Number(p.rating).toFixed(1) : '5.0');
      var dlUrl = p.download_url ? (MARKET_BASE + p.download_url) : MARKET_URL;
      return '<div class="mk-card card" data-id="' + escHtml(p.id) + '">' +
        '<div class="mk-ico">' + icon + '</div>' +
        '<div class="mk-body">' +
        '<h3>' + escHtml(l10nName(p.name)) + '</h3>' +
        '<p class="mk-author">by @' + escHtml(p.author) + '</p>' +
        '<div class="mk-tags">' + tags + '</div>' +
        '<div class="mk-foot">' +
        '<span class="mk-rate">★ ' + rating + '</span>' +
        '<span class="mk-actions">' +
        '<a class="mk-dl" href="' + dlUrl + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg><span>' + (I18N.mk_dl ? I18N.mk_dl[curLang] : '下载') + '</span></a>' +
        '<button class="mk-view" data-id="' + escHtml(p.id) + '"><span>' + (I18N.ext_view ? I18N.ext_view[curLang] : '查看') + '</span></button>' +
        '</span></div>' +
        '</div></div>';
    }).join('');
    grid.classList.remove('mk-render');
    void grid.offsetWidth;
    grid.innerHTML = cards;
    var mkCards = grid.querySelectorAll('.mk-card');
    for (var mi = 0; mi < mkCards.length; mi++) { mkCards[mi].style.animationDelay = (mi * 0.05) + 's'; }
    grid.classList.add('mk-render');

    if (pager) {
      pager.style.display = totalPages > 1 ? 'flex' : 'none';
      var info = $('#mkInfo');
      if (info) info.textContent = curPage + ' / ' + totalPages;
      var prev = $('#mkPrev'), next = $('#mkNext');
      if (prev) prev.disabled = curPage <= 1;
      if (next) next.disabled = curPage >= totalPages;
    }

    /* 卡片点击 → 详情页;查看按钮 → 详情页;下载是 <a> 直接跳 */
    $$('.mk-card').forEach(function (c) {
      c.addEventListener('click', function () {
        var id = c.getAttribute('data-id');
        if (id != null) window.open(MARKET_BASE + '/mk/kn/plugin/' + encodeURIComponent(id), '_blank', 'noopener');
        else window.open(MARKET_URL, '_blank', 'noopener');
      });
    });
    $$('.mk-view').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-id');
        if (id != null) window.open(MARKET_BASE + '/mk/kn/plugin/' + encodeURIComponent(id), '_blank', 'noopener');
        else window.open(MARKET_URL, '_blank', 'noopener');
      });
    });
    /* 重新绑定 tilt(动态卡片) */
    $$('.mk-card').forEach(function (c) { bindTilt(c, 8); });
  }

  var mkInput = $('#mkInput');
  if (mkInput) {
    var mkDebounce = null;
    mkInput.addEventListener('input', function () {
      clearTimeout(mkDebounce);
      var v = this.value;
      mkDebounce = setTimeout(function () { curQuery = v; renderMarket(); }, 200);
    });
  }
  var mkPrev = $('#mkPrev'), mkNext = $('#mkNext');
  if (mkPrev) mkPrev.addEventListener('click', function () { if (curPage > 1) { curPage--; renderMarket(); } });
  if (mkNext) mkNext.addEventListener('click', function () { var tp = Math.max(1, Math.ceil(filteredPlugins.length / PER_PAGE)); if (curPage < tp) { curPage++; renderMarket(); } });
  /* 排序/筛选 二级菜单交互 */
  var mkSortBtn = $('#mkSortBtn'), mkSortMenu = $('#mkSortMenu');
  var mkFilterBtn = $('#mkFilterBtn'), mkFilterMenu = $('#mkFilterMenu');
  function closeMkMenus() {
    [mkSortMenu, mkFilterMenu].forEach(function (m) { if (m) m.classList.remove('show'); });
    if (mkSortBtn) mkSortBtn.setAttribute('aria-expanded', 'false');
    if (mkFilterBtn) mkFilterBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleMkMenu(btn, menu) {
    if (!btn || !menu) return;
    var willOpen = !menu.classList.contains('show');
    closeMkMenus();
    if (willOpen) {
      menu.classList.add('show');
      btn.setAttribute('aria-expanded', 'true');
    }
  }
  if (mkSortBtn) mkSortBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleMkMenu(mkSortBtn, mkSortMenu); });
  if (mkFilterBtn) mkFilterBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleMkMenu(mkFilterBtn, mkFilterMenu); });
  /* 排序菜单项 */
  $$('.mk-menu-item[data-sort]', mkSortMenu).forEach(function (b) {
    b.addEventListener('click', function () {
      var s = b.getAttribute('data-sort');
      curSort = s;
      $$('.mk-menu-item[data-sort]', mkSortMenu).forEach(function (x) { x.classList.toggle('cur', x === b); });
      var lbl = $('#mkSortLabel');
      if (lbl) lbl.textContent = b.textContent;
      closeMkMenus();
      renderMarket();
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.mk-pop-wrap')) closeMkMenus();
  });
  loadMarket();
  /* ---------- 启动 ---------- */
  /* 预加载全部主题资源,切换时即时显示 */
  try {
    [LOGO_DEFAULT, ASSETS.ocean.logo, ASSETS.amber.logo, ASSETS.ocean.term, ASSETS.amber.term].forEach(function (u) {
      var im = new Image();
      im.src = u;
    });
  } catch (e) {}
  applyTheme();
})();
</script>
</body>
