<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PaperMC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f8fbff;
        }
        /* 顶部导航栏 */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 15%;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            font-size: 17px;
        }
        .nav-links a {
            color: #222;
            text-decoration: none;
        }
        .nav-right {
            display: flex;
            gap: 22px;
        }
        .icon {
            width: 26px;
            height: 26px;
            opacity: 0.8;
        }
        /* 主体内容区 左右布局 */
        main {
            display: flex;
            align-items: center;
            padding: 40px 15%;
            gap: 60px;
        }
        .text-area {
            flex: 1;
        }
        h1 {
            font-size: 58px;
            line-height: 1.2;
        }
        .blue-text {
            color: #3688ff;
        }
        .desc {
            font-size: 20px;
            line-height: 1.6;
            color: #333;
            margin: 30px 0;
            max-width: 520px;
        }
        .btns {
            display: flex;
            gap: 16px;
        }
        .btn-blue {
            background: #3688ff;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 18px;
        }
        .btn-white {
            background: white;
            color: #222;
            border: 1px solid #ccc;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 18px;
        }
        /* 右侧终端窗口 */
        .terminal-box {
            flex: 1;
            background: #222831;
            border-radius: 10px;
            padding: 12px;
            color: #eee;
            font-family: Consolas,monospace;
            font-size: 14px;
            line-height: 1.45;
        }
        .terminal-head {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .dot-red,.dot-yellow,.dot-green{
            width:12px;height:12px;border-radius:50%;
        }
        .dot-red{background:#ff4545;}
        .dot-yellow{background:#ffcc33;}
        .dot-green{background:#39cc60;}
    </style>
</head>
<body>
<header>
    <div class="nav-left">
        <div class="logo">
            <span>PAPERMC</span>
        </div>
        <div class="nav-links">
            <a href="#">主页</a>
            <a href="#" onclick="window.open('/mk/kn')">插件市场</a>
            <a href="#">开发文档</a>
            <a href="#">更新记录</a>
            <a href="#">关于团队</a>
            
        </div>
    </div>
    
</header>

<main>
    <div class="text-area">
        <h1>
            Modern software.<br>
            <span class="blue-text">Built to perform.</span>
        </h1>
        <p class="desc">
            PaperMC improves Minecraft's ecosystem with fast, secure software and an expanding plugin API, providing quick releases and helpful support as the most widely used, performant, and stable software available.
        </p>
        <div class="btns">
            <button class="btn-blue">Downloads</button>
            <button class="btn-white">Documentation</button>
        </div>
    </div>
    <div class="terminal-box">
        <div class="terminal-head">
            <div class="dot-red"></div>
            <div class="dot-yellow"></div>
            <div class="dot-green"></div>
        </div>
        <img src="https://code.pgrm.run/localcdn/app2.png" alt="" class="terminal-image" style="width: 100%; height: auto;">


    </div>
</main>
</body>
</html>
