<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css">
    <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <meta charset="UTF-8">
    <title>PaperMC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f8fbff;
            overflow-x: hidden;
        }
        /* 顶部导航栏 */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 15%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(248, 251, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(54, 136, 255, 0.1);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            font-size: 17px;
        }
        .nav-links a {
            color: #222;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-right {
            display: flex;
            gap: 22px;
        }
        .icon {
            width: 26px;
            height: 26px;
            opacity: 0.8;
        }
        /* 主体内容区 左右布局 */
        main {
            display: flex;
            align-items: center;
            padding: 120px 15% 60px;
            gap: 60px;
            min-height: 100vh;
        }
        .text-area {
            flex: 1;
        }
        h1 {
            font-size: 58px;
            line-height: 1.2;
        }
        .blue-text {
            color: #3688ff;
        }
        .desc {
            font-size: 20px;
            line-height: 1.6;
            color: #333;
            margin: 30px 0;
            max-width: 520px;
        }
        .btns {
            display: flex;
            gap: 16px;
        }
        .btn-blue {
            background: #3688ff;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-white {
            background: white;
            color: #222;
            border: 1px solid #ccc;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        /* 右侧终端窗口 */
        .terminal-box {
            flex: 1;
            background: #222831;
            border-radius: 10px;
            padding: 12px;
            color: #eee;
            font-family: Consolas,monospace;
            font-size: 14px;
            line-height: 1.45;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .terminal-head {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .dot-red,.dot-yellow,.dot-green{
            width:12px;height:12px;border-radius:50%;
        }
        .dot-red{background:#ff4545;}
        .dot-yellow{background:#ffcc33;}
        .dot-green{background:#39cc60;}
        .terminal-image {
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        /* 滚动动画基础样式 */
        .animate-on-scroll {
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .animate-on-scroll.from-left {
            transform: translateX(-80px);
        }
        .animate-on-scroll.from-right {
            transform: translateX(80px);
        }
        .animate-on-scroll.from-bottom {
            transform: translateY(60px);
        }
        .animate-on-scroll.from-top {
            transform: translateY(-60px);
        }
        .animate-on-scroll.scale-in {
            transform: scale(0.8);
        }
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translate(0) scale(1);
        }

        /* 特性区域 */
        .features-section {
            padding: 100px 15%;
            background: linear-gradient(180deg, #f8fbff 0%, #e8f2ff 100%);
        }
        .section-title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 60px;
            color: #1a1a1a;
        }
        .section-title span {
            color: #3688ff;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .feature-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(54, 136, 255, 0.1);
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3688ff 0%, #5aa0ff 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .feature-card h3 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        .feature-card p {
            color: #666;
            line-height: 1.7;
            font-size: 15px;
        }

        /* 展示区域 */
        .showcase-section {
            padding: 100px 15%;
            background: white;
        }
        .showcase-row {
            display: flex;
            align-items: center;
            gap: 60px;
            margin-bottom: 80px;
        }
        .showcase-row:last-child {
            margin-bottom: 0;
        }
        .showcase-row.reverse {
            flex-direction: row-reverse;
        }
        .showcase-text {
            flex: 1;
        }
        .showcase-text h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .showcase-text p {
            font-size: 17px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 24px;
        }
        .showcase-image {
            flex: 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }
        .showcase-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s;
        }
        

        /* 数据统计区域 */
        .stats-section {
            padding: 80px 15%;
            background: linear-gradient(135deg, #3688ff 0%, #1a5fd6 100%);
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }
        .stat-item h3 {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .stat-item p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 下载区域 */
        .download-section {
            padding: 100px 15%;
            text-align: center;
            background: linear-gradient(180deg, #e8f2ff 0%, #f8fbff 100%);
        }
        .download-section h2 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .download-section p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .download-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .download-card {
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s;
            cursor: pointer;
            min-width: 200px;
        }
        
        .download-card .platform {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .download-card .version {
            color: #999;
            font-size: 14px;
        }

        /* 页脚 */
        footer {
            padding: 40px 15%;
            text-align: center;
            background: #1a1a1a;
            color: #999;
        }
        footer a {
            color: #3688ff;
            text-decoration: none;
        }
        

        /* 延迟动画类 */
        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; }
        .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; }
        .delay-6 { transition-delay: 0.6s; }
    </style>
</head>
<body>
<header>
    <div class="nav-left">
        <div class="logo">
            <span>KNExpanse</span>
        </div>
        <div class="nav-links">
            <a href="/app/kn/d">主页</a>
            <a href="#" onclick="window.open('/mk/kn')">插件市场</a>
            <a href="#">开发文档</a>
            <a href="#" onclick="window.open('https://github.com/danjvan114/knu/releases')">更新记录</a>
            <a href="#" onclick="window.open('/kn/about')">关于团队</a>
            
        </div>
    </div>
    
</header>



<script>
// 滚动动画
const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
};

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        }
    });
}, observerOptions);

document.querySelectorAll('.animate-on-scroll').forEach(el => {
    observer.observe(el);
});

// 页面加载时立即显示首屏元素
window.addEventListener('load', () => {
    document.querySelectorAll('main .animate-on-scroll').forEach(el => {
        el.classList.add('visible');
    });
});
</script>
</body>
</html>
