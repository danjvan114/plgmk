<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理</title>
<link rel="icon" type="image/png" href="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png">
<style>
/* ========== 双主题变量(白=aurora紫 / 黑=dark) ========== */
:root, body.theme-light {
  --bg-base:#eef1f8;
  --accent-1:#6b72f5; --accent-2:#9b7cf7; --accent-3:#60a5fa;
  --accent-glow:rgba(107,114,245,.28);
  --grad-btn:linear-gradient(135deg,#6b72f5,#8a6df0);
  --grad-title:linear-gradient(115deg,#5b63e8,#8a6df0 55%,#4f8ee0);
  --glass-nav:rgba(255,255,255,.6);
  --glass-card:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.8);
  --glass-tint:rgba(107,114,245,.10);
  --glass-tint-2:rgba(107,114,245,.20);
  --hi-top:rgba(255,255,255,.7);
  --hi-bot:rgba(0,0,0,.06);
  --shadow:0 8px 30px rgba(42,54,94,.10);
  --shadow-hover:0 26px 64px rgba(42,54,94,.20);
  --text-1:#1d2238; --text-2:#4a5270; --text-3:#7c83a2;
  --border:rgba(0,0,0,.07);
  --danger:#ef4444; --success:#22c55e; --warn:#f59e0b;
}
body.theme-dark {
  --bg-base:#0a0d1a;
  --accent-1:#818cf8; --accent-2:#a78bfa; --accent-3:#22d3ee;
  --accent-glow:rgba(129,140,248,.42);
  --grad-btn:linear-gradient(135deg,#6d7cf6,#9370f2);
  --grad-title:linear-gradient(115deg,#93a2ff,#a78bfa 55%,#4ed3ee);
  --glass-nav:rgba(20,26,50,.75);
  --glass-card:rgba(255,255,255,.07);
  --glass-strong:rgba(30,38,70,.9);
  --glass-tint:rgba(129,140,248,.14);
  --glass-tint-2:rgba(129,140,248,.26);
  --hi-top:rgba(255,255,255,.16);
  --hi-bot:rgba(0,0,0,.28);
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --shadow-hover:0 26px 64px rgba(0,0,0,.6);
  --text-1:#e8eaf4; --text-2:#a9aec5; --text-3:#8b92ad;
  --border:rgba(255,255,255,.09);
  --danger:#f87171; --success:#4ade80; --warn:#fbbf24;
}
/* ========== 基础 ========== */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif; background:var(--bg-base); color:var(--text-1); min-height:100vh; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .6s ease,color .6s ease; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
body.lite-mode * { animation:none !important; transition:none !important; }
body.lite-mode * { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
body.lite-mode .topnav { background:var(--glass-strong) !important; box-shadow:inset 0 1px 0 var(--hi-top), var(--shadow); }
body.lite-mode .glass, body.lite-mode .card { background:var(--glass-strong); backdrop-filter:none; -webkit-backdrop-filter:none; }
/* ========== 顶栏 ========== */
.topnav { position:fixed; top:14px; left:50%; transform:translateX(-50%); width:min(94%,1100px); height:58px; display:flex; align-items:center; gap:12px; padding:0 16px; border-radius:40px; background:var(--glass-nav); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); box-shadow:inset 0 1px 0 var(--hi-top), inset 0 -1px 0 var(--hi-bot), var(--shadow); z-index:1000; }
.logo { display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; white-space:nowrap; }
.logo img { height:30px; width:auto; border-radius:8px; }
.head-space { flex:1; }
.nav-links { display:flex; gap:4px; overflow:visible; flex-wrap:nowrap; }
.nav-links a { padding:7px 14px; border-radius:20px; color:var(--text-2); font-size:14px; font-weight:600; white-space:nowrap; transition:color .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.nav-links a:hover { color:var(--accent-1); background:var(--glass-tint); transform:translateY(-1px); }
.nav-links a.active { color:var(--accent-1); background:var(--glass-tint-2); }
.icon-btn { width:38px; height:38px; flex:none; border-radius:50%; border:none; background:var(--glass-tint); color:var(--text-2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.icon-btn:hover { color:var(--accent-1); background:var(--glass-tint-2); transform:scale(1.08); }
.icon-btn.active { color:var(--accent-1); background:var(--glass-tint-2); }
/* ========== 内容区 ========== */
.main-box { max-width:1200px; margin:0 auto; padding:110px 20px 60px; }
/* ========== 卡片 ========== */
.card { background:var(--glass-card); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-radius:20px; box-shadow:inset 0 1px 0 var(--hi-top), inset 0 -1px 0 var(--hi-bot), var(--shadow); padding:28px; border:1px solid var(--border); animation:cardUp .55s cubic-bezier(.34,1.56,.64,1) backwards; }
@keyframes cardUp { from { opacity:0; transform:translateY(24px) scale(.97); } to { opacity:1; } }
/* ========== 表单 ========== */
.form-group { margin-bottom:18px; }
.form-group label { display:block; color:var(--text-2); margin-bottom:7px; font-weight:600; font-size:14px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:11px 15px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:inherit; outline:none; background:var(--glass-tint); color:var(--text-1); transition:border-color .25s,box-shadow .25s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent-1); box-shadow:0 0 0 3px var(--accent-glow); }
.form-group textarea { resize:vertical; min-height:90px; }
.form-hint { color:var(--text-3); font-size:12.5px; margin-top:6px; }
/* ========== 按钮 ========== */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 22px; border:none; border-radius:22px; cursor:pointer; font-size:14px; font-weight:700; font-family:inherit; color:var(--accent-1); background:var(--glass-tint); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--hi-top), inset 0 -2px 0 var(--hi-bot), 0 10px 24px var(--accent-glow); text-decoration:none; transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s,background .3s,color .3s; }
.btn:hover { background:var(--glass-tint-2); transform:translateY(-2px) scale(1.03); box-shadow:inset 0 2px 0 var(--hi-top), inset 0 -2px 0 var(--hi-bot), 0 16px 34px var(--accent-glow); }
.btn:active { transform:scale(.96); }
.btn.ghost { background:transparent; color:var(--text-2); box-shadow:none; }
.btn.ghost:hover { color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 2px 0 var(--hi-top), inset 0 -2px 0 var(--hi-bot); }
.btn.danger { color:#f87171; background:rgba(239,68,68,.10); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.1), 0 10px 24px rgba(239,68,68,.14); }
.btn.danger:hover { background:rgba(239,68,68,.18); }
.btn.success { color:#4ade80; background:rgba(34,197,94,.10); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.1), 0 10px 24px rgba(34,197,94,.14); }
.btn.success:hover { background:rgba(34,197,94,.18); }
.btn.warn { color:#fbbf24; background:rgba(245,158,11,.12); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.1), 0 10px 24px rgba(245,158,11,.16); }
.btn.warn:hover { background:rgba(245,158,11,.2); }
body.lite-mode .btn { background:var(--grad-btn); color:#fff; box-shadow:0 8px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35); }
body.lite-mode .btn:hover { filter:brightness(1.08); }
body.lite-mode .btn.ghost { background:var(--glass-tint); color:var(--text-2); box-shadow:inset 0 1px 0 var(--hi-top); }
body.lite-mode .btn.danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
body.lite-mode .btn.success { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
body.lite-mode .btn.warn { background:linear-gradient(135deg,#f59e0b,#ea580c); color:#fff; }
.btn.block { display:flex; width:100%; }
.btn.sm { padding:6px 14px; font-size:13px; border-radius:16px; }
.btn-lg { padding:13px 28px; font-size:16px; }
/* ========== 标题/文本 ========== */
.page-title { font-size:26px; font-weight:900; margin-bottom:6px; }
.page-sub { color:var(--text-3); font-size:14px; margin-bottom:24px; }
.divider { height:1px; background:var(--border); margin:22px 0; position:relative; }
.divider::after { content:'或'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--glass-strong); padding:0 12px; color:var(--text-3); font-size:13px; border-radius:10px; }
.tip { text-align:center; color:var(--text-3); font-size:13px; margin-top:18px; }
/* ========== 弹窗 ========== */
.modal { display:none; position:fixed; inset:0; background:rgba(10,14,26,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); justify-content:center; align-items:center; z-index:2000; }
.modal.active { display:flex; }
.modal-box { background:var(--glass-strong); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); padding:28px; border-radius:20px; width:400px; max-width:90vw; text-align:center; box-shadow:inset 0 1px 0 var(--hi-top), var(--shadow-hover); animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes popIn { from { opacity:0; transform:scale(.8); } to { opacity:1; transform:none; } }
.modal-box h3 { margin-bottom:16px; }
.modal-box .m-icon { font-size:44px; margin-bottom:12px; }
.modal-box p { margin-bottom:20px; }
.modal-box .form-group { text-align:left; }
/* ========== 表格 ========== */
.table-wrap { overflow-x:auto; }
.table { width:100%; border-collapse:collapse; }
.table th, .table td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; white-space:nowrap; }
.table th { color:var(--text-3); font-weight:700; font-size:13px; background:var(--glass-tint); }
.table tr:hover td { background:var(--glass-tint); }
/* ========== 统计卡 ========== */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; margin-bottom:24px; }
.stat-card { background:var(--grad-btn); color:#fff; padding:24px; border-radius:18px; text-align:center; box-shadow:0 12px 30px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35); animation:cardUp .55s cubic-bezier(.34,1.56,.64,1) backwards; }
.stat-card .stat-value { font-size:32px; font-weight:900; }
.stat-card .stat-label { font-size:14px; opacity:.92; margin-top:4px; }
/* ========== 搜索 ========== */
.search { height:38px; width:240px; display:flex; align-items:center; background:var(--glass-tint); border-radius:20px; padding:0 14px; }
.search input { background:transparent; border:none; outline:none; color:var(--text-1); width:100%; font-size:13.5px; }
.search input::placeholder { color:var(--text-3); }
/* ========== 下拉 ========== */
.dropdown { position:relative; display:inline-block; }
.dropdown-content { display:none; position:absolute; top:calc(100% + 8px); right:0; background:var(--glass-strong); backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%); min-width:170px; border-radius:16px; box-shadow:inset 0 1px 0 var(--hi-top), var(--shadow-hover); padding:8px; z-index:1500; animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both; }
.dropdown-content.show { display:block; }
.dropdown-content a { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:11px; color:var(--text-2); font-size:13.5px; font-weight:600; transition:color .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.dropdown-content a:hover { color:var(--accent-1); background:var(--glass-tint); transform:translateX(3px); }
.user-avatar { width:38px; height:38px; border-radius:50%; background:var(--grad-btn); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 6px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
.user-avatar:hover { transform:scale(1.08); }
.user-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
/* ========== 标签 ========== */
.tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tag { display:inline-block; padding:3px 11px; border-radius:14px; font-size:12px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); }
/* ========== 响应式 ========== */
@media (max-width:768px) {
  .main-box { padding:100px 14px 50px; }
  .nav-links { display:none; }
  .search { width:150px; }
  .stats-grid { grid-template-columns:1fr 1fr; }
}

.role-admin { color:var(--danger); }
.role-developer { color:var(--warn); }
.role-user { color:var(--accent-1); }

/* ===== 悬浮卡片(tilt 鼠标跟随) ===== */
.card, .stat-card, .stat-item { transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)); transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s,background .3s; will-change:transform; }
.card:hover, .stat-card:hover, .stat-item:hover { --ty:-5px; box-shadow:inset 0 1px 0 var(--hi-top), var(--shadow-hover); }
body.lite-mode .card:hover, body.lite-mode .stat-card:hover { --ty:0px; }

/* ===== 统计卡:液态玻璃(节能才实心) ===== */
.stat-card { background:var(--glass-tint); color:var(--text-1); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 1px 0 var(--hi-top), inset 0 -1px 0 var(--hi-bot), var(--shadow); }
.stat-card .stat-value { color:var(--accent-1); }
.stat-card .stat-label { color:var(--text-3); }
body.lite-mode .stat-card { background:var(--grad-btn); color:#fff; box-shadow:0 12px 30px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35); }
body.lite-mode .stat-card .stat-value, body.lite-mode .stat-card .stat-label { color:#fff; }

/* ===== 选择文件按钮 UI 适配(玻璃) ===== */
input[type="file"] { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:12px; background:var(--glass-tint); color:var(--text-2); font-size:13.5px; font-family:inherit; cursor:pointer; box-shadow:inset 0 1px 0 var(--hi-top); transition:border-color .25s,box-shadow .25s,background .3s; }
input[type="file"]:hover { border-color:var(--accent-1); background:var(--glass-tint-2); }
input[type="file"]:focus { outline:none; box-shadow:0 0 0 3px var(--accent-glow); }
input[type="file"]::file-selector-button { border:none; padding:8px 16px; border-radius:14px; background:var(--glass-tint-2); color:var(--accent-1); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; margin-right:10px; transition:background .3s,transform .3s cubic-bezier(.34,1.56,.64,1); }
input[type="file"]::file-selector-button:hover { background:var(--glass-tint); transform:scale(1.05); }

/* ===== 语言切换弹窗(参照插件市场) ===== */
.lang-wrap { position:relative; display:flex; }
.lang-pop { position:fixed; top:0; right:0; min-width:132px; z-index:5000; padding:8px; border-radius:16px; background:var(--glass-strong); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--hi-top), inset 0 -1px 0 var(--hi-bot), var(--shadow); opacity:0; transform:translateY(8px) scale(.92); pointer-events:none; visibility:hidden; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1),visibility .3s; }
.lang-pop.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
.lang-item { display:block; width:100%; border:none; cursor:pointer; background:transparent; color:var(--text-2); font-size:13px; font-weight:700; font-family:inherit; text-align:left; padding:8px 12px; border-radius:10px; transition:background .25s,color .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.lang-item:hover { background:var(--glass-tint); color:var(--accent-1); transform:translateX(3px); }
.lang-item.cur { color:var(--accent-1); background:var(--glass-tint); }
.lang-item.cur::after { content:"\2713"; float:right; font-weight:800; }
/* ===== 移动端菜单 ===== */
.menu-btn { display:none !important; }
@media (max-width:768px) {
  .menu-btn { display:flex !important; }
  .topnav .nav-links { position:fixed; top:82px; left:3%; right:3%; display:none; flex-direction:column; gap:4px; padding:10px; border-radius:18px; background:var(--glass-strong); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); box-shadow:inset 0 1px 0 var(--hi-top), var(--shadow-hover); z-index:1500; max-height:60vh; overflow-y:auto; }
  .topnav .nav-links.open { display:flex; }
  .topnav .nav-links a { padding:12px 16px; border-radius:12px; font-size:14.5px; width:100%; }
}

/* 移动端:禁用卡牌悬浮/浮起(触摸设备无 hover,防止 sticky-hover 残留) */
@media (hover:none) {
  .card:hover, .stat-card:hover, .stat-item:hover, .mk-card:hover, .btn:hover,
  .guide:hover, .plugin-box:hover, .plugin-item:hover, .detail-hero:hover, .stars:hover,
  .mdui-tab-item:hover, .nav-links a:hover, .fl-link:hover, .dl-m-btn:hover, .cr-tab:hover, .ext-install:hover {
    --ty:0 !important; transform:none !important;
  }
}

</style>

<body class="theme-light" data-page="admin-users">
<script src="theme.js"></script>
<header class="topnav"><a class="logo" href="/mk/kn"><img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY6vNqecDlOuUX-l2BERk5bPziylNSIAACwCAAAmsm0Fc-qj9K0pP0Lz0E.png" alt="Logo"><span data-i18n="mk_logo">插件市场</span></a><div class="nav-links"><a href="/mk/kn" data-i18n="mk_market">插件市场</a><a href="/mk/kn/admin" data-i18n="mk_admin">插件管理</a><a href="/op/user" class="active" data-i18n="mk_users">用户管理</a><a href="/logout" data-i18n="mk_logout">退出</a></div><div class="head-space"></div><button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.4-.4-.5-.8-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7Z"/></svg></button><button class="icon-btn" id="liteBtn" title="节能模式" aria-label="节能模式"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5c2.6 1.2 4.4 3.5 5.2 6.6l.6 2.4h-4.6l-1.4 8h-4.6l-1.4-8H3.7l.6-2.4c.8-3.1 2.6-5.4 5.2-6.6L12 2.2Z"/><path d="M9.2 9h5.6"/></svg></button><button class="icon-btn" id="langBtn" title="切换语言" aria-label="切换语言"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button><button class="icon-btn menu-btn" id="menuToggle" title="菜单" aria-label="菜单" style="display:none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></header>
<div class="main-box">

<div class="card">
<h1 class="page-title" style="margin-bottom:20px" data-i18n="mk_users">用户管理</h1>
<div class="table-wrap">
<table class="table">
<thead><tr><th data-i18n="username">用户名</th><th data-i18n="role">角色</th><th data-i18n="col_act">操作</th></tr></thead>
<tbody>
{% for username, info in users.items() %}
<tr>
<td>{{ username }}</td>
<td><span class="tag role-{{ info.role }}">{{ {'admin':'管理员','developer':'开发者','user':'普通用户'}[info.role] }}</span></td>
<td>
<button class="btn sm ghost" onclick="showEditModal('{{ username }}', '{{ info.role }}')"><span data-i18n="edit">编辑</span></button>
<a href="/op/user/delete/{{ username }}" class="btn sm danger" onclick="return confirm('确定删除用户？')"><span data-i18n="delete">删除</span></a>
</td>
</tr>
{% endfor %}
</tbody>

/* ===== 悬浮卡片:鼠标跟随倾斜(tilt) ===== */
function bindTilt(el, maxDeg) {
  if (/Android|iPhone|iPad|iPod|Mobile|HarmonyOS|MQQBrowser/i.test(navigator.userAgent)) return;
  if (!el || el._tiltDone) return;
  el._tiltDone = true;
  var DEG = maxDeg || 8;
  el.addEventListener('mousemove', function (e) {
    if (document.body.classList.contains('lite-mode')) return;
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var px = (e.clientX - r.left) / r.width - 0.5;
    var py = (e.clientY - r.top) / r.height - 0.5;
    el.style.setProperty('--rx', (-py * DEG).toFixed(2) + 'deg');
    el.style.setProperty('--ry', (px * DEG).toFixed(2) + 'deg');
  });
  el.addEventListener('mouseleave', function () {
    el.style.setProperty('--rx', '0deg');
    el.style.setProperty('--ry', '0deg');
  });
}
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.card, .stat-card, .stat-item').forEach(function (el) { bindTilt(el, 8); });
});

</script>

 "開発者", "ko": "개발자", "es": "Desarrollador"}, "admin_role": {"zh": "管理员", "tw": "管理員", "en": "Admin", "ja": "管理者", "ko": "관리자", "es": "Administrador"}, "username_ph": {"zh": "请输入用户名", "tw": "請輸入用戶名", "en": "Enter username", "ja": "ユーザー名を入力", "ko": "사용자 이름 입력", "es": "Ingresa el usuario"}, "password_ph": {"zh": "请输入密码", "tw": "請輸入密碼", "en": "Enter password", "ja": "パスワードを入力", "ko": "비밀번호 입력", "es": "Ingresa la contraseña"}, "new_pass_ph": {"zh": "请输入新密码", "tw": "請輸入新密碼", "en": "Enter new password", "ja": "新しいパスワードを入力", "ko": "새 비밀번호 입력", "es": "Ingresa la nueva contraseña"}, "status_on": {"zh": "启用", "tw": "啟用", "en": "Active", "ja": "有効", "ko": "활성", "es": "Activo"}, "status_off": {"zh": "禁用", "tw": "禁用", "en": "Disabled", "ja": "無効", "ko": "비활성", "es": "Inactivo"}, "on_shelf": {"zh": "上架", "tw": "上架", "en": "Publish", "ja": "公開", "ko": "게시", "es": "Publicar"}, "off_shelf": {"zh": "下架", "tw": "下架", "en": "Unpublish", "ja": "非公開", "ko": "비공개", "es": "Retirar"}, "col_act": {"zh": "操作", "tw": "操作", "en": "Actions", "ja": "操作", "ko": "작업", "es": "Acciones"}, "add_user": {"zh": "添加用户", "tw": "添加用戶", "en": "Add User", "ja": "ユーザー追加", "ko": "사용자 추가", "es": "Añadir Usuario"}, "edit_user": {"zh": "编辑用户", "tw": "編輯用戶", "en": "Edit User", "ja": "ユーザー編集", "ko": "사용자 편집", "es": "Editar Usuario"}, "new_pass_hint": {"zh": "新密码（留空则不修改）", "tw": "新密碼（留空則不修改）", "en": "New Password (leave blank to keep)", "ja": "新パスワード（空欄で変更なし）", "ko": "새 비밀번호 (비우면 유지)", "es": "Nueva Contraseña (vacío = sin cambios)"}};
  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      var t = I18N[k];
      if (t && t[curLang]) el.textContent = t[curLang];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      var k = el.getAttribute('data-i18n-ph');
      var t = I18N[k];
      if (t && t[curLang]) el.setAttribute('placeholder', t[curLang]);
    });
    document.querySelectorAll('.lang-item').forEach(function (it) { it.classList.toggle('cur', it.dataset.lang === curLang); });
    document.documentElement.lang = curLang === 'zh' ? 'zh-CN' : (curLang === 'tw' ? 'zh-TW' : curLang);
    renderLangDynamic(curLang, I18N);
  }
  /* 动态状态文本(启用/禁用/上架/下架),按当前文本内容判断 */
  function renderLangDynamic(lang, I18N) {
    document.querySelectorAll('[data-i18n-status]').forEach(function (el) {
      var type = el.getAttribute('data-i18n-status') || 'active';
      var t = el.textContent.trim();
      var key;
      if (type === 'shelf') {
        key = (t.indexOf('上架') >= 0) ? 'on_shelf' : 'off_shelf';
      } else {
        key = (t.indexOf('启用') >= 0 || t.indexOf('啟用') >= 0) ? 'status_on' : 'status_off';
      }
      if (I18N[key] && I18N[key][lang]) el.textContent = I18N[key][lang];
    });
  }
  function posLangPop(btn) {
    var pop = document.getElementById('langPop');
    if (!pop || !btn) return;
    var r = btn.getBoundingClientRect();
    pop.style.top = (r.bottom + 10) + 'px';
    pop.style.right = Math.max(10, window.innerWidth - r.right) + 'px';
  }
  function showLang() {
    var pop = document.getElementById('langPop');
    if (!pop) return;
    posLangPop(document.getElementById('langBtn'));
    pop.classList.add('show');
  }
  function hideLang() {
    var pop = document.getElementById('langPop');
    if (pop) pop.classList.remove('show');
  }
  var langBtn = document.getElementById('langBtn');
  if (langBtn) {
    langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var pop = document.getElementById('langPop');
      if (pop && pop.classList.contains('show')) hideLang(); else showLang();
    });
  }
  document.addEventListener('click', function (e) {
    var pop = document.getElementById('langPop');
    if (pop && pop.classList.contains('show') && !e.target.closest('#langBtn') && !e.target.closest('#langPop')) hideLang();
    var nl = document.querySelector('.nav-links');
    if (nl && nl.classList.contains('open') && !e.target.closest('.topnav')) nl.classList.remove('open');
  });
  document.querySelectorAll('.lang-item').forEach(function (it) {
    it.addEventListener('click', function () {
      curLang = it.dataset.lang;
      try { localStorage.setItem('knexpanse-lang', curLang); } catch (e) {}
      applyLang();
      setTimeout(hideLang, 150);
    });
  });
  var menuToggle = document.getElementById('menuToggle');
  if (menuToggle) {
    menuToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var nl = document.querySelector('.nav-links');
      if (nl) nl.classList.toggle('open');
    });
  }
  applyLang();
})();
</script>
