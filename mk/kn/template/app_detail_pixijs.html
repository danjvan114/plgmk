/* ============================================================
   KN Expanse Landing — v8 PixiJS Edition
   背景特效(光斑/粒子/视差/鼠标光晕)由 PixiJS GPU 加速渲染

/* ---------- 主题变量 ---------- */
:root, body.theme-aurora {
  --bg-base:#eef1f8;
  --orb-a:rgba(107,114,245,.10);
  --orb-b:rgba(155,124,247,.08);
  --orb-c:rgba(96,165,250,.06);
  --accent-1:#6b72f5; --accent-2:#9b7cf7; --accent-3:#60a5fa;
  --accent-glow:rgba(107,114,245,.30);
  --grad-btn:linear-gradient(135deg,#6b72f5,#8a6df0);
  --grad-title:linear-gradient(115deg,#5b63e8,#8a6df0 55%,#4f8ee0);
  --grad-eng-a:rgba(139,148,247,.95);
  --grad-eng-b:rgba(181,164,249,.95);
  --glass-nav:rgba(255,255,255,.18);
  --glass-card:rgba(255,255,255,.09);
  --solid-glass:#ffffff;
  --glass-strong:rgba(255,255,255,.18);
  --glass-tint:rgba(107,114,245,.10);
  --glass-tint-2:rgba(107,114,245,.20);
  --glass-hi-top:rgba(255,255,255,.55);
  --glass-hi-bot:rgba(0,0,0,.07);
  --shadow:0 8px 30px rgba(42,54,94,.08);
  --shadow-hover:0 26px 64px rgba(42,54,94,.20);
  --text-1:#1d2238; --text-2:#4a5270; --text-3:#7c83a2;
  --particle-color:#6b72f5;
}
body.theme-ocean {
  --bg-base:#0c2230;
  --orb-a:rgba(13,148,136,.16); --orb-b:rgba(20,184,166,.12); --orb-c:rgba(59,130,246,.10);
  --accent-1:#2dd4bf; --accent-2:#22d3ee; --accent-3:#38bdf8;
  --accent-glow:rgba(45,212,191,.35);
  --grad-btn:linear-gradient(135deg,#0d9488,#0aa5a0);
  --grad-title:linear-gradient(115deg,#2dd4bf,#22d3ee 55%,#38bdf8);
  --grad-eng-a:rgba(94,234,212,.95);
  --grad-eng-b:rgba(103,232,249,.95);
  --glass-nav:rgba(255,255,255,.28);
  --glass-card:rgba(255,255,255,.20);
  --solid-glass:#f2faf8;
  --glass-strong:rgba(255,255,255,.28);
  --glass-tint:rgba(13,148,136,.14);
  --glass-tint-2:rgba(13,148,136,.26);
  --glass-hi-top:rgba(255,255,255,.4);
  --glass-hi-bot:rgba(0,0,0,.1);
  --shadow:0 6px 18px rgba(0,22,28,.22);
  --shadow-hover:0 16px 40px rgba(0,22,28,.38);
  --text-1:#0e242c; --text-2:#2c4a54; --text-3:#4d6b73;
  --particle-color:#34d399;
}
body.theme-amber {
  --bg-base:#2a1605;
  --orb-a:rgba(217,119,6,.16); --orb-b:rgba(245,158,11,.12); --orb-c:rgba(239,68,68,.10);
  --accent-1:#fbbf24; --accent-2:#fb923c; --accent-3:#f87171;
  --accent-glow:rgba(251,191,36,.35);
  --grad-btn:linear-gradient(135deg,#d97706,#e8960a);
  --grad-title:linear-gradient(115deg,#fbbf24,#fb923c 55%,#f87171);
  --grad-eng-a:rgba(253,186,116,.95);
  --grad-eng-b:rgba(253,224,71,.95);
  --glass-nav:rgba(255,255,255,.28);
  --glass-card:rgba(255,255,255,.20);
  --solid-glass:#fff6ea;
  --glass-strong:rgba(255,255,255,.28);
  --glass-tint:rgba(217,119,6,.14);
  --glass-tint-2:rgba(217,119,6,.26);
  --glass-hi-top:rgba(255,255,255,.4);
  --glass-hi-bot:rgba(0,0,0,.1);
  --shadow:0 6px 18px rgba(32,12,0,.22);
  --shadow-hover:0 16px 40px rgba(32,12,0,.38);
  --text-1:#241505; --text-2:#4a3118; --text-3:#6b4c2a;
  --particle-color:#b45309;
}
body.dark-mode {
  --bg-base:#0a0d1a;
  --orb-a:rgba(129,140,248,.09); --orb-b:rgba(167,139,250,.07); --orb-c:rgba(56,189,248,.05);
  --accent-1:#818cf8; --accent-2:#a78bfa; --accent-3:#22d3ee;
  --accent-glow:rgba(129,140,248,.42);
  --grad-btn:linear-gradient(135deg,#6d7cf6,#9370f2);
  --grad-title:linear-gradient(115deg,#93a2ff,#a78bfa 55%,#4ed3ee);
  --grad-eng-a:rgba(165,180,252,.95);
  --grad-eng-b:rgba(199,184,253,.95);
  --glass-nav:rgba(255,255,255,.16);
  --glass-card:rgba(255,255,255,.06);
  --solid-glass:#1a2038;
  --glass-strong:rgba(255,255,255,.12);
  --glass-tint:rgba(129,140,248,.14);
  --glass-tint-2:rgba(129,140,248,.26);
  --glass-hi-top:rgba(255,255,255,.16);
  --glass-hi-bot:rgba(0,0,0,.28);
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --shadow-hover:0 26px 64px rgba(0,0,0,.6);
  --text-1:#e8eaf4; --text-2:#a9aec5; --text-3:#8b92ad;
  --particle-color:#eef2ff;
}

/* ---------- 基础 ---------- */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body { overflow-x:hidden; touch-action:pan-y; }
body.intro-on main { opacity:0; transition:opacity 1s ease; }
body:not(.intro-on) main { opacity:1; transition:opacity 1s ease; }
body { font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg-base); color:var(--text-1); overflow-x:hidden; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .6s ease,color .6s ease; min-height:100vh; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent-1); outline-offset:2px; border-radius:6px; }

/* ---------- 主题背景图 ---------- */
.bg-photo { position:fixed; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .9s ease; pointer-events:none; }
body.theme-ocean .bg-photo-ocean { opacity:.95; }
body.theme-amber .bg-photo-amber { opacity:.95; }
body.dark-mode .bg-photo-dark { opacity:.9; }
body.theme-ocean .parallax, body.theme-amber .parallax { opacity:.45; }

/* ---------- PixiJS 画布(替换 bg-layer / particles / cursor-glow) ---------- */
#pixiBg { position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden; }
#pixiBg canvas { display:block; width:100%; height:100%; }

/* 节能模式:关掉 PixiJS 重特效 */
body.lite-mode #pixiBg { display:none !important; }
body.lite-mode .bg-orb, body.lite-mode #particles, body.lite-mode .cursor-glow { display:none !important; }
body.lite-mode .parallax { transform:none !important; }
body.lite-mode .bg-photo { filter:none !important; }

/* ---------- 背景光斑(隐藏,改由 PixiJS 渲染) ---------- */
.bg-layer { position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden; display:none; }
.parallax { position:absolute; inset:0; will-change:transform; }
.bg-orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:.7; animation:orbFloat 34s ease-in-out infinite; will-change:transform; }
.orb-1 { width:60vw; height:60vw; max-width:860px; max-height:860px; background:radial-gradient(circle,var(--orb-a),transparent 70%); top:-24%; left:-18%; }
.orb-2 { width:48vw; height:48vw; max-width:680px; max-height:680px; background:radial-gradient(circle,var(--orb-b),transparent 70%); top:42%; right:-22%; animation-delay:-12s; }
.orb-3 { width:42vw; height:42vw; max-width:580px; max-height:580px; background:radial-gradient(circle,var(--orb-c),transparent 70%); bottom:-20%; left:26%; animation-delay:-20s; }
body.theme-aurora .bg-layer::after { content:''; position:absolute; right:-6%; bottom:-10%; width:58vw; height:58vw; max-width:720px; max-height:720px; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(107,114,245,.26), rgba(155,124,247,.14) 46%, transparent 70%); filter:blur(22px); pointer-events:none; }
@keyframes orbFloat { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(50px,-55px) scale(1.1)} 50%{transform:translate(-40px,40px) scale(.92)} 75%{transform:translate(-48px,-30px) scale(1.05)} }
#particles { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; will-change:transform; display:none; }
#particles svg { position:absolute; top:-40px; color:var(--particle-color); opacity:.55; transition:opacity .3s,filter .3s; cursor:pointer; }
#particles svg.glow { opacity:1; filter:drop-shadow(0 0 10px var(--particle-color)); }
#particles svg.burst { animation:partBurst .5s cubic-bezier(.22,.61,.36,1) forwards !important; }
body.dark-mode #particles svg { opacity:.95; filter:drop-shadow(0 0 7px rgba(238,242,255,.85)); }
body.dark-mode #particles svg.glow { filter:drop-shadow(0 0 16px #eef2ff); }
@keyframes partBurst { to { transform:scale(3); opacity:0 !important; } }
@keyframes drift1 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(360deg);opacity:0} }
@keyframes drift2 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(-300deg);opacity:0} }
@keyframes drift3 { 0%{transform:translateY(-8vh) rotate(0);opacity:0} 15%{opacity:.7} 80%{opacity:.5} 100%{transform:translateY(108vh) rotate(420deg);opacity:0} }
@keyframes twinkle { 0%,100%{opacity:0;transform:scale(.2) rotate(0deg)} 50%{opacity:1;transform:scale(1.2) rotate(180deg)} }

.cursor-glow { position:fixed; pointer-events:none; z-index:9999; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(107,114,245,.05) 0%,transparent 65%); transform:translate(-50%,-50%); opacity:0; transition:opacity .4s; display:none; }
@media (hover:hover) { body:hover .cursor-glow { opacity:1; } }
@media (hover:none) { .cursor-glow { display:none !important; } }

/* 性能模式按钮:节能态高亮 */
#perfBtn.lite { color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 0 14px var(--accent-glow); }
/* 性能提示浮层(已废弃,改为自动切换) */
.perf-tip { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(16px); z-index:2600; display:none; align-items:center; gap:12px; padding:14px 18px; border-radius:18px; background:var(--glass-strong); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; pointer-events:none; transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1); }
.perf-tip.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
.perf-tip .pt-ico { width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--glass-tint); color:var(--accent-1); }
.perf-tip .pt-txt { font-size:13px; line-height:1.5; color:var(--text-1); max-width:300px; }
.perf-tip .pt-txt b { display:block; font-size:14px; }
.perf-tip .pt-btns { display:flex; gap:8px; flex:none; }
.perf-tip .pt-btn { border:none; cursor:pointer; padding:8px 14px; border-radius:30px; font-size:12.5px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s; }
.perf-tip .pt-btn:hover { transform:scale(1.08); background:var(--glass-tint-2); }
.perf-tip .pt-btn.ghost { color:var(--text-2); background:transparent; }
/* 悬浮窗 */
.theme-pop, .qq-pop, .perf-pop, .nav-more-pop { background:rgba(255,255,255,.46); }
body.dark-mode .theme-pop, body.dark-mode .qq-pop, body.dark-mode .perf-pop, body.dark-mode .nav-more-pop { background:rgba(18,22,40,.92); }
.perf-wrap { position:relative; display:flex; }
.perf-pop { position:fixed; top:0; right:0; z-index:1300; background:var(--glass-strong); backdrop-filter:blur(36px) saturate(200%); -webkit-backdrop-filter:blur(36px) saturate(200%); border-radius:14px; padding:9px 14px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(6px) scale(.94); pointer-events:none; transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1); z-index:50; white-space:nowrap; }
.perf-pop.show { opacity:1; transform:none; pointer-events:auto; }
.perf-pop span { font-size:12.5px; font-weight:700; color:var(--accent-1); }
.perf-pop span.off { color:var(--text-2); }
.perf-pop-desc { display:block; margin-top:5px; max-width:210px; font-size:11px; line-height:1.55; color:var(--text-3); white-space:normal; font-weight:500; }
.m-wrap { position:relative; display:flex; }
.lang-wrap { position:relative; display:flex; }
.lang-pop { position:fixed; top:0; right:0; min-width:132px; z-index:1300; padding:8px; border-radius:16px; background:rgba(255,255,255,.46); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(8px) scale(.92); pointer-events:none; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1); z-index:50; }
body.dark-mode .lang-pop { background:rgba(22,26,45,.86); }
.lang-pop.show { opacity:1; transform:none; pointer-events:auto; }
.lang-item { display:block; width:100%; border:none; cursor:pointer; background:transparent; color:var(--text-2); font-size:13px; font-weight:700; font-family:inherit; text-align:left; padding:8px 12px; border-radius:10px; transition:background .25s,color .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.lang-item:hover { background:var(--glass-tint); color:var(--accent-1); transform:translateX(3px); }
.lang-item.cur { color:var(--accent-1); background:var(--glass-tint); }
.lang-item.cur::after { content:"\2713"; float:right; font-weight:800; }
.lang-item.popped { animation:langPop .32s cubic-bezier(.34,1.56,.64,1); }
@keyframes langPop { 0% { transform:scale(1); } 45% { transform:scale(1.08); } 70% { transform:scale(.96); } 100% { transform:scale(1); } }
.look-pop, .qr-pop { position:fixed; top:0; right:0; z-index:1300; padding:10px; border-radius:20px; background:rgba(255,255,255,.46); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; transform:translateY(10px) scale(.95); pointer-events:none; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1); transform-origin:top right; }
.look-pop { min-width:214px; }
.look-pop.show, .qr-pop.show { opacity:1; transform:none; pointer-events:auto; }
body.dark-mode .look-pop, body.dark-mode .qr-pop { background:rgba(22,26,45,.86); }
.look-sep { height:1px; background:var(--glass-hi-bot); margin:6px 4px; }
.look-perf { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border:none; background:transparent; color:var(--text-2); font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; border-radius:14px; transition:background .25s,color .25s; }
.look-perf-main { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
.look-perf-main small { font-size:10.5px; font-weight:500; color:var(--text-3); }
.look-perf:hover { background:var(--glass-tint); color:var(--accent-1); }
.look-perf.on { color:var(--accent-1); }
.qr-pop { width:224px; padding:12px; }
.qr-tabs { display:flex; gap:6px; margin-bottom:10px; }
.qr-tab { flex:1; padding:7px 4px; border:none; border-radius:11px; background:var(--glass-tint); color:var(--text-2); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; transition:background .25s,color .25s,transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .25s; }
.qr-tab.active { background:var(--glass-tint-2); color:var(--accent-1); transform:translateY(-1px) scale(1.05); box-shadow:inset 0 1px 0 var(--glass-hi-top); }
.qr-tab:hover { transform:translateY(-1px) scale(1.05); }
.qr-tab:active { transform:scale(.92); }
.qr-imgs { position:relative; height:172px; margin-top:6px; transition:height .5s cubic-bezier(.34,1.56,.64,1); }
.qr-pane { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; transform:scale(.88); pointer-events:none; transition:opacity .35s ease,transform .55s cubic-bezier(.34,1.56,.64,1); transform-origin:50% 15%; }
.qr-pane.show { opacity:1; transform:scale(1); pointer-events:auto; }
.qr-pane img { width:100%; height:172px; object-fit:contain; border-radius:12px; background:rgba(255,255,255,.4); display:block; }
.qr-name { display:block; margin-top:6px; font-size:12px; font-weight:600; color:var(--text-2); text-align:center; }
body.lite-mode *, body.lite-mode *::before, body.lite-mode *::after { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
body.lite-mode *:not(.intro):not(.intro *), body.lite-mode *::before, body.lite-mode *::after { transition:none !important; animation:none !important; }
body.lite-mode header, body.lite-mode .card, body.lite-mode .term, body.lite-mode .btn, body.lite-mode .icon-btn,
body.lite-mode .badge-btn, body.lite-mode .ft-tab, body.lite-mode .stack-card, body.lite-mode .feat-panel,
body.lite-mode .ext-inner, body.lite-mode .stats-card, body.lite-mode .download-card, body.lite-mode .theme-pop,
body.lite-mode .qq-pop, body.lite-mode .perf-pop, body.lite-mode .lang-pop, body.lite-mode .perf-tip, body.lite-mode .carousel-nav,
body.lite-mode .chip, body.lite-mode .m-chip, body.lite-mode .toast, body.lite-mode .st-clock, body.lite-mode .nav-links a, body.lite-mode .look-pop, body.lite-mode .qr-pop, body.lite-mode .look-perf, body.lite-mode .qr-tab, body.lite-mode .cr-card, body.lite-mode .cr-card.cur, body.lite-mode .fl-link {
  background-color:var(--solid-glass) !important;
}
body.lite-mode .btn, body.lite-mode .card:not(#termBox), body.lite-mode .card:not(#termBox).reveal.in { transform:none !important; }
body.lite-mode .btn, body.lite-mode .icon-btn, body.lite-mode .ft-tab, body.lite-mode .tp-item, body.lite-mode .badge-btn, body.lite-mode .carousel-nav, body.lite-mode .ext-install, body.lite-mode .pt-btn { transition:background .3s,color .3s,box-shadow .3s; }
body.lite-mode .btn:hover, body.lite-mode .icon-btn:hover, body.lite-mode .ft-tab:hover, body.lite-mode .tp-item:hover, body.lite-mode .badge-btn:hover, body.lite-mode .ext-install:hover, body.lite-mode .pt-btn:hover,
body.lite-mode .nav-links a:hover, body.lite-mode #backTop:hover, body.lite-mode .card:not(#termBox):hover { transform:none !important; }
body.lite-mode .carousel-nav, body.lite-mode .carousel-nav:hover, body.lite-mode .carousel-nav:active { transform:translateY(-50%) !important; }
body.lite-mode .stack-card, body.lite-mode .feat-panel { transform:perspective(900px) rotateX(0) rotateY(0) translateY(var(--off,0px)) scale(var(--sc,1)) rotate(var(--rot,0deg)) !important; }
body.lite-mode .st-col { transform:perspective(900px) translateY(var(--st-off,0px)) scale(var(--st-sc,1)) !important; }

/* ---------- 下载移动端 ---------- */
.dl-mobile { margin-top:26px; text-align:center; }
.dl-m-title { font-size:14px; font-weight:800; letter-spacing:2px; color:var(--text-3); margin-bottom:12px; }
.dl-m-row { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
.dl-m-btn { display:inline-flex; align-items:center; gap:8px; padding:11px 24px; border-radius:30px; border:none; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text-2); background:var(--glass-tint); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); text-decoration:none; font-family:inherit; transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s; }
.dl-m-btn:hover { transform:translateY(-3px) scale(1.04); color:var(--accent-1); background:var(--glass-tint-2); }
.dl-m-btn.soon:hover { color:var(--text-2); background:var(--glass-tint); }
/* ---------- 友情链接 ---------- */
.fl-row { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
.fl-link { display:inline-flex; align-items:center; gap:9px; padding:11px 22px; border-radius:30px; background:var(--glass-tint); color:var(--text-2); font-weight:700; font-size:14px; text-decoration:none; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s; }
.fl-link:hover { transform:translateY(-3px) scale(1.05); color:var(--accent-1); background:var(--glass-tint-2); }
.fl-ico { display:flex; }
/* ---------- 制作团队(水平滑移堆叠) ---------- */
.cr-show { position:relative; max-width:640px; margin:0 auto; }
.cr-stage { position:relative; height:350px; }
.cr-card { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 34px; border-radius:28px; background:var(--glass-card); backdrop-filter:blur(18px) saturate(170%); -webkit-backdrop-filter:blur(18px) saturate(170%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:.4; transform:perspective(1000px) translateX(var(--cr-x,0px)) rotate(var(--cr-r,0deg)) scale(var(--cr-s,1)); transform-origin:50% 100%; pointer-events:none; transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .5s,filter .5s; will-change:transform; }
.cr-card.cur { opacity:1; z-index:10; pointer-events:auto; background:rgba(255,255,255,.30); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); }
body.dark-mode .cr-card.cur { background:rgba(255,255,255,.10); }
.cr-ava { width:86px; height:86px; border-radius:50%; object-fit:cover; margin-bottom:14px; box-shadow:0 10px 26px var(--accent-glow); }
.cr-card h3 { font-size:21px; margin-bottom:2px; }
.cr-role { font-size:13px; font-weight:800; color:var(--accent-1); margin-bottom:12px; letter-spacing:.5px; }
.cr-card p { font-size:14px; line-height:1.75; color:var(--text-3); max-width:520px; }
.cr-tabs { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:26px; }
.cr-tab { padding:8px 18px; border-radius:24px; border:none; cursor:pointer; background:var(--glass-tint); color:var(--text-2); font-size:13px; font-weight:700; font-family:inherit; transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s; }
.cr-tab:hover { transform:translateY(-2px) scale(1.05); }
.cr-tab.active { background:var(--glass-tint-2); color:var(--accent-1); box-shadow:inset 0 1px 0 var(--glass-hi-top); }
#crShow .carousel-nav { z-index:50; }
@media (max-width:720px) {
  .cr-stage { height:400px; }
  .cr-card { padding:24px 18px; }
  .cr-ava { width:70px; height:70px; }
  .fl-row { gap:10px; }
  .fl-link { padding:9px 16px; font-size:13px; }
}
/* 安卓扫码弹层 */
.qr-modal { position:fixed; inset:0; z-index:4000; background:rgba(10,14,26,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s ease; }
.qr-modal.show { opacity:1; pointer-events:auto; }
.qr-modal-box { background:var(--glass-strong); border-radius:24px; padding:30px 34px; text-align:center; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); transform:scale(.9); transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
.qr-modal.show .qr-modal-box { transform:scale(1); }
.qr-modal-box img { width:190px; height:190px; object-fit:contain; border-radius:16px; background:rgba(255,255,255,.6); display:block; margin:0 auto 14px; }
.qr-modal-box p { font-size:13.5px; color:var(--text-2); margin-bottom:16px; }
.qr-modal-close { padding:8px 26px; border-radius:24px; border:none; cursor:pointer; background:var(--glass-tint); color:var(--text-1); font-weight:700; font-size:13px; font-family:inherit; transition:background .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.qr-modal-close:hover { background:var(--glass-tint-2); transform:translateY(-2px); }
/* footer 友链 */
.fl-links { margin-top:14px; display:flex; justify-content:center; align-items:center; gap:10px; font-size:13px; flex-wrap:wrap; }
.fl-links a { color:var(--text-3); text-decoration:none; transition:color .25s,transform .35s cubic-bezier(.34,1.56,.64,1); display:inline-block; }
.fl-links a:hover { color:var(--accent-1); transform:translateY(-1px); }
.fl-sep { color:var(--text-3); opacity:.5; }
/* 主题切换层 */
.theme-fade { position:fixed; inset:0; z-index:2000; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(255,255,255,.5) 100%); transition:opacity .4s ease; }
.burst-layer { position:fixed; inset:0; z-index:2100; pointer-events:none; overflow:hidden; }
.burst-bit { position:absolute; width:12px; height:12px; border-radius:50%; background:var(--particle-color); box-shadow:0 0 14px var(--particle-color); opacity:1; }

/* ---------- 导航(单层描边) ---------- */
header { display:flex; align-items:center; justify-content:space-between; padding:8px 18px; position:fixed; top:14px; left:50%; transform:translateX(-50%); width:min(94%,1420px); z-index:1000; border-radius:60px; background:var(--glass-nav); backdrop-filter:blur(6px) saturate(160%); -webkit-backdrop-filter:blur(6px) saturate(160%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); height:60px; overflow:hidden; transition:height .5s cubic-bezier(.4,0,.2,1), background .5s, box-shadow .5s, border-radius .4s; }
header.pop-open { overflow:visible !important; }
header.scrolled { background:var(--glass-card); }
.nav-left { display:flex; align-items:center; gap:22px; min-width:0; }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-.2px; white-space:nowrap; flex:none; }
.logo-img { height:32px; width:auto; border-radius:8px; display:none; flex:none; }
.logo-mark { width:34px; height:34px; border-radius:11px; flex:none; background:var(--grad-btn); display:none; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.5); }
.logo-mark.show { display:flex; }
.nav-links { display:flex; gap:4px; font-size:14.5px; font-weight:600; }
.nav-links a { display:flex; align-items:center; gap:6px; padding:9px 15px; border-radius:30px; color:var(--text-2); cursor:pointer; white-space:nowrap; transition:color .25s,background .3s,box-shadow .3s,transform .5s cubic-bezier(.34,1.56,.64,1); }
.nav-links a svg { opacity:.75; transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
.nav-links a:hover { color:var(--accent-1); background:var(--glass-tint); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); transform:translateY(-2px) scale(1.05); }
.nav-links a:hover svg { transform:rotate(-8deg) scale(1.15); }
.nav-links a:active { transform:scale(.94); }
.nav-more { position:relative; }
.nav-more-btn { display:flex; align-items:center; gap:5px; padding:9px 15px; border-radius:30px; border:none; cursor:pointer; background:transparent; color:var(--text-2); font-size:14.5px; font-weight:600; font-family:inherit; white-space:nowrap; transition:color .25s,background .3s,transform .5s cubic-bezier(.34,1.56,.64,1); }
.nav-more-btn:hover { color:var(--accent-1); background:var(--glass-tint); transform:translateY(-2px) scale(1.05); }
.nav-more-btn svg { transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
.nav-more.open .nav-more-btn svg { transform:rotate(180deg); }
.nav-more-pop { position:absolute; top:calc(100% + 14px); right:0; min-width:220px; padding:8px; border-radius:18px; background:rgba(255,255,255,.72); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; transform:translateY(12px) scale(.94); pointer-events:none; transition:opacity .45s ease,transform .55s cubic-bezier(.34,1.56,.64,1); z-index:60; transform-origin:top right; display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.nav-more.open .nav-more-pop { opacity:1; transform:none; pointer-events:auto; }
.nav-more-title { display:none; }
.nav-more-pop a { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; color:var(--text-2); font-size:13.5px; font-weight:600; text-decoration:none; opacity:0; transform:translateX(8px); transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s; }
.nav-more.open .nav-more-pop a { opacity:1; transform:none; }
.nav-more.open .nav-more-pop a:nth-child(2) { transition-delay:.05s; }
.nav-more.open .nav-more-pop a:nth-child(3) { transition-delay:.1s; }
.nav-more.open .nav-more-pop a:nth-child(4) { transition-delay:.15s; }
.nav-more.open .nav-more-pop a:nth-child(5) { transition-delay:.2s; }
.nav-more-pop a:hover { background:var(--glass-tint); color:var(--accent-1); transform:translateY(-2px) scale(1.05); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); }
.nav-more-pop a:hover svg { transform:rotate(-8deg) scale(1.15); }
.nav-more-pop a svg { transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
.nav-more-pop .nav-dl-pop { display:none; }
.nav-links > .nav-dl { transition:opacity .4s ease,width .45s cubic-bezier(.34,1.56,.64,1),padding .45s,margin .45s; overflow:hidden; }
@media (max-width:1280px) {
  .nav-links > .nav-dl { opacity:0; width:0; padding:0; margin:0; pointer-events:none; }
  .nav-more-pop .nav-dl-pop { display:flex; }
}
@media (max-width:900px) {
  header.menu-open .nav-more { display:contents; }
  header.menu-open .nav-more-btn { display:none; }
  header.menu-open .nav-more-pop { position:static; opacity:1; transform:none; pointer-events:auto; display:contents; background:transparent; box-shadow:none; padding:0; min-width:0; width:auto; }
  header.menu-open .nav-more-title { display:none; }
  header.menu-open .nav-more-pop a { opacity:1; transform:none; transition:none; }
  header.menu-open .nav-more-pop .nav-dl-pop { display:flex; }
}
.nav-right { display:flex; gap:10px; align-items:center; position:relative; }
.icon-btn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:var(--glass-nav); color:var(--text-2); backdrop-filter:blur(12px) saturate(170%); -webkit-backdrop-filter:blur(12px) saturate(170%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot); display:flex; align-items:center; justify-content:center; transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s,color .3s; }
.icon-btn:hover { background:var(--glass-tint); color:var(--accent-1); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot); transform:scale(1.1); }
.icon-btn.pop { animation:btnPop .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes btnPop { 0%{transform:scale(1)} 35%{transform:scale(1.3)} 70%{transform:scale(.94)} 100%{transform:scale(1)} }
.hamburger { display:none; flex-direction:column; align-items:center; justify-content:center; gap:4.5px; }
.hamburger i { display:block; width:18px; height:2px; border-radius:2px; background:currentColor; transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s; }
header.menu-open .hamburger i:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
header.menu-open .hamburger i:nth-child(2) { opacity:0; }
header.menu-open .hamburger i:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }
.menu-title { display:none; }

/* 主题选择悬浮窗 */
.theme-pop { position:fixed; top:0; right:0; z-index:1300; min-width:210px; padding:10px; border-radius:20px; background:var(--glass-strong); backdrop-filter:blur(34px) saturate(190%); -webkit-backdrop-filter:blur(34px) saturate(190%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); opacity:0; transform:translateY(10px) scale(.95); pointer-events:none; transition:opacity .35s,transform .45s cubic-bezier(.34,1.56,.64,1); transform-origin:top right; }
.theme-pop.show { opacity:1; transform:none; pointer-events:auto; }
.theme-pop { max-height:min(72vh,420px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--accent-1) transparent; }
.theme-pop::-webkit-scrollbar { width:6px; }
.theme-pop::-webkit-scrollbar-thumb { background:var(--accent-1); border-radius:3px; }
.tp-item { display:flex; align-items:center; gap:10px; width:100%; border:none; cursor:pointer; padding:9px 12px; border-radius:14px; background:transparent; color:var(--c); font-size:13.5px; font-weight:600; transition:background .25s,transform .35s cubic-bezier(.34,1.56,.64,1); }
.tp-item:hover { background:var(--tint); transform:translateX(3px); }
.tp-item.cur { background:var(--tint); }
.tp-item.cur::after { content:'✓'; margin-left:auto; font-weight:800; }
body.dark-mode .tp-item[data-i="3"], body.dark-mode .tp-item[data-i="3"] .tp-ico { color:#e8eaf4 !important; }
body.theme-amber .btn-primary, body.theme-amber .badge-btn, body.theme-amber .ext-install, body.theme-amber .dl-go, body.theme-amber .btn-glass { color:#241505; }
body.theme-amber .ring-num, body.theme-amber .st-trend, body.theme-amber .st-icon, body.theme-amber .feat-link { color:#241505; }
.tp-ico { width:24px; height:24px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--tint); color:var(--c); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.08); }

.qq-pop { position:fixed; top:0; right:0; z-index:1300; background:var(--glass-strong); backdrop-filter:blur(40px) saturate(200%); -webkit-backdrop-filter:blur(40px) saturate(200%); border-radius:18px; padding:14px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); opacity:0; transform:translateY(8px) scale(.92); pointer-events:none; transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.64,1); z-index:50; max-height:min(72vh,460px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--accent-1) transparent; }
.qq-pop::-webkit-scrollbar { width:6px; }
.qq-pop::-webkit-scrollbar-thumb { background:var(--accent-1); border-radius:3px; }
.qq-pop.show { opacity:1; transform:none; pointer-events:auto; }
.qq-pop > img { display:block; width:168px; max-width:100%; height:auto; border-radius:12px; }
.qq-pop span { display:block; margin-top:9px; font-size:12.5px; font-weight:600; color:var(--text-1); text-align:center; white-space:nowrap; }
@media (max-width:560px) {
  .theme-pop, .qq-pop { max-width:min(86vw,264px); }
  .qq-pop > img { width:100%; }
  .qq-pop span { white-space:normal; }
}

/* ---------- 按钮 ---------- */
.btn { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:50px; border:none; cursor:pointer; font-size:15px; font-weight:700; letter-spacing:.2px; white-space:nowrap; color:var(--text-1); position:relative; overflow:hidden; transform:perspective(600px) rotateX(var(--rx,0)) rotateY(var(--ry,0)); transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .45s,background .4s; }
.btn svg { flex:none; }
.btn::after { content:''; position:absolute; top:0; left:-120%; width:70%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent); transform:skewX(-22deg); transition:left .6s ease; pointer-events:none; }
.btn:hover::after { left:150%; }
.btn-primary { background:var(--glass-tint); color:var(--accent-1); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 10px 24px var(--accent-glow); }
.btn-primary:hover { background:var(--glass-tint-2); transform:perspective(600px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(-4px); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 18px 40px var(--accent-glow); }
.btn-glass { background:var(--glass-card); color:var(--text-1); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), var(--shadow); }
.btn-glass:hover { background:var(--glass-strong); transform:perspective(600px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(-3px); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), var(--shadow-hover); }
.btn:active { transform:perspective(600px) translateY(-1px) scale(.97); }
.badge-btn { display:inline-flex; align-items:center; gap:8px; margin-bottom:24px; padding:10px 20px; border-radius:50px; border:none; cursor:default; font-size:13.5px; font-weight:700; color:var(--accent-1); background:var(--glass-tint); backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%); box-shadow:inset 0 2px 0 var(--glass-hi-top), inset 0 -2px 0 var(--glass-hi-bot), 0 8px 20px var(--accent-glow); }

/* ---------- 卡片 ---------- */
.card { background:var(--glass-card); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%); border-radius:24px; box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); position:relative; overflow:hidden; z-index:0; transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)); transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .5s,background .5s; will-change:transform; }
.card::after { content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1; background:linear-gradient(135deg,var(--glass-tint),transparent 60%); opacity:0; transition:opacity .5s ease; }
.card:hover { box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover); --ty:-5px; }
.card:hover::after { opacity:1; }
.ripple { position:absolute; border-radius:50%; background:currentColor; opacity:.16; transform:scale(0); animation:ripple .7s ease-out forwards; pointer-events:none; z-index:3; }
@keyframes ripple { to { transform:scale(4); opacity:0; } }

/* ---------- Hero ---------- */
main { display:flex; align-items:center; gap:56px; padding:150px 5% 90px; min-height:100vh; max-width:1420px; margin:0 auto; flex-wrap:wrap; }
.text-area { flex:1 1 420px; min-width:300px; }
h1 { font-size:clamp(38px,6vw,60px); line-height:1.16; font-weight:800; letter-spacing:-1px; margin-bottom:8px; }
.grad { background:var(--grad-title); -webkit-background-clip:text; background-clip:text; color:transparent; }
.handwritten { display:inline-block; margin-left:.45em; font-family:'Comic Sans MS','Segoe Print','Kaiti SC',cursive; font-style:italic; font-weight:800; font-size:.56em; line-height:1; vertical-align:.1em; background:linear-gradient(180deg,var(--grad-eng-a),var(--grad-eng-b)); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.desc { font-size:17.5px; line-height:1.75; color:var(--text-2); margin:22px 0 32px; max-width:520px; }
.btns { display:flex; gap:14px; flex-wrap:wrap; }

/* 终端产品图 */
.term { flex:1 1 440px; min-width:330px; padding:16px; }
.term-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.dot { width:12px; height:12px; border-radius:50%; cursor:pointer; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.dot:hover { transform:scale(1.3); }
.dot-r { background:#ff5f57; } .dot-y { background:#ffbd2e; } .dot-g { background:#28c840; }
.term-title { margin-left:8px; font-size:12px; color:var(--text-3); letter-spacing:.4px; }
.terminal-image { width:100%; border-radius:12px; display:none; }
.term-fallback { display:none; width:100%; height:auto; border-radius:12px; }
.term-fallback.show { display:block; }
.term.shake { animation:termShake .5s ease; }
.term.glow { box-shadow:0 0 60px rgba(255,189,46,.5), inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow-hover) !important; }
.term.scaled { transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px) scale(1.03); }
@keyframes termShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px) rotate(-1.5deg)} 40%{transform:translateX(9px) rotate(1.5deg)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

/* ---------- 通用区块 ---------- */
section, .stats-wrap { padding:86px 5%; max-width:1420px; margin:0 auto; position:relative; }
.section-title { text-align:center; font-size:clamp(30px,4.6vw,44px); font-weight:800; letter-spacing:-.5px; margin-bottom:14px; }
.handwritten-title { display:inline-block; margin-left:.45em; font-family:'Comic Sans MS','Segoe Print','Kaiti SC',cursive; font-style:italic; font-weight:800; font-size:.5em; vertical-align:.12em; background:linear-gradient(180deg,var(--grad-eng-a),var(--grad-eng-b)); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.title-logo { display:inline-flex; align-items:center; justify-content:center; vertical-align:-.14em; margin-right:.22em; width:1.3em; height:1.3em; border-radius:.3em; overflow:visible; }
.title-logo img { width:100%; height:100%; object-fit:contain; display:none; }
.section-sub { text-align:center; color:var(--text-3); font-size:16px; margin:0 auto 52px; max-width:620px; }
.watermark { position:absolute; right:-18px; bottom:-20px; width:120px; height:120px; color:var(--accent-1); opacity:.05; pointer-events:none; z-index:0; }

/* ---------- 为什么选择 ---------- */
.feat-show { position:relative; max-width:880px; margin:0 auto; }
.feat-stage { position:relative; height:440px; padding-top:84px; }
.feat-panel { position:absolute; left:0; right:0; top:0; bottom:0; padding:36px 48px 32px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:var(--op,0); transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--off,0px)) scale(var(--sc,1)) rotate(var(--rot,0deg)); cursor:pointer; transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .5s; border-radius:26px; will-change:transform; }
.feat-panel.active { opacity:var(--op,1); }
.feat-panel.cur { box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), var(--shadow); }
.feature-num { position:absolute; top:16px; right:28px; font-size:60px; font-weight:800; line-height:1; color:var(--accent-1); opacity:.13; letter-spacing:-2px; }
.feature-icon { width:52px; height:52px; border-radius:50%; margin-bottom:12px; background:var(--glass-tint); color:var(--accent-1); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%); box-shadow:inset 0 1px 0 var(--glass-hi-top), inset 0 -1px 0 var(--glass-hi-bot), 0 8px 20px var(--accent-glow); display:flex; align-items:center; justify-content:center; transition:transform .55s cubic-bezier(.34,1.56,.64,1),box-shadow .4s; }
.feat-panel.active:hover .feature-icon { transform:scale(1.12) rotate(-6deg); }
.feat-panel h3 { font-size:24px; margin-bottom:6px; position:relative; z-index:1; }
.feat-panel > p { color:var(--text-3); font-size:14.5px; line-height:1.75; max-width:520px; margin:0 auto 12px; position:relative; z-index:1; }
