	<script>
		// 智能劫持：本地优先，404 回退官方 CDN
		(function(){
			const CDN_BASE = 'https://creation.bcmcdn.com/neko/web/release/';
			const LOCAL_BASE = '/app/player/';
			
			// 劫持 fetch
			const origFetch = window.fetch;
			window.fetch = async function(url, opts) {
				if (typeof url === 'string' && url.startsWith(CDN_BASE)) {
					const localUrl = LOCAL_BASE + url.replace(CDN_BASE, '');
					try {
						const resp = await origFetch(localUrl, opts);
						if (resp.ok) return resp;
					} catch(e) {}
					// 本地 404，回退官方
					return origFetch(url, opts);
				}
				return origFetch(url, opts);
			};
			
			// 劫持 XMLHttpRequest
			const origOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function(method, url, ...args) {
				if (typeof url === 'string' && url.startsWith(CDN_BASE)) {
					const localUrl = LOCAL_BASE + url.replace(CDN_BASE, '');
					// 先尝试本地
					this._originalUrl = url;
					this._localUrl = localUrl;
					return origOpen.call(this, method, localUrl, ...args);
				}
				return origOpen.call(this, method, url, ...args);
			};
			
			const origSend = XMLHttpRequest.prototype.send;
			XMLHttpRequest.prototype.send = function(...args) {
				const self = this;
				if (this._localUrl) {
					this.addEventListener('error', function() {
						// 本地失败，重试官方
						const xhr2 = new XMLHttpRequest();
						xhr2.open(this._method || 'GET', this._originalUrl);
						xhr2.send(...args);
					}, { once: true });
				}
				return origSend.apply(this, args);
			};
			
			// 劫持动态创建的 script/link 标签
			const origAppendChild = document.head.appendChild;
			const origInsertBefore = document.head.insertBefore;
			function hijackElement(el) {
				if (el.tagName === 'SCRIPT' && el.src && el.src.startsWith(CDN_BASE)) {
					const localSrc = LOCAL_BASE + el.src.replace(CDN_BASE, '');
					// 先尝试本地
					el.src = localSrc;
					el.onerror = function() {
						// 本地 404，回退官方
						el.src = CDN_BASE + el.src.replace(LOCAL_BASE, '');
					};
				}
				if (el.tagName === 'LINK' && el.href && el.href.startsWith(CDN_BASE)) {
					const localHref = LOCAL_BASE + el.href.replace(CDN_BASE, '');
					el.href = localHref;
					el.onerror = function() {
						el.href = CDN_BASE + el.href.replace(LOCAL_BASE, '');
					};
				}
			}
			document.head.appendChild = function(el) { hijackElement(el); return origAppendChild.call(this, el); };
			document.head.insertBefore = function(el, ref) { hijackElement(el); return origInsertBefore.call(this, el, ref); };
		})();
	</script>

	<script>
		(function(){
			var css = document.createElement('style');
			css.textContent = [
				':root{--B4:#fff !important;--B10:#fff !important;--B2:#fff !important;}',
				'[class*="Loading_loadingWrapper"]{background-color:#fff !important;}',
				'[class*="Loading_loadingAnimation"] > img{display:none !important;}',
				'[class*="Loading_loadingWrapper"] > div:last-child{display:none !important;}'
			].join('\n');
			document.head.appendChild(css);

			var SPN='<div class="mdui-spinner-layer mdui-spinner-layer-1"><div class="mdui-spinner-circle-clipper mdui-spinner-left"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-gap-patch"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-circle-clipper mdui-spinner-right"><div class="mdui-spinner-circle"></div></div></div><div class="mdui-spinner-layer mdui-spinner-layer-2"><div class="mdui-spinner-circle-clipper mdui-spinner-left"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-gap-patch"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-circle-clipper mdui-spinner-right"><div class="mdui-spinner-circle"></div></div></div><div class="mdui-spinner-layer mdui-spinner-layer-3"><div class="mdui-spinner-circle-clipper mdui-spinner-left"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-gap-patch"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-circle-clipper mdui-spinner-right"><div class="mdui-spinner-circle"></div></div></div><div class="mdui-spinner-layer mdui-spinner-layer-4"><div class="mdui-spinner-circle-clipper mdui-spinner-left"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-gap-patch"><div class="mdui-spinner-circle"></div></div><div class="mdui-spinner-circle-clipper mdui-spinner-right"><div class="mdui-spinner-circle"></div></div></div>';
			var spinnerHtml='<div class="mdui-spinner-wrap" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"><div class="mdui-spinner mdui-spinner-colorful" style="width:72px;height:72px;">'+SPN+'</div></div>';

			function patchOnce(){
				var anims = document.querySelectorAll('[class*="Loading_loadingAnimation"]');
				for (var i = 0; i < anims.length; i++) {
					if (!anims[i].dataset.__mdPatched) {
						anims[i].dataset.__mdPatched = '1';
						anims[i].style.position = 'relative';
						var _img = anims[i].querySelector('img');
						if (_img) _img.style.display = 'none';
						anims[i].insertAdjacentHTML('beforeend', spinnerHtml);
					}
				}
				var wrappers = document.querySelectorAll('[class*="Loading_loadingWrapper"]');
				for (var j = 0; j < wrappers.length; j++) {
					var _last = wrappers[j].lastElementChild;
					if (_last && _last.tagName === 'DIV') {
						_last.style.display = 'none';
					}
				}
			}

			var ob = new MutationObserver(function(){ patchOnce(); });
			function start(){
				patchOnce();
				if (document.body) ob.observe(document.body, {childList: true, subtree: true});
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', start);
			} else {
				start();
			}
		})();
	</script>

		// 兼容：播放器 patch 调用 window.kauth.c()，auth.js 暴露 window.keauth.decrypt()
		window.kauth = {

			e: function(workText, authChar) { return window.keauth.encrypt(workText, authChar); }
		};

	<div id="root"></div>
	<script>
		// 监听并替换官方 loading 动画为 MDUI spinner
		function replaceLoading() {
			var loadingEl = document.querySelector('.Loading_loadingAnimation__iJPsO');
			if (loadingEl && !loadingEl.dataset.replaced) {
				loadingEl.style.display = 'flex';
				loadingEl.style.alignItems = 'center';
				loadingEl.style.justifyContent = 'center';
				loadingEl.style.width = '100%';
				loadingEl.style.height = '100%';
				loadingEl.innerHTML = '<div class="mdui-spinner mdui-spinner-colorful" style="width:80px;height:80px;"></div>';
				loadingEl.dataset.replaced = 'true';
				mdui.mutation();
			}
		}
		replaceLoading();
		var observer = new MutationObserver(function(mutations) {
			replaceLoading();
		});
		observer.observe(document.body, { childList: true, subtree: true });
	</script>
	<script>
		(function(){
			try{
				var _auto = new URLSearchParams(location.search).get('auto');
				if(_auto !== '1') return;
				function tryClick(){
					var el = document.querySelector('[class*="CoverMask_start"]');
					if(!el){ setTimeout(tryClick, 100); return; }
					el.click();
					var kids = el.querySelectorAll('*');
					for(var i=0;i<kids.length;i++){ kids[i].click(); }
				}
				if(document.readyState === 'loading'){
					document.addEventListener('DOMContentLoaded', tryClick);
				}else{
					tryClick();
				}
				var _ob = new MutationObserver(function(){ tryClick(); });
				if(document.body) _ob.observe(document.body, {childList:true, subtree:true});
				setTimeout(function(){ _ob.disconnect(); }, 15000);
			}catch(e){}
		})();
	</script>
