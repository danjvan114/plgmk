	<script>
		// 智能劫持：本地优先，404 回退官方 CDN
		(function(){
			const CDN_BASE = 'https://creation.bcmcdn.com/neko/web/release/';
			const LOCAL_BASE = '/app/player/';
			
			// 劫持 fetch
			const origFetch = window.fetch;
			window.fetch = async function(url, opts) {
				if (typeof url === 'string' && url.startsWith(CDN_BASE)) {
					const localUrl = LOCAL_BASE + url.replace(CDN_BASE, '');
					try {
						const resp = await origFetch(localUrl, opts);
						if (resp.ok) return resp;
					} catch(e) {}
					// 本地 404，回退官方
					return origFetch(url, opts);
				}
				return origFetch(url, opts);
			};
			
			// 劫持 XMLHttpRequest
			const origOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function(method, url, ...args) {
				if (typeof url === 'string' && url.startsWith(CDN_BASE)) {
					const localUrl = LOCAL_BASE + url.replace(CDN_BASE, '');
					// 先尝试本地
					this._originalUrl = url;
					this._localUrl = localUrl;
					return origOpen.call(this, method, localUrl, ...args);
				}
				return origOpen.call(this, method, url, ...args);
			};
			
			const origSend = XMLHttpRequest.prototype.send;
			XMLHttpRequest.prototype.send = function(...args) {
				const self = this;
				if (this._localUrl) {
					this.addEventListener('error', function() {
						// 本地失败，重试官方
						const xhr2 = new XMLHttpRequest();
						xhr2.open(this._method || 'GET', this._originalUrl);
						xhr2.send(...args);
					}, { once: true });
				}
				return origSend.apply(this, args);
			};
			
			// 劫持动态创建的 script/link 标签
			const origAppendChild = document.head.appendChild;
			const origInsertBefore = document.head.insertBefore;
			function hijackElement(el) {
				if (el.tagName === 'SCRIPT' && el.src && el.src.startsWith(CDN_BASE)) {
					const localSrc = LOCAL_BASE + el.src.replace(CDN_BASE, '');
					// 先尝试本地
					el.src = localSrc;
					el.onerror = function() {
						// 本地 404，回退官方
						el.src = CDN_BASE + el.src.replace(LOCAL_BASE, '');
					};
				}
				if (el.tagName === 'LINK' && el.href && el.href.startsWith(CDN_BASE)) {
					const localHref = LOCAL_BASE + el.href.replace(CDN_BASE, '');
					el.href = localHref;
					el.onerror = function() {
						el.href = CDN_BASE + el.href.replace(LOCAL_BASE, '');
					};
				}
			}
			document.head.appendChild = function(el) { hijackElement(el); return origAppendChild.call(this, el); };
			document.head.insertBefore = function(el, ref) { hijackElement(el); return origInsertBefore.call(this, el, ref); };
		})();
	</script>

	<div id="root"></div>
	<script>
		// 监听并替换官方 loading 动画为 MDUI spinner
		function replaceLoading() {
			var loadingEl = document.querySelector('.Loading_loadingAnimation__iJPsO');
			if (loadingEl && !loadingEl.dataset.replaced) {
				loadingEl.style.display = 'flex';
				loadingEl.style.alignItems = 'center';
				loadingEl.style.justifyContent = 'center';
				loadingEl.style.width = '100%';
				loadingEl.style.height = '100%';
				loadingEl.innerHTML = '<div class="mdui-spinner mdui-spinner-colorful" style="width:80px;height:80px;"></div>';
				loadingEl.dataset.replaced = 'true';
				mdui.mutation();
			}
		}
		// 立即尝试替换
		replaceLoading();
		// 监听 DOM 变化
		var observer = new MutationObserver(function(mutations) {
			replaceLoading();
		});
		observer.observe(document.body, { childList: true, subtree: true });
	</script>
