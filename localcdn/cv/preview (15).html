<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<link rel="stylesheet" href="icons.css">
<script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kitten云画板/title>


<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
html,body {height:100vh;overflow:hidden;background:#f8f8ff;}
.mdui-bt  {border-radius: 20px;}
.mdui-bt-pf  {border-radius: 8px;}







.btnsl {position: fixed;}

.close-bnt {
    max-width: 80px; /* 最大宽度为800像素 */
    max-height: 60px; /* 最大高度为600像素 */
}
/* 外层网格容器 */
.editor-wrap {
  display: grid;
  width:100%;
  height:100%;
  /* 行：头部固定 / 主体自适应 / 底部固定 */
  grid-template-rows: 64px 1fr 110px;
  /* 列：左侧面板宽 / 画布自适应 / 右侧面板宽 */
  grid-template-columns: 310px 1fr 250px;
  grid-template-areas:
    "header header header"
    "left    canvas right"
    "left    bottom right";
  gap:6px;
  padding:6px;
}
/* 禁止画板内任何文字被选中、任何图片被浏览器原生抽拖（避免拖拽触发搜索） */
.editor-wrap, .editor-wrap * {
  -webkit-user-select:none; -moz-user-select:none; user-select:none;
  -webkit-user-drag:none;
}
.editor-wrap svg { -webkit-user-drag:none; }
.editor-wrap textarea, .editor-wrap input { -webkit-user-select:text; user-select:text; }
#exportOverlay { -webkit-user-select:text; user-select:text; }
#exportImg { -webkit-user-drag:element; }
.editor-header    {grid-area:header;background:#fff;border-radius:10px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;}
.panel-left       {grid-area:left;background:#fff;border-radius:10px;padding:12px;overflow:auto;}
.canvas-container {grid-area:canvas;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.panel-right      {grid-area:right;background:#fff;border-radius:10px;padding:12px;overflow:auto;}
.bar-bottom       {grid-area:bottom;background:#fff;border-radius:10px;padding:10px;display:flex;align-items:center;gap:12px;}

/* 虚拟元素样式 */
.title-left {font-weight:bold;font-size:18px;}
.btn {padding:8px 16px;border:none;border-radius:8px;background:#7b61ff;color:#fff;cursor:pointer;}
.canvas-area {width:80%;height:80%;background:#fcfcfc;border:1px solid #eee;}



/* 图形库卡片网格?*/
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
  gap: 14px;
  width: 100%;
  padding: 10px;
}
.card-item {
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
}
.card-item img {
  width: 100%;
  height: auto;
  display: block;
}




.color-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
}
.color-item {
    border-radius: 999px;
    width: 30px;
    height: 30px;
}
</style>
</head>
<body>
<div class="editor-wrap">
  <!-- 头部栏?-->
  <div class="editor-header">
    <div class="mdui-btn mdui-bt mdui-ripple mdui-color-orange-400 mdui-ripple-black "><i class="mdui-icon material-icons">close</i>关闭</div>
    <div>
      <a mdui-menu="{target: '#exp'}" class="mdui-btn mdui-bt mdui-ripple mdui-color-blue-400"><i class="mdui-icon material-icons">cloud_download</i>导出</a>
      <ul class="mdui-menu" id="exp">
        <li class="mdui-menu-item">
          <a onclick="exportCurrentFramePNG()"  class="mdui-ripple">导出PNG</a>
        </li>
        <li class="mdui-menu-item">
          <a onclick="exportCurrentFrameSVG()"  class="mdui-ripple">导出SVG</a>
        </li>
        <li class="mdui-menu-item">
          <a onclick="exportAllFramesPNG()"  class="mdui-ripple">导出所有PNG</a>
        </li>
        <li class="mdui-menu-item">
          <a onclick="exportAllFramesSVG()"  class="mdui-ripple">导出所有SVG</a>
        </li>
        <li class="mdui-menu-item">
          <a onclick=""  class="mdui-ripple">取消操作</a>
        </li>
      </ul>
      
      
      
      
      
      <a class="mdui-btn mdui-bt mdui-ripple mdui-color-purple-300" onclick="showExportPopup()"><i class="mdui-icon material-icons">done</i>添加</a>
    </div>
  </div>

  <!-- 宸左侧功能面板 -->
  <div class="panel-left">
    <div class="btnsl">
      <div class="mdui-btn mdui-bt-pf mdui-ripple mdui-color-pink-a100 mdui-ripple-black "><i class="mdui-icon material-icons">view_quilt</i><a>图形</a></div>
      <div class="mdui-btn mdui-bt-pf mdui-ripple mdui-color-blue-600 mdui-ripple-black "><i class="mdui-icon material-icons">text_fields</i><a>文字</a></div>
      <div class="mdui-btn mdui-bt-pf mdui-ripple mdui-color-teal-400 mdui-ripple-black "><i class="mdui-icon material-icons">add_circle_outline</i><a>上传</a></div>
    </div>
    <div>
      
      <div class="card-grid" id="picsggd">
       
      </div>
    </div>
  </div>

  <!-- 中间绘图区域 -->
  <div class="canvas-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div style="margin-top:10px;">
      <div class="mdui-btn" ><i class="mdui-icon material-icons">replay</i>撤销</div>
      <div class="mdui-btn" ><i class="mdui-icon material-icons">refresh</i>重做</div>

    </div>
  </div>


  



<!-- 右侧属性面板面板?-->
<div class="panel-right">
  <div class="aalft" style="display:flex;width:100%;max-height:120px;position:relative;overflow:hidden;">
      <!-- 左侧固定64px，内部上下布局 -->
      <div style="width:64px;display:flex;flex-direction:column;">
          <div mdui-tooltip="{content: '选择'}" class="c1aa" style="flex:1;display:flex;align-items:center;justify-content:center;padding:4px;">
              <img alt="" style="width:100%;height:100%;object-fit:contain;">
          </div>
          <div mdui-tooltip="{content: '拖动'}"class="c2aa" style="flex:1;display:flex;align-items:center;justify-content:center;padding:4px;">
              <img alt="" style="width:100%;height:100%;object-fit:contain;">
          </div>
      </div>
      <!-- 右侧自适应区域 -->
      <div class="c3aa" style="flex:1;display:flex;align-items:center;">
          <div mdui-tooltip="{content: '绘制'}" class="pen" style="width:50%;display:flex;align-items:center;justify-content:center;">
              <img alt="" style="width:100%;object-fit:contain;">
          </div>
          <div mdui-tooltip="{content: '橡皮擦}"class="eraser" style="width:50%;display:flex;align-items:center;justify-content:center;">
              <img alt="" style="width:100%;object-fit:contain;">
          </div>
      </div>
      <!-- 底部区域占位，拉伸方向向下延伸超出部分?-->
      
  </div>

</style>

  <div class="color-grid">
    <div class="color-item" style="background-color:#F12629;"></div>
    <div class="color-item" style="background-color:#F97721;"></div>
    <div class="color-item" style="background-color:#FBEC1F;"></div>
    <div class="color-item" style="background-color:#2DEC86;"></div>
    <div class="color-item" style="background-color:#17C7FF;"></div>
    <div class="color-item" style="background-color:#178fff;"></div>
    <div class="color-item" style="background-color:#6B56FE;"></div>
    <div class="color-item" style="background-color:#FC6BCD;"></div>
    <div id="active-color" class="color-item active" style="background-color:#FF9900;"></div>

  </div>
  <button class="mdui-btn mdui-btn-block mdui-color-theme-accent mdui-ripple">颜色选择器?/button>
</div>

<div style="display: flex; gap: 10px; align-items: center;">
  
  
  
  <div mdui-tooltip="{content: '上移'}" style="height: 35px;width: 35px;" class="mdui-ripple color-item ci01">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
  <div mdui-tooltip="{content: '下移'}" style="height: 35px;width: 35px;" class="mdui-ripple color-item ci02">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
  <div mdui-tooltip="{content: '置顶'}"style="height: 35px;width: 35px;" class="mdui-ripple color-item ci03">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
  <div mdui-tooltip="{content: '置底'}"style="height: 35px;width: 35px;" class="mdui-ripple color-item ci04">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
  <div mdui-tooltip="{content: '左右翻转'}"style="height: 35px;width: 35px;" class="mdui-ripple color-item ci05">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
  <div mdui-tooltip="{content: '上下翻转'}"style="height: 35px;width: 35px;" class="mdui-ripple color-item ci06">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>

  <div mdui-tooltip="{content: '裁剪'}"style="height: 35px;width: 35px;display:none;" class="mdui-ripple color-item ci07">
    <img style="height: 100%;width: 100%;object-fit: contain;" alt="">
  </div>
</div>






  <!-- 底部普通时间轴样式?-->
  <div class="bar-bottom">
    <div class="res-menu" id="resMenu">
      <div class="res-current" id="resCurrent">480&times;360</div>
      <div class="res-pop" id="resPop">
        <div class="res-opt" data-w="480" data-h="360">480&times;360</div>
        <div class="res-opt" data-w="800" data-h="600">800&times;600</div>
        <div class="res-opt" data-w="1024" data-h="1024">1024&times;1024</div>
        <div class="res-opt" data-w="1920" data-h="1080">1920&times;1080</div>
        <div class="res-opt" data-w="4096" data-h="4096">4096&times;4096</div>
        <div class="res-custom">
          <input id="resW" class="res-input" type="number" min="1" inputmode="numeric"/>
          <span class="res-x">&times;</span>
          <input id="resH" class="res-input" type="number" min="1" inputmode="numeric"/>
          <button id="resApply" class="res-apply"></button>
        </div>
      </div>
    </div>
    <div class="act-ctl" style="display:flex;align-items:center;gap:6px;margin-right:6px;">
      <div id="undoBtn" class="mdui-btn mdui-btn-icon mdui-ripple" title="撤销"><i class="mdui-icon material-icons">replay</i></div>
      <div id="delBtn" class="mdui-btn mdui-btn-icon mdui-ripple" title="删除"><i class="mdui-icon material-icons">delete</i></div>
      <div id="redoBtn" class="mdui-btn mdui-btn-icon mdui-ripple" title="重做"><i class="mdui-icon material-icons">refresh</i></div>
      <div class="zoom-ctl" style="display:flex;align-items:center;gap:4px;margin-left:6px;">
        <div id="zoomInBtn" class="mdui-btn mdui-btn-icon mdui-ripple" title="放大"><i class="mdui-icon material-icons">add</i></div>
        <input id="zoomInput" class="mdui-textfield-input" type="text" value="100%" style="width:60px;text-align:center;">
        <div id="zoomOutBtn" class="mdui-btn mdui-btn-icon mdui-ripple" title="缩小"><i class="mdui-icon material-icons">remove</i></div>
      </div>
    </div>
  </div>
</div>

<script src="editor.js"></script>
<script>
  document.addEventListener('dragstart', function (e) {
    if (!(e.target && e.target.id === 'exportImg')) e.preventDefault();
  });
  function openImageModal(src, file) {
    var overlay = document.getElementById('exportOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'exportOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;';
      overlay.innerHTML = ''
        + '<div style="position:relative;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(90vw,1000px);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eee;font-size:16px;font-weight:500;color:#333;">'
        + '<span>\u5bfc\u51fa\u56fe\u7247</span>'
        + '<i id="exportClose" class="mdui-icon material-icons" style="cursor:pointer;color:#888;font-size:22px;line-height:1;">close</i>'
        + '</div>'
        + '<div style="padding:18px;overflow:auto;display:flex;align-items:center;justify-content:center;background:#fafafa;">'
        + '<img id="exportImg" alt="board" draggable="true" style="max-width:100%;max-height:72vh;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff;cursor:grab;"/>'
        + '</div>'
        + '<div style="padding:12px 18px;border-top:1px solid #eee;font-size:13px;color:#888;text-align:center;">\u628a\u56fe\u7247\u62d6\u5230\u4f60\u7684\u7f16\u8f91\u5668\u91cc</div>'
        + '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
      document.getElementById('exportClose').addEventListener('click', function () { overlay.remove(); });
      var im = document.getElementById('exportImg');
      im.addEventListener('dragstart', function (e) {
        if (e.dataTransfer) {
          e.dataTransfer.setData('text/plain', 'board.png');
          if (file && e.dataTransfer.items && e.dataTransfer.items.add) {
            e.dataTransfer.items.add(file);
          }
        }
      });
    }
    document.getElementById('exportImg').src = src;
  }
  function showExportPopup() {
    if (typeof window.svgString !== 'function') { alert('\u753b\u677f\u5c1a\u672a\u5c31\u7eea'); return; }
    var str = window.svgString();
    if (/<svg[^>]*>\s*<\/svg>/.test(str)) { alert('\u753b\u677f\u662f\u7a7a\u7684\uff0c\u5148\u753b\u70b9\u4e1c\u897f\u518d\u70b9\u6dfb\u52a0'); return; }
    var m = /viewBox="([^"]+)"/.exec(str);
    if (!m) { alert('\u753b\u677f\u4e3a\u7a7a'); return; }
    var p = m[1].split(' ');
    var w = Math.max(1, Math.ceil(parseFloat(p[2])));
    var h = Math.max(1, Math.ceil(parseFloat(p[3])));
    var url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataURL = c.toDataURL('image/png');
      c.toBlob(function (blob) {
        var file = new File([blob], 'board.png', { type: 'image/png' });
        URL.revokeObjectURL(url);
        openImageModal(dataURL, file);
      }, 'image/png');
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert('\u5bfc\u51fa\u5931\u8d25'); };
    img.src = url;
  }
</script>
