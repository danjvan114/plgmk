// 获取容器
const container = document.getElementById('picsggd');

// 循环生成卡片
// 循环渲染，index作为自增id
svgBase64List.forEach((base64, index) => {
  const item = document.createElement('div');
  item.className = 'card-item';
  // id 按顺序：icon-0、icon-1、icon-2 ...
  item.id = `icon-${index}`;
  item.innerHTML = `<img src="${base64}" alt="svg-icon">`;
  container.appendChild(item);
});
