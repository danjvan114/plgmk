<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告页面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .notice-wrap {
            width:100%;
            height:100%;
            display:flex;
        }
        .notice-content {
            flex:1;
            padding:20px;
            overflow:auto;
        }
        .notice-sidebar {
            width:220px;
            border-left:1px solid #e5e5e5;
            overflow-y:auto;
        }
        .notice-item {
            display:none;
        }
        .notice-item.active {
            display:block;
        }
    </style>
</head>
<body class="mdui-theme-light">

<div class="notice-wrap">
    <div class="notice-content">
        <!-- 公告内容区域，新增公告复制notice-item块 -->
        <div class="notice-item" data-gid="1">
            <p>系统更新通知</p>
            <p>当前版本为26.14.2，正在使用新的预览版，如果遇到问题，请及时反馈。</p>
            <a href="https://qm.qq.com/q/DVteU5QRNu" target="_blank">https://qm.qq.com/q/DVteU5QRNu</a>
            <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEY-mJqezETEdhmnMoucEwbiIyjhXm4bgACeioAAmsm2FcKDclIeIoVyz0E.png" style="max-width:100%;margin-top:10px;">
        </div>
        <!--
        <div class="notice-item" data-gid="2">
            <p>第二条公告</p>
        </div>
        -->
    </div>
    <div class="notice-sidebar">
        <ul class="mdui-list">
            <!-- 右侧列表，点击切换公告，新增公告同步加li -->
            <li class="mdui-list-item mdui-ripple" data-gid="1" onclick="switchNotice('1')">
                <div class="mdui-list-item-content">系统更新通知</div>
            </li>
            <!--
            <li class="mdui-list-item mdui-ripple" data-gid="2" onclick="switchNotice('2')">
                <div class="mdui-list-item-content">第二个公告名字</div>
            </li>
            -->
        </ul>
    </div>
</div>

<script>
function switchNotice(gid) {
    document.querySelectorAll('.notice-item').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.mdui-list-item').forEach(el=>el.classList.remove('mdui-list-item-active'));

    const content = document.querySelector(`.notice-item[data-gid="${gid}"]`);
    const li = document.querySelector(`.mdui-list-item[data-gid="${gid}"]`);
    if(content) content.classList.add('active');
    if(li) li.classList.add('mdui-list-item-active');
}

// 页面载入自动激活gid=1公告
window.addEventListener('DOMContentLoaded', ()=>{
    switchNotice('1');
});

// iframe父页面调用接口
window.gds = {
    go: switchNotice
};
</script>
</body>
</html>
